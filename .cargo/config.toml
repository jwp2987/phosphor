[env]
# This is used to set the minimum deployment target for mac
# https://cmake.org/cmake/help/latest/envvar/MACOSX_DEPLOYMENT_TARGET.html
# If unset, it uses the system one, but we want to build for older versions
# of mac os by default.
#
# This should be kept in sync with the definition of this variable in
# `script/bundle`.
MACOSX_DEPLOYMENT_TARGET = "10.14"

[build]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-args=-Wl,-headerpad_max_install_names"]

[net]
git-fetch-with-cli = true

[target.'cfg(target_family = "wasm")']
rustflags = ["--cfg=web_sys_unstable_apis"]

# Local dev uses the mold linker, which greatly speeds up linking large debug
# binaries (e.g. zap-tui-oss). Target-specific rustflags fully override
# [build].rustflags, so we keep the general symbol-mangling setting here and
# drop the macOS-only `-headerpad_max_install_names` from [build] (meaningless
# on Linux).
# You need mold installed and on PATH first, otherwise linking will fail:
#   sudo apt-get install -y mold      # or unpack a prebuilt mold to ~/.local
# gcc 12+ / clang both support `-fuse-ld=mold`.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-arg=-fuse-ld=mold"]

# Static musl build (CLI / remote-server tarball).
# The `-Wl,-headerpad_max_install_names` in `[build].rustflags` is a
# macOS-only linker flag that makes musl-gcc error out; target-specific
# rustflags fully override `[build].rustflags`, so we only keep the general
# symbol-mangling setting here and explicitly enable crt-static to produce a
# fully static binary with no dependency on the host libc.
# The linker defaults to `cc` (on CI, musl-tools provides `musl-gcc`);
# override with CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER if needed
# (see script/deploy_remote_server).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "target-feature=+crt-static"]

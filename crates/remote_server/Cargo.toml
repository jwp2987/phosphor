[package]
name = "remote_server"
version = "0.1.0"
edition = "2024"
authors = ["Warp Team <dev@warp.dev>"]
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# Backs the bounded stderr tail buffer in `client/remote_server_log.rs`.
# Not a workspace dependency: `app` and `warpui_core` also pin it directly.
bounded-vec-deque = "0.1"
command.workspace = true
dashmap.workspace = true
dirs.workspace = true
futures.workspace = true
futures-lite.workspace = true
log.workspace = true
prost.workspace = true
repo_metadata.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
warp_core.workspace = true
warp_util.workspace = true
warpui.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-io.workspace = true
async-process.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# setup_tests.rs drives the real install script against a fabricated release
# tarball under a temp HOME (#440).
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["compat"] }
# `App::test` (used by manager_tests.rs to drive `RemoteServerManager` as a
# real model, matching the pinned oracle's manager_tests.rs) requires the
# `test-util` feature.
warpui = { workspace = true, features = ["test-util"] }

[build-dependencies]
prost-build.workspace = true

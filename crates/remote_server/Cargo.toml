[package]
name = "remote_server"
version = "0.1.0"
edition = "2024"
authors = ["Warp Team <dev@warp.dev>"]
publish.workspace = true
license.workspace = true

[lib]
name = "remote_server"
path = "src/lib.rs"

# The helper the app uploads to ssh hosts (Wave H, #1804). Build:
#   cargo build -p remote_server --profile release-remote-helper \
#     --no-default-features --features daemon --bin phosphor-remote
[[bin]]
name = "phosphor-remote"
path = "src/bin/phosphor-remote.rs"
required-features = ["daemon"]

[features]
# The app's side: manager model, transport, client, install/setup and the repo_metadata
# conversions. Everything that names warpui, warp_core, warp_util or repo_metadata.
default = ["client"]
client = ["dep:warpui", "dep:warp_core", "dep:warp_util", "dep:repo_metadata", "dep:serde_json"]
# The `phosphor-remote` helper's server core (added in later Wave H steps). Deliberately does
# NOT imply `client`: the helper is built with `--no-default-features --features daemon` and
# its dependency tree must contain no warpui (checked in CI by `cargo tree`).
daemon = ["dep:grep", "dep:ignore", "dep:serde_json", "dep:sha2", "dep:notify"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# Backs the bounded stderr tail buffer in `client/remote_server_log.rs`.
# Not a workspace dependency: `app` and `warpui_core` also pin it directly.
bounded-vec-deque = "0.1"
command.workspace = true
# Binary-vs-text sniffing shared by the helper's file reads and the shell backend's (same version
# as warp_util, so the lockfile gains nothing).
content_inspector = "0.2.4"
dashmap.workspace = true
dirs.workspace = true
futures.workspace = true
futures-lite.workspace = true
log.workspace = true
prost.workspace = true
repo_metadata = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
warp_core = { workspace = true, optional = true }
warp_util = { workspace = true, optional = true }
warpui = { workspace = true, optional = true }

# The helper's ripgrep search (daemon/ripgrep.rs): the same crates and versions `warp_ripgrep`
# uses, so the lockfile gains nothing.
grep = { version = "0.4.1", optional = true }
ignore = { version = "0.4.20", optional = true }
# The helper's filesystem watcher (daemon/watch.rs): the recommended inotify/FSEvents watcher with
# NO debouncer. Reuses the workspace's vendored notify, so the lockfile gains nothing.
notify = { workspace = true, optional = true }
# The index scan (daemon/chunk.rs): JSON output and SHA-256 hashes. No network, no async.
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-io.workspace = true
async-process.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# setup_tests.rs drives the real install script against a fabricated release
# tarball under a temp HOME (#440).
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["compat"] }
# `App::test` (used by manager_tests.rs to drive `RemoteServerManager` as a
# real model, matching the pinned oracle's manager_tests.rs) requires the
# `test-util` feature.
warpui = { workspace = true, features = ["test-util"] }

[build-dependencies]
prost-build.workspace = true

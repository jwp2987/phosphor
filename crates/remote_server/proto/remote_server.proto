// A protobuf-based API for communication between
// the Warp client and the remote server binary.
//
// Messages are length-prefixed: [4-byte little-endian length][protobuf bytes].

syntax = "proto3";

package remote_server;

// ── Top-level envelopes ───────────────────────────────────────────

// Top-level envelope for all client → server messages.
//
// Wraps every request/notification in one of three scoping envelopes so the
// daemon knows how to route it (Warp pin 02b53fcd8, "Add proper support for
// host scoped requests" #12036):
//
//   - HostScopedRequest: targets the host, not a specific connection. The
//     daemon *may* deliver the response on any open connection to that host.
//   - SessionScopedRequest: targets the connection that sent it; the
//     response always comes back on that same connection.
//   - Notification: fire-and-forget, no response.
//
// Deviation from the pin (#438, envelope-only scope): this port carries only
// the wire shape. It does not port the pin's cross-connection failover
// machinery (`RemoteServerManager::pending_host_requests`,
// `HostRequestHandle`, `host_response.rs` dispatch, `ClientEvent::
// HostScopedWriteFailed`) — the daemon still answers a host-scoped request
// on its originating connection only, identical to today's behavior. That
// failover behavior is a separate, larger feature increment left for a
// follow-up issue.
message ClientMessage {
  string request_id = 1;
  oneof message {
    HostScopedRequest host_scoped = 2;
    SessionScopedRequest session_scoped = 3;
    Notification notification = 4;
  }
}

// Request that targets the host, not a specific connection.
//
// Field numbers 12-16 (list_directory, resolve_path, create_directory,
// read_file_chunk, write_file_chunk) are fork-original: the pin does not
// have these RPCs at all, so there is no pin classification to follow for
// them. They are grouped here because they are one-shot, host-local
// filesystem operations with the same shape as `write_file`/`delete_file`,
// which the pin does classify as host-scoped.
//
// discard_files (17): reconciled here from #508 (merged first), which added
// `DiscardFilesRequest` directly to the old flat `ClientMessage` oneof
// because this envelope restructuring (#438) hadn't landed yet — see #508's
// own doc comment, which flagged exactly this move as required. Host-scoped
// for the same reason as write_file/delete_file: a one-shot host-local
// filesystem operation. Field number 17 is the next free slot in this
// fork-invented oneof, not a verified pin field number (unlike 1-11, which
// mirror the pin's classification; the exact pin numbering for this field
// was not available to check against).
message HostScopedRequest {
  oneof message {
    WriteFile write_file = 1;
    DeleteFile delete_file = 2;
    ReadFileContextRequest read_file_context = 3;
    SaveBuffer save_buffer = 4;
    ResolveConflict resolve_conflict = 5;
    GetBranches get_branches = 6;
    GitCommitChainRequest git_commit_chain = 7;
    GitPushRequest git_push = 8;
    GitCreatePrRequest git_create_pr = 9;
    GetCommittedBranchFilesRequest get_committed_branch_files = 10;
    RipgrepSearchRequest ripgrep_search = 11;
    ListDirectory list_directory = 12;
    ResolvePath resolve_path = 13;
    CreateDirectory create_directory = 14;
    ReadFileChunk read_file_chunk = 15;
    WriteFileChunk write_file_chunk = 16;
    DiscardFilesRequest discard_files = 17;
    // Remote codebase indexing (Delta D2, remote-daemon leg). The pin numbers
    // these 9, 10, 11 and 13; those slots are already taken in this fork by
    // git_create_pr, get_committed_branch_files, ripgrep_search and
    // resolve_path, which the pin does not have here. Renumbered to the next
    // free slots rather than renumbering this fork's existing fields, which
    // would break every deployed daemon. Host-scoped for the pin's reason: an
    // index belongs to the host, not to one SSH connection.
    IndexCodebase index_codebase = 18;
    DropCodebaseIndex drop_codebase_index = 19;
    GetFragmentMetadataFromHash get_fragment_metadata_from_hash = 20;
    ResyncCodebase resync_codebase = 21;
    // Remote codebase-index *search* (TODO.md "UNWIRED-CODE AUDIT 2026-08-10"
    // finding #5). Fork-original — the pin has **no** equivalent RPC at all,
    // field 22 is not a pin number renumbered around a collision like 18-21
    // above. At the pin, the daemon and the client share one vector store, so
    // the client resolves a search entirely on its own side by reading that
    // shared store directly; the daemon is only ever asked to map the
    // resulting content hashes back to files (GetFragmentMetadataFromHash).
    // This fork's daemon has no shared store — `codebase_index_store.rs`'s
    // module doc explains why: its vectors live in a private per-daemon
    // SQLite file the client cannot reach. So the search itself has to run
    // on the daemon, and the ranked result travels back over the wire
    // instead of being read out of local storage. Host-scoped for the same
    // reason as the mutations above: the index belongs to the host, not to
    // one SSH connection.
    SearchRemoteCodebase search_remote_codebase = 22;
  }
}

// Request that targets a specific connection/session.
// The response is always delivered on the originating connection.
message SessionScopedRequest {
  oneof message {
    Initialize initialize = 1;
    NavigatedToDirectory navigated_to_directory = 2;
    LoadRepoMetadataDirectory load_repo_metadata_directory = 3;
    RunCommandRequest run_command = 4;
    // Subscription-establishing requests: the daemon registers per-connection
    // state (buffer / diff-state subscriptions) keyed to the originating
    // connection, so the response must come back on that same connection.
    OpenBuffer open_buffer = 5;
    GetDiffState get_diff_state = 6;
  }
}

// Fire-and-forget message. No response is expected.
// The daemon processes these inline and does not track them.
message Notification {
  oneof message {
    Abort abort = 1;
    Authenticate authenticate = 2;
    SessionBootstrapped session_bootstrapped = 3;
    BufferEdit buffer_edit = 4;
    CloseBuffer close_buffer = 5;
    UnsubscribeDiffState unsubscribe_diff_state = 6;
    // The pin numbers this 3; taken here by session_bootstrapped.
    UpdatePreferences update_preferences = 7;
  }
}
// Top-level envelope for all server → client messages.
// Push messages use an empty request_id to distinguish them from
// request/response pairs.
message ServerMessage {
  string request_id = 1;
  oneof message {
    InitializeResponse initialize_response = 2;
    ErrorResponse error = 3;
    NavigatedToDirectoryResponse navigated_to_directory_response = 4;
    RepoMetadataSnapshot repo_metadata_snapshot = 5;
    RepoMetadataUpdatePush repo_metadata_update = 6;
    LoadRepoMetadataDirectoryResponse load_repo_metadata_directory_response = 7;
    WriteFileResponse write_file_response = 8;
    DeleteFileResponse delete_file_response = 9;
    RunCommandResponse run_command_response = 10;
    ReadFileContextResponse read_file_context_response = 11;
    OpenBufferResponse open_buffer_response = 14;
    BufferUpdatedPush buffer_updated = 15;
    SaveBufferResponse save_buffer_response = 16;
    ResolveConflictResponse resolve_conflict_response = 17;
    ListDirectoryResponse list_directory_response = 18;
    ResolvePathResponse resolve_path_response = 19;
    CreateDirectoryResponse create_directory_response = 20;
    ReadFileChunkResponse read_file_chunk_response = 21;
    WriteFileChunkResponse write_file_chunk_response = 22;
    RipgrepSearchResponse ripgrep_search_response = 23;
    GetBranchesResponse get_branches_response = 24;
    GetCommittedBranchFilesResponse get_committed_branch_files_response = 25;
    GetDiffStateResponse get_diff_state_response = 26;
    DiffStateSnapshot diff_state_snapshot = 27;
    DiffStateMetadataUpdate diff_state_metadata_update = 28;
    DiffStateFileDelta diff_state_file_delta = 29;
    BufferConflictDetected buffer_conflict_detected = 30;
    GitCommitChainResponse git_commit_chain_response = 31;
    GitPushResponse git_push_response = 32;
    GitCreatePrResponse git_create_pr_response = 33;
    DiscardFilesResponse discard_files_response = 34;
    // Push (empty request_id): revisioned full replacement of the daemon
    // host's Agent Mode context (skills + global rule files). See
    // `RemoteAgentContextSnapshot` below. The daemon-side producer (#353)
    // has since landed: `app/src/remote_server/server_model.rs` sends this
    // from `broadcast_remote_agent_context_snapshot` and
    // `send_remote_agent_context_snapshot_to_connection`.
    RemoteAgentContextSnapshot remote_agent_context_snapshot = 35;
    // Remote codebase indexing (Delta D2). 12 and 13 are the pin's own numbers
    // for these two, and they are free here precisely because these were the
    // messages the indexing retirement removed.
    CodebaseIndexStatusesSnapshot codebase_index_statuses_snapshot = 12;
    CodebaseIndexStatusUpdated codebase_index_status_updated = 13;
    GetFragmentMetadataFromHashResponse get_fragment_metadata_from_hash_response = 36;
    SearchRemoteCodebaseResponse search_remote_codebase_response = 37;
  }
}

// ── Initialize handshake

// Sent by the client immediately after connecting to negotiate the protocol.
message Initialize {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
  // 2-4 are the pin's user_id / user_email / crash_reporting_enabled, which
  // this fork dropped with the cloud. Reserved so a future re-pin can restore
  // them at their original numbers.
  reserved 2, 3, 4;
  // Client-resolved codebase index limits, for parity with local indexing.
  // Field 5 matches the pin.
  optional CodebaseIndexLimits codebase_index_limits = 5;
  // Fork-original: the user's own embedding endpoint. See
  // `EmbeddingProviderConfig`.
  optional EmbeddingProviderConfig embedding_provider = 6;
}

// Sent by the client when its bearer credential rotates after initialization.
// This is a notification (fire-and-forget) — the server does not send a response.
message Authenticate {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
}

// Sent by the client to cancel an in-progress request.
// This is a notification (fire-and-forget) — the server does not send a response.
message Abort {
  string request_id_to_abort = 1;
}

// Returned by the server in response to Initialize.
message InitializeResponse {
  string server_version = 1;
  string host_id = 2;
}

// Sent by the client after the SSH session has been bootstrapped.
// This is a notification (fire-and-forget) — the server does not send a
// response. The server uses this to create a per-session
// LocalCommandExecutor matching the bootstrapped shell.
message SessionBootstrapped {
  uint64 session_id = 1;
  string shell_type = 2;
  // The full path to the shell binary (e.g. "/usr/bin/zsh").
  // When present, the server uses this directly instead of doing a PATH lookup.
  optional string shell_path = 3;
}

// Sent by the client to execute a shell command on the remote host.
message RunCommandRequest {
  string command = 1;
  // Working directory for the command. If empty, uses the server's default.
  optional string working_directory = 2;
  // Environment variables to set for the command.
  map<string, string> environment_variables = 3;
  // The session whose shell executor should run this command.
  uint64 session_id = 4;
}

// Specific error codes for RunCommandRequest failures.
enum RunCommandErrorCode {
  RUN_COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  // The session ID has no associated executor (session was never bootstrapped).
  SESSION_NOT_FOUND = 1;
  // The command could not be executed (e.g. the shell process failed to spawn).
  EXECUTION_FAILED = 2;
}

message RunCommandError {
  RunCommandErrorCode code = 1;
  string message = 2;
}

message RunCommandSuccess {
  bytes stdout = 1;
  bytes stderr = 2;
  // Absent when the process was killed by a signal (Unix).
  optional int32 exit_code = 3;
}

// Returned by the server with the result of a RunCommandRequest.
message RunCommandResponse {
  oneof result {
    RunCommandSuccess success = 1;
    RunCommandError error = 2;
  }
}

// ── Shared error response ─────────────────────────────────────────

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request was malformed (e.g. missing oneof variant).
  INVALID_REQUEST = 1;
  // An unexpected server-side failure.
  INTERNAL = 2;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

// ── Remote Agent Mode context (#438 dependent feature 1, #353 producer) ────
//
// Ported from the pinned oracle (02b53fcd8): the daemon reads skills and
// global rule files (e.g. AGENTS.md) from the remote host and pushes them to
// every connected proxy so a local (BYOP) agent working over an SSH remote
// session sees the same context it would locally.
//
// `bundled` carries the daemon's own local bundled-skill catalog
// (`BundledSkillMetadata`), serialized outward by
// `ai::skills::remote::bundled_skill_snapshot_protos` — the daemon exposing its
// own context. Client-side, this is consumed into the pin's `BundledSkills`
// (plural): a per-connected-host catalog aggregation keyed by `HostId`,
// reconciled from these snapshots by `app::ai::remote_agent_context::
// RemoteAgentContext` into `SkillManager`. #487 un-dropped this client-side
// aggregation (it was previously declined as unbuilt).

// Metadata for a skill bundled with the app itself, evaluated daemon-side.
message BundledSkillMetadata {
  // Directory-based skill ID, unique within the bundled catalog.
  string id = 1;
  // When set, the skill is only active while the named MCP integration is
  // running on the client (e.g. "figma"). Evaluated client-side.
  optional string requires_mcp = 2;
}

// Marker metadata for a file-based skill from the daemon host's home
// directory.
message HomeSkillMetadata {}

// One already-read remote skill published by the daemon.
message RemoteSkillProto {
  // Absolute path to the file on this host.
  string path = 1;
  string content = 2;
  oneof source {
    HomeSkillMetadata home = 3;
    BundledSkillMetadata bundled = 4;
  }
}

// One already-read remote context file (e.g. AGENTS.md) published by the
// daemon.
message RemoteContextFileProto {
  // Absolute path to the file on this host.
  string path = 1;
  string content = 2;
}

// Revisioned full replacement of the daemon host's Agent Mode context.
// Source discovery and reading happen daemon-side before this snapshot is
// published; the client/manager only receive and dedup by `revision`.
message RemoteAgentContextSnapshot {
  uint64 revision = 1;
  string home_dir = 2;
  repeated RemoteSkillProto skills = 3;
  repeated RemoteContextFileProto global_rules = 4;
}

// ── Shared repo metadata sub-messages ─────────────────────────────
// Mirror the Rust types in repo_metadata/src/file_tree_update.rs.

// Mirrors RepoNodeMetadata in Rust.
message RepoNodeMetadata {
  oneof node {
    DirectoryNodeMetadata directory = 1;
    FileNodeMetadata file = 2;
  }
}

// Mirrors DirectoryNodeMetadata in Rust.
message DirectoryNodeMetadata {
  string path = 1;
  bool ignored = 2;
  bool loaded = 3;
}

// Mirrors FileNodeMetadata in Rust.
message FileNodeMetadata {
  string path = 1;
  optional string extension = 2;
  bool ignored = 3;
}

// Mirrors FileTreeEntryUpdate in Rust. Describes a subtree patch rooted
// at a parent directory.
message RepoMetadataEntryUpdate {
  string parent_path_to_replace = 1;
  repeated RepoNodeMetadata subtree_metadata = 2;
}

// Mirrors StandingQueryContent in Rust.
message StandingQueryContent {
  string path = 1;
  bool is_directory = 2;
}

// Mirrors StandingQueryResultsDelta in Rust. Project skills/rules discovery
// changes synchronized alongside a file tree update.
message StandingQueryResultsDelta {
  repeated StandingQueryContent upserted_project_skills = 1;
  repeated StandingQueryContent removed_project_skills = 2;
  repeated StandingQueryContent upserted_project_rules = 3;
  repeated StandingQueryContent removed_project_rules = 4;
}

// ── NavigatedToDirectory ──────────────────────────────────────────

// Client → server: "I navigated to this directory, please index it."
message NavigatedToDirectory {
  string path = 1;
}

// Response after the server has run git detection on the requested path.
// When is_git is true, indexed_path is the git repo root and full indexing
// runs in the background. A RepoMetadataSnapshot push will follow.
// When is_git is false, the directory was lazily indexed at first level.
// A RepoMetadataSnapshot push with the lazy tree data will follow.
message NavigatedToDirectoryResponse {
  string indexed_path = 1;
  bool is_git = 2;
}

// ── LoadRepoMetadataDirectory ─────────────────────────────────────

// Client → server: load the next level of a subdirectory within an
// already-tracked repo (lazy expand).
message LoadRepoMetadataDirectory {
  string repo_path = 1;
  string dir_path = 2;
}

// Response with the loaded subtree entries for the requested directory.
message LoadRepoMetadataDirectoryResponse {
  string repo_path = 1;
  string dir_path = 2;
  repeated RepoMetadataEntryUpdate entries = 3;
}

// ── File write/delete operations ──────────────────────────────────

// Shared error type for file operations (read/write/delete).
message FileOperationError {
  string message = 1;
}

// Client → server: write content to a file, creating parent dirs if needed.
message WriteFile {
  string path = 1;
  string content = 2;
}

// Server → client: result of a WriteFile request.
message WriteFileResponse {
  oneof result {
    WriteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileSuccess {}

// Client → server: delete a file.
message DeleteFile {
  string path = 1;
}

// Server → client: result of a DeleteFile request.
message DeleteFileResponse {
  oneof result {
    DeleteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message DeleteFileSuccess {}

// ── Read file context (batch) ─────────────────────────────────────

// A single file to read, with optional line ranges.
message ReadFileContextFile {
  string path = 1;
  // 1-indexed line ranges (start..end). Empty = read entire file.
  repeated LineRange line_ranges = 2;
}

message LineRange {
  uint32 start = 1;
  uint32 end = 2;
}

// Client → server: batch read multiple files with full context.
message ReadFileContextRequest {
  repeated ReadFileContextFile files = 1;
  // Per-file byte limit. Absent = use server default.
  optional uint32 max_file_bytes = 2;
  // Cumulative byte budget across all files. Absent = no batch limit.
  optional uint32 max_batch_bytes = 3;
}

// Server → client: result of a ReadFileContextRequest.
// Per-file failures are reported in `failed_files`, not as a top-level error.
// Catastrophic server errors (malformed request, etc.) use the generic ErrorResponse.
message ReadFileContextResponse {
  repeated FileContextProto file_contexts = 1;
  repeated FailedFileRead failed_files = 2;
}

message FailedFileRead {
  string path = 1;
  FileOperationError error = 2;
}

message FileContextProto {
  string file_name = 1;
  oneof content {
    string text_content = 2;
    bytes binary_content = 3;
  }
  // Optional 1-indexed line range this segment covers.
  optional uint32 line_range_start = 4;
  optional uint32 line_range_end = 5;
  optional uint64 last_modified_epoch_millis = 6;
  uint32 line_count = 7;
}

// ── Server → client push messages ─────────────────────────────────

// Full or lazy-loaded repo metadata snapshot. Pushed by the server after
// NavigatedToDirectory completes indexing (either lazy or full git).
message RepoMetadataSnapshot {
  string repo_path = 1;
  repeated RepoMetadataEntryUpdate entries = 2;
  bool sync_complete = 3;
  StandingQueryResultsDelta standing_results = 4;
}

// Incremental repo metadata update. Mirrors RepoMetadataUpdate in Rust.
message RepoMetadataUpdatePush {
  string repo_path = 1;
  repeated string remove_entries = 2;
  repeated RepoMetadataEntryUpdate update_entries = 3;
  StandingQueryResultsDelta standing_results_delta = 4;
}

// ── Buffer syncing ────────────────────────────────────────────────

// Client → server: open a buffer for bidirectional syncing.
// The server reads the file, starts watching it, and returns the content.
message OpenBuffer {
  string path = 1;
  // When true, the server discards any in-memory buffer state and re-reads
  // the file from disk. Used by the client to resolve conflicts ("accept
  // server" / discard local edits). Other connections that have the buffer
  // open receive a BufferUpdatedPush with the fresh content.
  bool force_reload = 2;
}

// Server → client: response to OpenBuffer with the initial file content.
message OpenBufferResponse {
  string content = 1;
  uint64 server_version = 2;
}

// Client → server: push an incremental edit (fire-and-forget notification).
// If the server accepts (expected_server_version matches its local version),
// it applies the edit silently — no response needed since the client already
// has the edit applied locally.
// If the server rejects (version mismatch), the edit is silently dropped;
// the client discovers the divergence on the next file-watcher
// BufferUpdatedPush that carries the server's current state. (The earlier
// "server pushes BufferUpdatedPush on reject" wording did not match the
// implementation and has been removed.)
//
// V0 limitation (single-client per buffer): when buffer B is open on
// connections A and C, an accepted BufferEdit from A is NOT forwarded to
// C. SyncClock.client_version is daemon-wide rather than per-connection,
// so there is no safe expected_client_version to put in a push targeted
// at C. Multi-client push is tracked as follow-up work; until then, only
// one client should hold a writable view of a remote buffer at a time.
message BufferEdit {
  string path = 1;
  uint64 expected_server_version = 2;
  uint64 new_client_version = 3;
  repeated TextEdit edits = 4;
}

// A single text edit within a buffer, using 1-indexed character offsets (matching CharOffset).
message TextEdit {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string text = 3;
}

// Server → client push: file changed on disk.
// The client uses expected_client_version to detect conflicts.
// Carries only incremental edits — full content is served by OpenBufferResponse.
message BufferUpdatedPush {
  string path = 1;
  uint64 new_server_version = 2;
  uint64 expected_client_version = 3;
  repeated TextEdit edits = 4;
}

// Server → client push: the file changed on disk while the client had
// unsaved edits. The server does NOT apply the disk change to its buffer;
// the client should show a conflict resolution banner.
message BufferConflictDetected {
  string path = 1;
}

// Client → server: close a buffer (stop watching).
message CloseBuffer {
  string path = 1;
}

// Client → server: persist the current in-memory buffer to disk.
message SaveBuffer {
  string path = 1;
}

// Server → client: result of a SaveBuffer request.
message SaveBufferResponse {
  oneof result {
    SaveBufferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message SaveBufferSuccess {}

// Client → server: resolve a conflict by accepting the client's content.
// The server replaces its in-memory buffer with client_content,
// updates the clock to {acknowledged_server_version, current_client_version},
// and persists to disk (updates base_content_version to avoid re-triggering).
// For "accept server", the client simply re-sends OpenBuffer instead.
message ResolveConflict {
  string path = 1;
  uint64 acknowledged_server_version = 2;
  string client_content = 3;
  uint64 current_client_version = 4;
}

// Server → client: result of a ResolveConflict request.
message ResolveConflictResponse {
  oneof result {
    ResolveConflictSuccess success = 1;
    FileOperationError error = 2;
  }
}

message ResolveConflictSuccess {}

// ── ListDirectory ─────────────────────────────────────────────────
// Zap: precise remote-side validation for terminal file links. When the
// client Ctrl/Cmd+clicks a file path in a remote SSH session, it needs to know
// the real directory entries under a given cwd in order to accurately cut the
// filename out of a whole-line output like `ls -l` (local sessions do this via
// `fs::metadata` existence checks, but remote files aren't on the local disk).

// Client → server: list the immediate entries of a directory.
message ListDirectory {
  string path = 1;
}

enum FileSystemEntryKind {
  FILE_SYSTEM_ENTRY_KIND_UNSPECIFIED = 0;
  FILE = 1;
  DIRECTORY = 2;
  SYMLINK = 3;
  OTHER = 4;
}

// A single directory entry returned by ListDirectory.
message DirEntry {
  string name = 1;
  bool is_dir = 2;
  FileSystemEntryKind kind = 3;
  optional uint64 size_bytes = 4;
  optional uint64 modified_epoch_millis = 5;
}

// Server → client: the entries contained directly in the requested directory.
message ListDirectorySuccess {
  repeated DirEntry entries = 1;
  string canonical_path = 2;
}

// Server → client: result of a ListDirectory request.
message ListDirectoryResponse {
  oneof result {
    ListDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Server file browser operations ────────────────────────────────

message ResolvePath {
  string path = 1;
}

message ResolvePathSuccess {
  string canonical_path = 1;
  FileSystemEntryKind kind = 2;
  optional uint64 size_bytes = 3;
}

message ResolvePathResponse {
  oneof result {
    ResolvePathSuccess success = 1;
    FileOperationError error = 2;
  }
}

message CreateDirectory {
  string path = 1;
}

message CreateDirectorySuccess {
  string canonical_path = 1;
}

message CreateDirectoryResponse {
  oneof result {
    CreateDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

message ReadFileChunk {
  string path = 1;
  uint64 offset = 2;
  uint64 max_bytes = 3;
}

message ReadFileChunkSuccess {
  bytes bytes = 1;
  uint64 next_offset = 2;
  optional uint64 total_size = 3;
  bool eof = 4;
}

message ReadFileChunkResponse {
  oneof result {
    ReadFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileChunk {
  string path = 1;
  uint64 offset = 2;
  bytes bytes = 3;
  bool truncate = 4;
  optional bool executable = 5;
}

message WriteFileChunkSuccess {
  uint64 next_offset = 1;
}

message WriteFileChunkResponse {
  oneof result {
    WriteFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Ripgrep search (global search over an SSH-remote session) ──────
// Client → server: run a ripgrep search over the given root directories on the
// host. Used by global search for remote sessions. Routing is implicit: the
// request travels on the target host's own connection (the fork keeps one
// per-session/per-host connection), so no host-scoped envelope is needed.
message RipgrepSearchRequest {
  // Regex pattern. Already escaped client-side for literal (non-regex) searches,
  // matching local global search behavior.
  string pattern = 1;
  // Absolute directories on the host to search.
  repeated string roots = 2;
  bool ignore_case = 3;
  bool multiline = 4;
  // Maximum number of matched lines to return. The server also applies its own
  // match and approximate payload caps.
  uint32 max_matches = 5;
}

// Server → client: result of a RipgrepSearchRequest.
message RipgrepSearchResponse {
  oneof result {
    RipgrepSearchSuccess success = 1;
    RipgrepSearchError error = 2;
  }
}

message RipgrepSearchSuccess {
  repeated RipgrepSearchMatch matches = 1;
  // True when the search stopped early because the match cap was reached.
  bool capped = 2;
}

message RipgrepSearchError {
  string message = 1;
}

// A single matched line in a file. A line may contain multiple submatches; the
// client expands them into per-submatch result rows.
message RipgrepSearchMatch {
  string file_path = 1;
  uint32 line_number = 2;
  string line_text = 3;
  repeated RipgrepSearchSubmatch submatches = 4;
}

// Byte offsets into `line_text` for one submatch (end exclusive).
message RipgrepSearchSubmatch {
  uint64 byte_start = 1;
  uint64 byte_end = 2;
}

// ── GetBranches ──────────────────────────────────────────────────
// Client → server: list the git branches of a repo on the remote host,
// backing the code-review branch picker over SSH. Mirrors the local
// `DiffStateModel::get_all_branches`.
message GetBranches {
  string repo_path = 1;
  // Maximum number of branches to return. Absent = server default (100).
  optional uint32 max_branch_count = 2;
  // Whether to include remote-tracking branches (refs/remotes).
  bool include_remotes = 3;
}

// A single branch entry.
message BranchInfo {
  string name = 1;
  bool is_main = 2;
}

// Server → client: result of a GetBranches request.
message GetBranchesResponse {
  oneof result {
    GetBranchesSuccess success = 1;
    GetBranchesError error = 2;
  }
}

message GetBranchesSuccess {
  repeated BranchInfo branches = 1;
}

message GetBranchesError {
  string message = 1;
}

// ── GetCommittedBranchFiles ──────────────────────────────────────
// Client → server: list the committed-only changed files of the current
// branch on the remote host (`main...HEAD`), backing the code-review file
// list over SSH. Mirrors the local `get_committed_branch_file_entries`.
message GetCommittedBranchFilesRequest {
  string repo_path = 1;
}

// One changed file with its line-change counts.
message FileChangeEntry {
  string path = 1;
  uint64 additions = 2;
  uint64 deletions = 3;
}

message GetCommittedBranchFilesResponse {
  oneof result {
    GetCommittedBranchFilesSuccess success = 1;
    GetCommittedBranchFilesError error = 2;
  }
}

message GetCommittedBranchFilesSuccess {
  repeated FileChangeEntry files = 1;
}

message GetCommittedBranchFilesError {
  string message = 1;
}

// ── Git write operations (commit / push / create-PR over SSH) ─────
// These let code-review over a remote (SSH) host run git write actions on the
// remote host, mirroring the local git flow. The daemon runs the underlying
// git / gh subprocesses; the client sends one request and awaits the result.

// Shared error payload for git operation responses. The message is the raw
// git/gh error, mapped to user-facing copy on the client.
message GitOpError {
  string message = 1;
}

// Post-operation delta applied to the diff metadata so the client refreshes
// the header immediately, without waiting for the next watcher-driven snapshot.
message GitOpDelta {
  repeated Commit unpushed_commits = 1;
  optional string upstream_ref = 2;
}

// Client → server: run the commit chain (commit, then optionally push, then
// optionally create-PR) host-local in a single round trip. The daemon
// sequences the underlying git / gh subprocesses, so the SSH link carries one
// request/response instead of the 2–3 a client-side chain would send.
message GitCommitChainRequest {
  string repo_path = 1;
  string message = 2;
  bool include_unstaged = 3;
  // Branch to push / open the PR against. Ignored for COMMIT_ONLY.
  string branch = 4;
  GitCommitChainMode mode = 5;
  // When mode is COMMIT_AND_CREATE_PR, generate the PR title/body on the
  // daemon. Phosphor divergence from Warp: this routes through the locally
  // configured (BYOP) provider, never Warp cloud, falling back to
  // `gh pr create --fill`. Ignored for the other modes.
  bool autogenerate_pr_content = 6;
}

// What to run after the commit succeeds.
enum GitCommitChainMode {
  GIT_COMMIT_CHAIN_MODE_COMMIT_ONLY = 0;
  GIT_COMMIT_CHAIN_MODE_COMMIT_AND_PUSH = 1;
  GIT_COMMIT_CHAIN_MODE_COMMIT_AND_CREATE_PR = 2;
}

message GitCommitChainResponse {
  oneof result {
    GitCommitChainSuccess success = 1;
    GitOpError error = 2;
  }
}

// Final post-chain delta plus the PR when one was created (absent for
// COMMIT_ONLY / COMMIT_AND_PUSH).
message GitCommitChainSuccess {
  GitOpDelta delta = 1;
  optional PrInfo pr_info = 2;
}

// Client → server: push `branch` to origin, setting upstream tracking.
message GitPushRequest {
  string repo_path = 1;
  string branch = 2;
}

message GitPushResponse {
  oneof result {
    GitOpDelta success = 1;
    GitOpError error = 2;
  }
}

// Client → server: create a PR for the current branch (must be pushed).
// With autogenerate_content unset, the daemon runs `gh pr create --fill`.
message GitCreatePrRequest {
  string repo_path = 1;
  // Current branch name, passed as context to daemon-side generation.
  string branch = 2;
  // When true, the daemon generates the PR title + body before running
  // `gh pr create`. Phosphor divergence from Warp: generation routes through
  // the locally configured (BYOP) provider, never Warp cloud, falling back to
  // `--fill` on failure.
  bool autogenerate_content = 3;
}

message GitCreatePrResponse {
  oneof result {
    PrInfo success = 1;
    GitOpError error = 2;
  }
}

// ── Diff state ───────────────────────────────────────────────────
// Subscription protocol for code-review diff state over SSH. The client
// subscribes for a (repo, mode) pair with GetDiffState; the daemon replies
// with a GetDiffStateResponse snapshot and then pushes DiffStateSnapshot /
// DiffStateMetadataUpdate / DiffStateFileDelta as the working tree changes.
// These messages mirror the Rust domain types in code_review/diff_state.rs
// and util/git.rs.

// Mirrors DiffMode in Rust.
message DiffMode {
  oneof mode {
    DiffModeHead head = 1;
    DiffModeMainBranch main_branch = 2;
    DiffModeOtherBranch other_branch = 3;
  }
}
message DiffModeHead {}
message DiffModeMainBranch {}
message DiffModeOtherBranch {
  string branch_name = 1;
}

// Mirrors DiffState in Rust. The Loaded diff payload is carried separately in
// DiffStateSnapshot.diffs, so the Loaded variant here is a unit marker.
message DiffState {
  oneof state {
    DiffStateNotInRepository not_in_repository = 1;
    DiffStateLoading loading = 2;
    DiffStateErrorValue error = 3;
    DiffStateLoaded loaded = 4;
  }
}
message DiffStateNotInRepository {}
message DiffStateLoading {}
message DiffStateErrorValue {
  string message = 1;
}
message DiffStateLoaded {}

// Mirrors DiffLineType in Rust.
enum DiffLineType {
  DIFF_LINE_TYPE_UNSPECIFIED = 0;
  DIFF_LINE_TYPE_CONTEXT = 1;
  DIFF_LINE_TYPE_ADD = 2;
  DIFF_LINE_TYPE_DELETE = 3;
  DIFF_LINE_TYPE_HUNK_HEADER = 4;
}

// Represents a single line in a diff hunk. Mirrors DiffLine in Rust.
message DiffLine {
  DiffLineType line_type = 1;
  optional uint64 old_line_number = 2;
  optional uint64 new_line_number = 3;
  string text = 4;
  bool no_trailing_newline = 5;
}

// Represents a hunk of changes in a file diff. Mirrors DiffHunk in Rust.
message DiffHunk {
  uint64 old_start_line = 1;
  uint64 old_line_count = 2;
  uint64 new_start_line = 3;
  uint64 new_line_count = 4;
  repeated DiffLine lines = 5;
  uint64 unified_diff_start = 6;
  uint64 unified_diff_end = 7;
}

// Represents the status of a file in the git working directory.
// Mirrors GitFileStatus in Rust.
message GitFileStatus {
  oneof status {
    GitFileStatusNew new_file = 1;
    GitFileStatusModified modified = 2;
    GitFileStatusDeleted deleted = 3;
    GitFileStatusRenamed renamed = 4;
    GitFileStatusCopied copied = 5;
    GitFileStatusUntracked untracked = 6;
    GitFileStatusConflicted conflicted = 7;
  }
}
message GitFileStatusNew {}
message GitFileStatusModified {}
message GitFileStatusDeleted {}
message GitFileStatusRenamed {
  string old_path = 1;
}
message GitFileStatusCopied {
  string old_path = 1;
}
message GitFileStatusUntracked {}
message GitFileStatusConflicted {}

// Mirrors DiffSize in Rust (diff_size_limits.rs).
enum DiffSize {
  DIFF_SIZE_UNSPECIFIED = 0;
  DIFF_SIZE_NORMAL = 1;
  DIFF_SIZE_LARGE = 2;
  // The diff/patch itself is too large to render.
  DIFF_SIZE_UNRENDERABLE_DIFF_TOO_LARGE = 3;
  // The base file content was withheld because it exceeded the per-file wire
  // budget; the client renders a "file too large" placeholder.
  DIFF_SIZE_UNRENDERABLE_FILE_TOO_LARGE = 4;
}

// Mirrors FileDiff (+ FileDiffAndContent) in Rust. The optional
// content_at_base carries file content at HEAD or merge-base for the code
// review editor's inline decorations; absent for binary / oversized files.
message FileDiff {
  string file_path = 1;
  GitFileStatus status = 2;
  repeated DiffHunk hunks = 3;
  bool is_binary = 4;
  bool is_autogenerated = 5;
  uint64 max_line_number = 6;
  bool has_hidden_bidi_chars = 7;
  DiffSize size = 8;
  optional string content_at_base = 9;
}

// Represents the complete git diff information for a repository.
// Mirrors GitDiffData in Rust.
message GitDiffData {
  repeated FileDiff files = 1;
  uint64 total_additions = 2;
  uint64 total_deletions = 3;
  uint64 files_changed = 4;
}

// Mirrors DiffStats in Rust.
message DiffStats {
  uint64 files_changed = 1;
  uint64 total_additions = 2;
  uint64 total_deletions = 3;
}

// Mirrors DiffMetadataAgainstBase in Rust. `files` carries the per-file change
// entries from the same numstat that produced aggregate_stats, so the git
// dialog's Changes box can populate for remote repos without a working-tree
// read.
message DiffMetadataAgainstBase {
  DiffStats aggregate_stats = 1;
  repeated FileChangeEntry files = 2;
}

// Mirrors Commit in Rust (util/git.rs).
message Commit {
  string hash = 1;
  string subject = 2;
  uint64 files_changed = 3;
  uint64 additions = 4;
  uint64 deletions = 5;
  // Per-file changes in this commit, captured up front so the push dialog can
  // render a commit's file list on expansion without a follow-up RPC.
  repeated FileChangeEntry files = 6;
}

// Mirrors PrInfo in Rust (util/git.rs).
message PrInfo {
  uint64 number = 1;
  string url = 2;
  string state = 3;
  bool draft = 4;
  string base_branch = 5;
}

// Mirrors DiffMetadata in Rust.
message DiffMetadata {
  string main_branch_name = 1;
  string current_branch_name = 2;
  DiffMetadataAgainstBase against_head = 3;
  optional DiffMetadataAgainstBase against_base_branch = 4;
  bool has_head_commit = 5;
  repeated Commit unpushed_commits = 6;
  optional string upstream_ref = 7;
  optional PrInfo pr_info = 8;
}

// Mirrors FileStatusInfo in Rust. Identifies a file and its git status for
// discard operations (git restore / git stash / git rm).
message FileStatusInfo {
  string path = 1;
  GitFileStatus status = 2;
}

// Client → server: subscribe to diff state for a (repo, mode) pair. The server
// responds with GetDiffStateResponse, then pushes subsequent changes.
message GetDiffState {
  string repo_path = 1;
  DiffMode mode = 2;
}

// Client → server: unsubscribe from diff state updates for a (repo, mode)
// pair. Fire-and-forget — the server does not send a response.
message UnsubscribeDiffState {
  string repo_path = 1;
  DiffMode mode = 2;
}

// Client → server: discard changes for one or more files. Runs
// git restore/stash/rm on the remote filesystem. The SSH-remote equivalent
// of the local code-review "discard changes" action (issue #437).
message DiscardFilesRequest {
  string repo_path = 1;
  repeated FileStatusInfo files = 2;
  bool should_stash = 3;
  // Branch to restore against. Absent means HEAD.
  optional string branch_name = 4;
  // The diff mode the request originated from. Deviation from the pin: the
  // fork's daemon does not key a per-(repo, mode) model cache by this field
  // (see `ServerModel::handle_discard_files`) — after a successful discard
  // it refreshes every subscribed mode for the repo, since discarding a file
  // changes the diff against every mode, not just the requesting one. The
  // field is still carried over the wire for parity with the pin's request
  // shape and in case future daemon-side model caching needs it.
  DiffMode mode = 5;
}

// Error payload for GetDiffStateResponse.
message DiffStateError {
  string message = 1;
}

// Full diff state snapshot for a (repo, mode) pair. Pushed on structural
// changes (new diffs computed).
message DiffStateSnapshot {
  string repo_path = 1;
  DiffMode mode = 2;
  DiffMetadata metadata = 3;
  DiffState state = 4;
  // Present when state is Loaded.
  optional GitDiffData diffs = 5;
}

// Response to GetDiffState.
message GetDiffStateResponse {
  oneof result {
    DiffStateSnapshot snapshot = 1;
    DiffStateError error = 2;
  }
}

// Metadata-only update pushed for metadata refreshes and current-branch
// changes. Avoids re-serializing the entire diff payload on every throttled
// refresh.
message DiffStateMetadataUpdate {
  string repo_path = 1;
  DiffMode mode = 2;
  DiffMetadata metadata = 3;
}

// Single-file diff delta pushed when one file changes. Carries one FileDiff +
// file path + updated metadata. Debounced on the server.
message DiffStateFileDelta {
  string repo_path = 1;
  DiffMode mode = 2;
  string file_path = 3;
  optional FileDiff diff = 4;
  optional DiffMetadata metadata = 5;
}

// Server → client: result of a DiscardFilesRequest.
message DiscardFilesResponse {
  oneof result {
    DiscardFilesSuccess success = 1;
    DiscardFilesError error = 2;
  }
}

message DiscardFilesSuccess {}

message DiscardFilesError {
  string message = 1;
}

// ── Remote codebase indexing ──────────────────────────────────────
//
// Ported from the pinned oracle (02b53fcd8) for the Delta D2 remote-daemon
// leg. The daemon owns the index for repositories on its own host: it walks
// the tree, chunks and embeds the files, and stores merkle nodes and vectors
// in its own data dir. The client drives it and mirrors its status.
//
// ONE DELIBERATE DEVIATION FROM THE PIN, and the reason for it. At the pin
// every one of these requests carried `auth_token`, a Warp bearer credential
// the daemon used to reach Warp's *shared* embedding store. This fork has no
// such store: `StoreClient` is implemented locally over the user's own
// embedding provider (`app/src/ai/codebase_embeddings.rs`). A daemon on a
// remote host has neither the user's settings nor their keychain, so the
// credential it needs is not a Warp token but the user's own embedding
// endpoint. `EmbeddingProviderConfig` below carries it, and it replaces
// `auth_token` rather than joining it — carrying a field this fork can never
// populate would be dead wire shape.

// The user's embedding provider, resolved on the client and handed to the
// daemon so it can produce embeddings on the remote host.
//
// Sent on `Initialize` and refreshed by `UpdatePreferences` whenever the user
// edits their providers. Absent means "no provider configured"; the daemon
// then reports `CODEBASE_INDEX_STATUS_STATE_UNAVAILABLE` rather than
// producing an empty index, for the reason stated in
// `crates/ai/src/index/full_source_code_embedding/local_store_client.rs`: an
// empty result is indistinguishable from an empty store and would re-embed
// the repository on every sync.
message EmbeddingProviderConfig {
  // Base URL with no trailing slash; the daemon appends `/embeddings`.
  string base_url = 1;
  // Empty means "send no Authorization header", which is how a local runtime
  // with no auth is supported — the same tolerance the chat path has.
  string api_key = 2;
  // `EmbeddingConfig::storage_key()`, e.g. `voyage:voyage-3.5:512`. The daemon
  // parses it back with `EmbeddingConfig::from_storage_key`; an unrecognized
  // key is treated as "no provider" rather than silently defaulted, because a
  // mismatched model would produce vectors that cannot be compared.
  string embedding_storage_key = 3;
}

message CodebaseIndexLimits {
  // Empty means unlimited.
  optional uint64 max_indices_allowed = 1;
  uint64 max_files_per_repo = 2;
  uint64 embedding_generation_batch_size = 3;
}

// Sent by the client when the user's preferences change (provider edits,
// limit changes). Fire-and-forget.
message UpdatePreferences {
  optional CodebaseIndexLimits codebase_index_limits = 1;
  optional EmbeddingProviderConfig embedding_provider = 2;
}

message IndexCodebase {
  string repo_path = 1;
}

enum CodebaseResyncMode {
  CODEBASE_RESYNC_MODE_FULL = 0;
  CODEBASE_RESYNC_MODE_INCREMENTAL = 1;
}

message ResyncCodebase {
  string repo_path = 1;
  CodebaseResyncMode mode = 2;
}

message DropCodebaseIndex {
  string repo_path = 1;
}

message GetFragmentMetadataFromHash {
  string repo_path = 1;
  string root_hash = 2;
  repeated string content_hashes = 3;
}

message FragmentMetadata {
  string content_hash = 1;
  string path = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  uint64 byte_start = 5;
  uint64 byte_end = 6;
}

message MissingFragmentMetadata {
  string content_hash = 1;
  FileOperationError error = 2;
}

enum FragmentMetadataLookupErrorCode {
  FRAGMENT_METADATA_LOOKUP_ERROR_CODE_UNSPECIFIED = 0;
  REMOTE_CODEBASE_INDEXING_NOT_ENABLED = 1;
  INVALID_REPO_PATH = 2;
  INVALID_ROOT_HASH = 3;
  INDEX_NOT_FOUND = 4;
  INDEX_NOT_SYNCED = 5;
  ROOT_HASH_MISMATCH = 6;
}

message FragmentMetadataLookupError {
  FragmentMetadataLookupErrorCode code = 1;
  string message = 2;
  optional string current_root_hash = 3;
}

message GetFragmentMetadataFromHashSuccess {
  repeated FragmentMetadata fragments = 1;
  repeated MissingFragmentMetadata missing_hashes = 2;
}

message GetFragmentMetadataFromHashResponse {
  oneof result {
    GetFragmentMetadataFromHashSuccess success = 1;
    FragmentMetadataLookupError error = 2;
  }
}

// Fork-original (see the field comment on
// `HostScopedRequest.search_remote_codebase` for why the pin has no
// equivalent). Asks the daemon to answer `get_relevant_files` against its
// own private codebase index for `repo_path`.
message SearchRemoteCodebase {
  string repo_path = 1;
  string query = 2;
}

enum RemoteCodebaseSearchErrorCode {
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_UNSPECIFIED = 0;
  // Mirrors `ServerModel::codebase_indexing_ready()`'s failure: the feature
  // is off, or this host has no embedding provider configured.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_NOT_ENABLED = 1;
  // `repo_path` did not parse as an absolute path on the host.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_INVALID_REPO_PATH = 2;
  // Mirrors `RetrieveFileError::IndexNotFound`: no index is tracked for
  // this repository yet.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_INDEX_NOT_FOUND = 3;
  // Mirrors `RetrieveFileError::IndexSyncing`: an index is tracked but has
  // not finished its first sync.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_INDEX_SYNCING = 4;
  // Mirrors `RetrieveFileError::IndexFailed`: the index exists but its last
  // sync failed, so there is nothing synced to search.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_INDEX_FAILED = 5;
  // The request was accepted (the index was ready) but the retrieval itself
  // failed after starting — a `CodebaseIndexManagerEvent::
  // RetrievalRequestFailed` arrived instead of `RetrievalRequestCompleted`.
  REMOTE_CODEBASE_SEARCH_ERROR_CODE_RETRIEVAL_FAILED = 6;
}

message RemoteCodebaseSearchError {
  RemoteCodebaseSearchErrorCode code = 1;
  string message = 2;
}

message SearchRemoteCodebaseSuccess {
  // Absolute paths on the remote host, ranked best first — the same shape
  // `CodebaseIndexManagerEvent::RetrievalRequestCompleted::ranked_paths`
  // uses for the local leg.
  repeated string ranked_paths = 1;
}

message SearchRemoteCodebaseResponse {
  oneof result {
    SearchRemoteCodebaseSuccess success = 1;
    RemoteCodebaseSearchError error = 2;
  }
}

enum CodebaseIndexStatusState {
  CODEBASE_INDEX_STATUS_STATE_UNSPECIFIED = 0;
  CODEBASE_INDEX_STATUS_STATE_NOT_ENABLED = 1;
  CODEBASE_INDEX_STATUS_STATE_UNAVAILABLE = 2;
  CODEBASE_INDEX_STATUS_STATE_DISABLED = 3;
  CODEBASE_INDEX_STATUS_STATE_QUEUED = 4;
  CODEBASE_INDEX_STATUS_STATE_INDEXING = 5;
  CODEBASE_INDEX_STATUS_STATE_READY = 6;
  CODEBASE_INDEX_STATUS_STATE_STALE = 7;
  CODEBASE_INDEX_STATUS_STATE_FAILED = 8;
}

message CodebaseIndexStatus {
  string repo_path = 1;
  CodebaseIndexStatusState state = 2;
  optional uint64 last_updated_epoch_millis = 3;
  optional uint64 progress_completed = 4;
  optional uint64 progress_total = 5;
  optional string failure_message = 6;
  optional string root_hash = 7;
}

message CodebaseIndexStatusesSnapshot {
  repeated CodebaseIndexStatus statuses = 1;
}

message CodebaseIndexStatusUpdated {
  CodebaseIndexStatus status = 1;
}

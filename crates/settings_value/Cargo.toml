[package]
name = "settings_value"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
derive = ["dep:settings_value_derive"]

[dependencies]
chrono.workspace = true
instant.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings_value_derive = { workspace = true, optional = true }

# The derive_tests integration test uses #[derive(SettingsValue)], which is
# re-exported only under the `derive` feature. Declare that requirement so a
# plain `cargo test -p settings_value` skips it cleanly instead of failing to
# compile, and `--features derive` exercises it.
[[test]]
name = "derive_tests"
required-features = ["derive"]

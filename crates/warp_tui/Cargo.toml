[package]
name = "warp_tui"
edition = "2024"
description = "Headless terminal-UI front-end for Warp"
authors.workspace = true
publish.workspace = true
license.workspace = true
autobins = false
default-run = "zap-tui-oss"

# Zap: the OSS-channel bin hand-builds its config (no warp_channel_config needed).
# The dev/local/stable bins depend on warp_channel_config (absent in Zap) and stay
# undeclared. See specs/warp-oss-sync/SCOPE.md.
[[bin]]
name = "zap-tui-oss"
path = "src/bin/oss.rs"

[dependencies]
ai.workspace = true
anyhow.workspace = true
async-channel.workspace = true
async-fs.workspace = true
base64.workspace = true
blocking.workspace = true
channel_versions.workspace = true
chrono.workspace = true
clap.workspace = true
command.workspace = true
dirs.workspace = true
futures.workspace = true
futures-lite.workspace = true
fs4 = { version = "0.13.1", features = ["sync"] }
http_client.workspace = true
# Masked-TTY prompt for `--set-provider-api-key` (falls back to piped stdin
# when not a terminal). Same version `app` already pins for the same purpose.
inquire = "0.9.1"
instant.workspace = true
itertools.workspace = true
log.workspace = true
markdown_parser.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
rangemap.workspace = true
serde_json.workspace = true
shell-words = "1.1.0"
similar.workspace = true
string-offset.workspace = true
strum.workspace = true
strum_macros.workspace = true
sum_tree.workspace = true
tokio.workspace = true
unicode-segmentation = "1.11.0"
unicode-width.workspace = true
vec1.workspace = true
vim.workspace = true
warp = { workspace = true, features = ["image_as_context", "tui"] }
warp_completer.workspace = true
warp_core.workspace = true
warp_editor.workspace = true
warp_files.workspace = true
warp_logging.workspace = true
warp_search_core.workspace = true
warp_terminal.workspace = true
warp_util.workspace = true
warpui.workspace = true
warpui_core = { workspace = true, features = ["tui"] }
uuid.workspace = true

# Native OS-clipboard transport for local TUI runs (copy-out only, text-only).
# OSC 52 (see `src/clipboard.rs`) remains the transport for remote/SSH sessions
# and the local fallback. `arboard` supports macOS/Linux/FreeBSD/Windows, so it
# is added for all desktop targets to give a single cross-platform native path.
# The workspace dep is `default-features = false`; Linux/FreeBSD additionally
# enable `wayland-data-control` so native copies work on Wayland sessions
# (otherwise they fall back to X11 only, and pure-Wayland copies miss the native
# path). macOS/Windows have no such backend feature and stay text-only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile.workspace = true
# `test-util` exposes `Appearance::mock()`, used to register the `Appearance`
# singleton that the editor-backed TUI input view depends on in tests.
warp_core = { workspace = true, features = ["test-util"] }
# `test-util` exposes `RenderState::layout_complete()`, used to deterministically
# await async layout (e.g. diff ghost blocks) in tests instead of busy-polling.
warp_editor = { workspace = true, features = ["test-util"] }
# Process-level worker-dispatch regression test.
command.workspace = true
pathfinder_color.workspace = true
warp = { workspace = true, features = ["tui", "test-util"] }
# Runs a load-time (`#[ctor]`) initializer so the localizer is ready before any
# test touches the static slash-command table (whose `t_static!` hints resolve
# and cache once, at first access). A per-test init is too late.
ctor = "0.1"

[features]
# Declared so the `warp_channel_config::load_config!` macro's
# `cfg(feature = "release_bundle")` branch is a known cfg in this crate. Today it
# stays off and the local bin uses the runtime generator; wiring the embedded
# config path (a `build.rs`) is phase 2 of the channel setup.
release_bundle = ["warp/release_bundle"]
# Enable Rust Sentry reporting without the GUI-only Cocoa SDK.
crash_reporting = ["warp/crash_reporting"]
# Self-contained TUI build (the binary is not inside a `.app` bundle). Enables
# `warp/standalone`, which turns on `warp_core/standalone` so
# `warp_core::paths::bundled_resources_dir()` resolves the sibling `resources/`
# dir next to the executable (and `warp_assets/standalone` to drop GUI-only async
# assets). Mirrors the `app` crate's `standalone` feature.
standalone = ["warp/standalone"]

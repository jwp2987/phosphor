[package]
name = "fake_llm"
version = "0.1.0"
edition = "2024"
authors = ["Warp Team <dev@warp.dev>"]
publish.workspace = true
license.workspace = true
description = "Test-only fake model for the agent fuzzer: the scenario schema, llmposter bridging, a byte-level chaos proxy and the genai wire tests (layers L0/L1 of docs/testing.md 'Agent fuzzer and fake model')"

# Test-only crate. It is a dev-dependency of `app` (and nothing else), so nothing in it, and
# neither llmposter (AGPL-3.0-or-later, see deny.toml), ships in a release build.

[dependencies]
futures = { workspace = true }
genai = { workspace = true }
# aws_stub: an independent SigV4 verifier (HMAC-SHA256), used by the AWS credential resolver tests.
hmac = { workspace = true }
# default-features = false drops the OAuth mock, hot-reload and record/replay (a second
# reqwest + rustls stack we do not want in the graph). The library server, fixtures,
# streaming config and failure injection are all that is used.
llmposter = { version = "=0.5.0", default-features = false }
proptest = "1.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

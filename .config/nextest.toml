[test-groups]
# Tests that write and read back the REAL system clipboard share one global resource: run in
# parallel, one test's content is read back by another (r18u22 Windows: test_clipboard_round_trip
# read "Test HTML" from test_html_content_handling). Serialize them; no assertion changes.
system-clipboard = { max-threads = 1 }

[profile.default]
# Mark a test as slow if it takes longer than 30s to execute, and terminate it
# if it takes 2x as long as the slow timeout (i.e.: 60s total).
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(integration)'
# Integration tests are heavier-weight than unit tests, so have each one
# count twice against the parallelism limit.  This improves overall runtime
# of the test suite, despite running fewer integration tests at a time.
threads-required = 2

[[profile.default.overrides]]
# A handful of warp_tui view tests drive async work (layout drains, executor
# pumps, i18n) that races the asserting pump under heavy full-suite
# concurrency: they pass in isolation, in small groups, and fully serially,
# but a few flake when the executor threads are starved. Retry them (only the
# failed test re-runs) instead of serializing the whole package (~600 tests),
# mirroring the integration/update_manager flaky-test handling below.
filter = 'package(warp_tui)'
retries = 2

[[profile.default.overrides]]
# #940: lays out a 3 MB word and asserts it finishes within a wall-clock bound
# (~3 s alone in a debug build). Sharing the CPUs with the rest of the suite
# pushes it past the bound (7.9 s seen), so it runs alone instead of the bound
# being loosened.
filter = 'test(test_layout_line_of_huge_word_is_bounded_and_ends_at_text_end)'
threads-required = "num-cpus"

[[profile.default.overrides]]
# #1050: runs every form of the pwsh attack list in a real pwsh, on 4 workers that
# each keep two .NET runtimes alive (the host and the child the wrapper starts).
# Under full-suite load it once came back with no output at all, so it reserves
# the CPUs it really uses rather than competing with 12 other tests for them, and
# it gets a longer budget than the 60 s default so nextest's kill never preempts
# the harness's own TIMEOUT report. The ALIVE assertion is unchanged.
filter = 'test(real_shells::pwsh_survives_every_form_of_the_attack_list)'
threads-required = 8
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# #2194: on Windows these tests passed but the runner flagged them LEAK. The 3 s window below was a stopgap and r31b showed it was not the cause:
# agent_fuzz pairs_failing_command / pairs_question / triples_command `on`, input test_history_file_does_not_route_..., and workspace
# test_open_file_with_target_event_preserves_requested_line still leaked after it, so their children are not short-lived. Real causes, fixed in app code:
# (1) `Sessions` (the model) now ends the children its executors spawned when it is dropped (`Drop for Sessions`, `CommandExecutor::end_spawned_children`):
# the per-session executable-names probe, generators and `git rev-parse` probes run as `bash` / `git` children of background tasks that outlive the model
# and, once the test process exits, keep nextest's inherited stdout / stderr handles open. (2) A `TerminalManager` dropped in a unit test now waits
# (bounded) for its pty reader to kill the shell, as the app does at exit (`shutdown_all_pty_event_loops`): on Windows the ConPTY shell + OpenConsole
# outlived the process. Those four tests lost their exception; every other test keeps the default window.
# STILL HERE, with the 3 s window, only for the tests that passed under it in r31b: no Windows run has shown them clean at the default 100 ms yet.
# Remove this block after one test-windows run with the two fixes shows no LEAK for them (docs/testing.md, #2194).
filter = 'test(/context_chips::current_prompt::tests::/) | test(/workspace::view::tests::test_(closing_a_code_pane|reopening_a_file_whose_code_pane|code_editor_entry_points|active_tab_bar_position)/)'
leak-timeout = "3s"

[[profile.default.overrides]]
filter = 'package(warpui) & test(/windowing::winit::.*clipboard::tests::clipboard_tests::/)'
test-group = 'system-clipboard'

[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

[[profile.ci.overrides]]
filter = 'package(integration)'
# On CI, try integration tests up to 3 times (in total) to reduce the impact of
# flaky tests.
retries = 2

[[profile.ci.overrides]]
# See the default-profile note: a few warp_tui view tests flake under heavy
# concurrency (executor starvation), so retry the failed test on CI too.
filter = 'package(warp_tui)'
retries = 2

[profile.ci.junit]
# Output nextest results in junit format (for uploading to buildpulse).
# If `--profile ci` is selected on the command line, then the JUnit report will
# be written out to `target/nextest/ci/junit.xml`. 
# Docs: https://nexte.st/docs/machine-readable/junit/
path = "junit.xml"

[[profile.ci.overrides]]
# On Windows CI, update_manager tests are flaky and often time out but succeed after a retry
# Evidence suggest that the test itself passes but the process running it hangs
# We haven't figured out why the process hangs, so this is a workaround to unblock devs
filter = 'test(update_manager)'
platform = { host = 'cfg(target_os = "windows")' }
retries = 2

[[profile.ci.overrides]]
filter = 'package(warpui) & test(/windowing::winit::.*clipboard::tests::clipboard_tests::/)'
test-group = 'system-clipboard'

[[profile.default.overrides]]
# The agent fuzzer (docs/testing.md "Agent fuzzer and fake model"): one test is many whole
# App::test conversations with real waits (stall timeouts, retry backoff), so the default
# 30 s / 60 s budget would kill it. Fixed seed + modest case count by default; deep runs go
# through script/agent_fuzz.
filter = 'test(agent_fuzz)'
slow-timeout = { period = "120s", terminate-after = 5 }

# cargo-i18n config (used by the `cargo i18n` CLI to validate/extract/sync
# translation keys)
# Docs: https://github.com/kellpossible/cargo-i18n
fallback_language = "en"

[fluent]
# Root directory for translation resources (one subdirectory per locale, with
# .ftl files inside each locale directory)
assets_dir = "i18n"

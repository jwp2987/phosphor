[advisories]
git-fetch-with-cli = true
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, but considered to be complete." },
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; we should try to find an alternative." },
    { id = "RUSTSEC-2024-0425", reason = "get-size is unmaintained; we should try to find an alternative." },
    { id = "RUSTSEC-2024-0427", reason = "get-size-derive is an unmaintained dependency of get-size." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a unmaintained dependency of get-size-derive." },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; we should migrate to web-time." },
    { id = "RUSTSEC-2020-0077", reason = "memmap is unmaintained; we should migrate to memmap2." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; this is a dependency of metal, which we should eliminate by moving to the objc2 family of crates."},
    { id = "RUSTSEC-2023-0081", reason = "safemem is unmaintained; this is a dependency of plist." },
]

[licenses]
# Don't worry about licenses for crates in this workspace.
private = { ignore = true }
# Explicitly allowed licenses.
# This list must stay in sync with about.toml's accepted list.
# CI enforces this via script/check_license_config_sync.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# NOT an exceptions entry -- read this before adding one for libgit2.
#
# app/Cargo.toml enables git2's `vendored-libgit2`, so libgit2's C source is
# compiled and statically linked into the binary. libgit2 itself is
# GPL-2.0-only WITH a bespoke linking exception (the exception is what makes
# static linking into an AGPL program fine; this is a notice gap, not a licence
# conflict).
#
# cargo-deny cannot see any of that. It reads the `libgit2-sys` crate's own
# declared `license = "MIT"` field, which is already on the allow list above,
# so `check licenses` passes without any exception -- and it did upstream too,
# with this exact allow list and the same vendored dependency. An
# `[[licenses.exceptions]]` entry here would be inert at best: SPDX has no
# registered identifier for libgit2's linking exception, so any expression
# written for it would be either wrong or unparseable, and cargo-deny rejects
# unparseable expressions outright.
#
# The obligation is therefore discharged where it actually can be: the
# ADDITIONAL_LICENSES manifests in script/prepare_bundled_resources and
# script/windows/prepare_bundled_resources.ps1 ship libgit2's COPYING verbatim
# into THIRD_PARTY_LICENSES.txt.

[bans]
# We allow dependencies on multiple versions of crates.
multiple-versions = "allow"
# Do not allow wildcard versions, except in our private path-based dependencies
# (i.e.: workspace crates).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
allow-git = [
    # Our own fork of warpdotdev/winit, +1 commit (rust-windowing/winit#4453).
    "https://github.com/jwp2987/winit",
    # Allow git reference to Core Foundation crates until they publish an updated
    # version to crates.io.
    "https://github.com/servo/core-foundation-rs",
]
# Allow git references to all GitHub repositories in the warpdotdev organization.
allow-org = { github = ["warpdotdev"] }

# git-cliff config — used to auto-generate "changes since the previous tag" for Zap Releases.
#
# Design principles:
# - Main grouping is by conventional commit type (feat/fix/refactor/docs/test/build/ci/ui/perf/chore).
# - scope is kept as a bold prefix `**(scope)**`, for quick scanning by subsystem (ai/ssh/i18n/linux/...).
# - Merge commits, pure chore(release), Revert, and other noise are skipped outright.
# - Non-conventional commits fall back into an "Other" group, so nothing is lost without polluting the main groups.
# - Outputs a plain fragment (no H1 heading or date block); the workflow appends it after the release_body's top description.

[changelog]
# Don't output the top-level `# Changelog` heading; the publish_release step handles overall layout.
header = ""

body = """
{%- if previous %}
{%- if previous.version %}
**Range**: [`{{ previous.version }}` … `{{ version }}`]({{ self::compare_url(prev=previous.version, curr=version) }})

{% endif -%}
{%- endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::commit_url(sha=commit.id) }})){% endif %}
{% endfor %}
{% endfor %}
{%- macro compare_url(prev, curr) -%}
https://github.com/zerx-lab/warp/compare/{{ prev }}...{{ curr }}
{%- endmacro -%}
{%- macro commit_url(sha) -%}
https://github.com/zerx-lab/warp/commit/{{ sha }}
{%- endmacro -%}
"""

# The comparison footer between tags is emitted by compare_url in the template above; no extra footer is appended here.
footer = ""

trim = true

[git]
# Don't error out when conventional-commit parsing fails; falls into commit_parsers' catch-all group.
conventional_commits = true
filter_unconventional = false
# Don't split multi-line bodies — one commit is one entry.
split_commits = false

# Tag naming: v prefix + arbitrary suffix (v2026.05.27.2 / v2026.05.06.preview / v2026.05.21.zaptest01).
tag_pattern = "v[0-9].*"

# Order follows the order commits appear in git log (newest → oldest), for readability.
topo_order = false
sort_commits = "newest"

# Ignore commits like merges / internal release tags that are meaningless to users.
commit_preprocessors = [
    # Strip the trailing PR-number parens from the first line, to avoid `(#171)` being shown twice alongside the hash link below.
    # Use `(?m)` so `$` anchors to the end of each line (the commit subject is the first line), not the end of the whole message.
    { pattern = '(?m) \(#[0-9]+\)$', replace = "" },
    # Strip the gitmoji prefix at the start of the commit subject (e.g. "♻️ refactor: ..."),
    # otherwise subsequent grouping rules like `^refactor` won't match and it falls into "Other".
    { pattern = '^(♻️|✨|🐛|🎨|🚀|🔥|💄|📝|🛠|⚡|🚧|🐳|🔧|🚨|✅|♿|🔒)[️]?\s*', replace = "" },
]

# Order-sensitive: the first match wins. Put noise skips first.
commit_parsers = [
    # Noise: skip
    { message = "^[Mm]erge ", skip = true },
    { message = "^[Rr]evert ", skip = true },
    { message = "^[Bb]ump ", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^v[0-9]+\\.", skip = true },

    # Main conventional-commit groups (rendering order matches the order below)
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactor" },
    { message = "^ui", group = "🎨 UI" },
    { message = "^style", group = "🎨 UI" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^docs", group = "📝 Docs" },
    { message = "^(build|ci|chore)", group = "🛠 Build & misc" },

    # Catch-all: keep any remaining commits too, placed in the "Other" group, so nonconforming commits aren't dropped.
    { message = ".*", group = "📦 Other" },
]

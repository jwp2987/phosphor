# cargo-fuzz layout (https://rust-fuzz.github.io/book/cargo-fuzz.html). Dev-only and NOT part of
# the root workspace: it has its own [workspace] table and the root manifest excludes it, so no
# default build, test or release build compiles it.
#
#   cargo install cargo-fuzz        # nightly toolchain required
#   cd fuzz && cp ../Cargo.lock Cargo.lock   # first time: reuse the app's pinned versions
#   cargo +nightly fuzz run ansi_parser -- -max_total_time=120
#
# See docs/dev-tooling.md.
[package]
name = "phosphor-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
warp = { path = "../app", features = ["dev-support"] }
# Renamed so the extern crate name does not collide with the `markdown_parser` fuzz binary.
md = { package = "markdown_parser", path = "../crates/markdown_parser" }
# Same pin as the root workspace (Cargo.toml `mermaid_to_svg`).
mermaid_to_svg = { git = "https://github.com/warpdotdev/mermaid-to-svg.git", rev = "8d3f789c2eb49335d7bf247a06bb649f59b6d4ed" }

[workspace]
members = ["."]

[[bin]]
name = "ansi_parser"
path = "fuzz_targets/ansi_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_parsers"
path = "fuzz_targets/hook_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_queue"
path = "fuzz_targets/input_queue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_parser"
path = "fuzz_targets/markdown_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mermaid_render"
path = "fuzz_targets/mermaid_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_decide"
path = "fuzz_targets/route_decide.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_facts_cell"
path = "fuzz_targets/key_facts_cell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typeahead_handoff"
path = "fuzz_targets/typeahead_handoff.rs"
test = false
doc = false
bench = false

# cargo-fuzz layout (https://rust-fuzz.github.io/book/cargo-fuzz.html). Dev-only and NOT part of
# the root workspace: it has its own [workspace] table and the root manifest excludes it, so no
# default build, test or release build compiles it.
#
#   cargo install cargo-fuzz        # nightly toolchain required
#   cd fuzz && cp ../Cargo.lock Cargo.lock   # first time: reuse the app's pinned versions
#   cargo +nightly fuzz run ansi_parser -- -max_total_time=120
#
# See docs/dev-tooling.md.
[package]
name = "phosphor-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
warp = { path = "../app", features = ["dev-support"] }
# Renamed so the extern crate name does not collide with the `markdown_parser` fuzz binary.
md = { package = "markdown_parser", path = "../crates/markdown_parser" }
# Same pin as the root workspace (Cargo.toml `mermaid_to_svg`).
mermaid_to_svg = { git = "https://gitlab.com/winters-phosphor/mermaid-to-svg.git", rev = "02c13c28bf0c751ee9d54b1f5e8877ba51a5f135" }

[workspace]
members = ["."]

# The same [patch.crates-io] as the root workspace (Cargo.toml): this crate is its own workspace, so
# the root's patches do not apply here, and `warpui` needs the vendored arboard's API (r18d8: the
# fuzz build failed on arboard::ClipboardFormats). Keep the two tables identical.
[patch.crates-io]
core-foundation = { git = "https://github.com/servo/core-foundation-rs", rev = "5eb228da0e6268cfafd9f9c49fc3ac2dc7c5d434" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", rev = "5eb228da0e6268cfafd9f9c49fc3ac2dc7c5d434" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", rev = "5eb228da0e6268cfafd9f9c49fc3ac2dc7c5d434" }
core-text = { git = "https://github.com/servo/core-foundation-rs", rev = "5eb228da0e6268cfafd9f9c49fc3ac2dc7c5d434" }
objc = { git = "https://github.com/warpdotdev/rust-objc.git", rev = "5b656827fa9f863ef0eb22e444a3fedac009e78a" }
pathfinder_simd = { git = "https://github.com/warpdotdev/pathfinder.git", rev = "34128a129ca6aee168fbc5060a4f21b4f7e486a9" }
yaml-rust = { git = "https://github.com/warpdotdev/yaml-rust.git", rev = "0aed385b7f0f1c89b709ea054a90313312ed0afb" }
tikv-jemallocator = { git = "https://github.com/warpdotdev/jemallocator.git", rev = "2ee30bfdf7059223b54810e4ea6c666f0a379e0b" }
tikv-jemalloc-sys = { git = "https://github.com/warpdotdev/jemallocator.git", rev = "2ee30bfdf7059223b54810e4ea6c666f0a379e0b" }
genai = { path = "../lib/rust-genai" }
arboard = { path = "../lib/arboard" }

[[bin]]
name = "ansi_parser"
path = "fuzz_targets/ansi_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_parsers"
path = "fuzz_targets/hook_parsers.rs"
test = false
doc = false
bench = false

[[bin]]

# GitLab CI for Phosphor (migration from .github/workflows/pr-check.yml, issue #989).
#
# Runners are selected by tag and both have run_untagged OFF, so every job MUST
# carry a `tags:` entry or it sits pending forever:
#   little-thing  linux amd64 (the build box)
#   Mac           darwin arm64
#   windows       Windows 10 x86_64 VM (shell executor, PowerShell 5.1)
#
# macOS Intel is intentionally absent (dropped for now; see #989).
#
# Port status: every pr-check.yml job is ported except the macOS Intel ones
# (dropped for now), plus MANUAL build jobs for the Mac DMG, the Linux
# AppImage/deb and the Windows installer, and the tag-triggered release pipeline (CLI tarballs -> digest pins ->
# installers -> GitLab release). The release pipeline has never run end to end.
#
# `little-thing` is the maintainer's build box, so jobs there must not change its
# environment: no apt installs, no rustup target additions, no cargo install.
# Missing prerequisites FAIL the job with a message instead.

workflow:
  rules:
    # Branch pipelines only: this repo merges straight to main, no merge requests,
    # and running both would duplicate every pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Both runners are ref_protected, so a pipeline on an UNPROTECTED ref could only sit
    # pending forever. Protected refs are `main`, `build/*` and `v*` tags (Maintainers
    # only): push work as `build/<name>` to get CI. Anything else is plain Git.
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: always
    - when: never

stages: [test, cli, build, apptest, publish]

variables:
  CARGO_TERM_COLOR: always
  # The build scripts detect CI through the GitHub Actions variables
  # (GITHUB_ACTIONS, GITHUB_OUTPUT, GITHUB_PATH, GITHUB_ENV). Rather than fork a
  # dozen scripts, shim them: GitLab has no equivalent, so the files below are
  # created in .shim_github_env and a job that cares reads them back.
  GITHUB_ACTIONS: "true"
  GITHUB_OUTPUT: "$CI_PROJECT_DIR/.ci/github_output"
  GITHUB_PATH: "$CI_PROJECT_DIR/.ci/github_path"
  GITHUB_ENV: "$CI_PROJECT_DIR/.ci/github_env"
  # #1613: mermaid_to_svg comes from our fork winters-phosphor/mermaid-to-svg, which is public, so
  # cargo clones it without credentials (the job-token URL rewrite that the private fork needed is gone).

.shim_github_env:
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci"
    - touch "$GITHUB_OUTPUT" "$GITHUB_PATH" "$GITHUB_ENV"

# Fork-boundary guards. Pure grep/git, no build, so this should finish in about a
# minute and give fast feedback ahead of the cargo jobs.
guards:
  extends: .shim_github_env
  stage: test
  tags: [little-thing]
  timeout: 10m
  interruptible: true
  variables:
    # The deletion guard diffs against a base commit and the oracle fetch needs
    # object lookups; a shallow clone has neither.
    GIT_DEPTH: "0"
  script:
    # The stub check compares against the pinned Warp stable release (ORACLE.md).
    # Fetch just that one commit, by FULL 40-character sha (abbreviations always
    # fail with "couldn't find remote ref"). Deliberately NOT tolerated if
    # missing: check_stub_coverage exits 0 when the pin object is absent, which
    # would silently disarm the guard.
    - |
      PIN=$(grep -oE '\*\*Commit \(full\)\*\* \| `[0-9a-f]{40}`' ORACLE.md | grep -oE '[0-9a-f]{40}' | head -1)
      if [[ -z "$PIN" ]]; then
        echo "ERROR: ORACLE.md has no 40-char '**Commit (full)**' row; cannot fetch the pin" >&2
        exit 1
      fi
      echo "pin=$PIN"
      git fetch --depth=1 --no-tags https://github.com/warpdotdev/warp.git "$PIN"
      git cat-file -e "${PIN}^{commit}" || {
        echo "ERROR: pin $PIN fetched but not present; stub coverage would silently skip" >&2
        exit 1
      }
    - ./script/check_cloud_boundary
    - ./script/check_stub_coverage
    - ./script/check_declined_collisions
    - ./script/check_dead_links
    # python3 is checked explicitly: check_brand_strings prints "skipped" and
    # exits 0 without it, which on a runner would read as a pass.
    - command -v python3 >/dev/null || { echo "ERROR python3 missing; check_brand_strings would self-skip" >&2; exit 1; }
    - ./script/check_brand_strings
    - ./script/check_ftl_escapes
    - ./script/check_settings_registry
    - ./script/check_channel_command_names
    - ./script/check_no_autoupdate
    - ./script/check_generator_wrapper_names
    - ./script/check_sweep_ledger
    - ./script/check_integration_test_registry
    - ./script/check_pty_doors
    - ./script/check_outbound_redaction
    - ./script/check_queue_access
    # Owner rule (2026-11-08): timers on the input path are give-up nets only. PENDING-CONVERSION entries warn here; the release tier runs it --strict (job input-timers-strict).
    - ./script/check_input_path_timers
    - ./script/check_input_path_timers --self-test
    # The tree is rustfmt-clean since the Rust 1.99 upgrade; this keeps it that way (whole tree, ~25 s).
    # rustfmt comes from the pinned toolchain through the maintainer's rustup proxy (read-only,
    # as in check-linux); runner shells have no toolchain on PATH.
    - RUSTUP_HOME=/home/winters/.rustup PATH="/home/winters/.cargo/bin:$PATH" ./script/check_rustfmt
    # #1521: both were precheck-only. check_workspace_clean is deliberately not here (it expects a hand-managed checkout, see docs/testing.md 2.3).
    - ./script/check_dangling_modules
    # The box has no pwsh (not approved for it): the parse gate runs where pwsh exists (script/precheck); here it is
    # reported as SKIPPED, never as a pass (check_pwsh_parse itself fails when CI is set and pwsh is missing).
    - 'if command -v pwsh >/dev/null; then ./script/check_pwsh_parse; else echo "SKIPPED check_pwsh_parse: no pwsh on this runner (it runs in script/precheck)"; fi'
    - ./script/check_test_results
    # #1522: the real-app harness's offline self-test (parsers, registries, report exit codes); pure Python, no app or display.
    - python3 script/realapp/appci/selftest.py
    # #1495: the release gate's offline fixtures (pass, failed job, wrong sha / tier, KNOWN, NOREF, missing platform).
    - python3 script/ci/test_check_release_gate.py
    # Large deletions. There are no pull requests here, so the base is the
    # previous tip of this branch (push), or the merge-base with main for a new
    # branch. The commit message stands in for the PR body: it is where a
    # `Large-deletion:` trailer or a DECLINED.md citation lives.
    - |
      git fetch -q origin main
      if [[ "$CI_COMMIT_BEFORE_SHA" =~ ^0+$ || -z "$CI_COMMIT_BEFORE_SHA" ]] || ! git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
        BASE=$(git merge-base HEAD origin/main)
      else
        BASE="$CI_COMMIT_BEFORE_SHA"
      fi
      echo "deletion base: $BASE"
      PHOSPHOR_DELETION_BASE="$BASE" PR_TITLE="$CI_COMMIT_TITLE" PR_BODY="$CI_COMMIT_MESSAGE" \
        ./script/check_large_deletions --require-base
    - ./script/macos/test_create_warpctrl_wrapper
    - ./script/test_warpctrl_early_dispatch
    # #1907: the REAL assembled bash bootstrap in a pty; a child `sh` must see PS1 unset, never an
    # empty exported one (python3 + bash + sh, ~12 s, no build). It was in docs/testing.md but run by nothing.
    - ./script/test_child_ps1

# cargo check on the build box. Every cargo call goes through script/agent-cargo,
# the slot/memory governor: unbounded concurrent compiles OOM-reaped this host
# before, and `resource_group` additionally serialises the heavy jobs across
# pipelines. The governor also pins CARGO_TARGET_DIR per agent name, which keeps a
# warm target dir between runs.
check-linux:
  extends: .shim_github_env
  stage: test
  tags: [little-thing]
  needs: [guards]
  resource_group: little-thing-cargo
  timeout: 90m
  interruptible: true
  variables:
    # The toolchain lives in the maintainer's home (read access granted to the runner
    # user by ACL, traverse-only). rustup only needs to READ its toolchains; cargo's
    # registry cache must be WRITABLE, so CARGO_HOME is the runner user's own.
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    # agent-cargo defaults to /cache/git/..., which does not exist on this box (it
    # then silently disables slot limiting). Give it a real, writable base.
    PHOSPHOR_TARGET_ROOT: /home/gitlab-runner/.phosphor-build/targets
    PHOSPHOR_LOCK_DIR: /home/gitlab-runner/.phosphor-build/locks
    PHOSPHOR_LOG_DIR: /home/gitlab-runner/.phosphor-build/logs
  script:
    # Non-interactive runner shells do not source ~/.bashrc, so cargo/rustup are not on
    # PATH. The runner user (gitlab-runner) has no toolchain of its own, so the maintainer's
    # /home/winters/.cargo/bin comes first. agent-cargo adds $HOME/.cargo/bin itself, but the
    # target check below runs before it.
    - sh script/ci/prune_target.sh || true
    - export PATH="/home/winters/.cargo/bin:$HOME/.cargo/bin:$PATH"
    # The pinned toolchain must already provide the target; adding one would
    # modify the box's rustup state.
    - rustup target list --installed | grep -qx x86_64-unknown-linux-gnu || { echo "ERROR target x86_64-unknown-linux-gnu is not installed on this runner; install it by hand (not done automatically on the build box)" >&2; exit 1; }
    # The GUI feature is the guardrail after any shared-crate change.
    - ./script/agent-cargo ci-check-linux check -p warp --features gui --lib --tests
    # Single-package checks miss feature-unified code (#230): `warp`'s
    # `integration_tests` feature only turns on when `warp` is checked in the SAME
    # invocation as `integration`.
    - ./script/agent-cargo ci-check-linux check -p warp -p warp_completer -p integration -p warp_ripgrep --features gui
    # The app crate carries the TUI via its own `tui` feature.
    - ./script/agent-cargo ci-check-linux check -p warp --features tui
    # warp_tui is not in default-members; check it explicitly.
    - ./script/agent-cargo ci-check-linux check -p warp_tui

# ---------------------------------------------------------------------------
# macOS (runner tag `Mac`, darwin arm64). The runner is a dedicated M1 Pro Mac, not the owner's laptop.
# These jobs are MANUAL: nothing compiles there until someone starts it.
# ---------------------------------------------------------------------------

# Read-only environment report: what the runner user can see and what is
# installed. Changes nothing. Start it from the pipeline page (or the API) when the
# runner's setup needs checking.
diag-mac:
  stage: test
  tags: [Mac]
  when: manual
  allow_failure: true
  timeout: 10m
  script:
    - echo "user=$(whoami) home=$HOME shell=$SHELL"
    - sw_vers; uname -m
    - df -h / "$HOME" | cat
    - vm_stat | head -4
    - pmset -g batt 2>/dev/null | head -2 || true
    - 'for t in rustc cargo rustup protoc brew clang xcodebuild python3 node cargo-nextest; do printf "%-14s %s\n" "$t" "$(command -v $t || echo MISSING)"; done'
    - 'xcode-select -p 2>&1 || true'
    - 'rustc --version 2>&1 || true'
    - 'ls -d "$HOME/.cargo/bin" "$HOME/.rustup" /opt/homebrew/bin 2>&1 || true'
    - 'rustup show 2>&1 | head -12 || true'
    - 'echo "--- running phosphor/caffeinate processes (do not disturb a live test):"; pgrep -lf "phosphor|caffeinate" || echo none'
    - 'ls -ld "$HOME/phosphor-profile" 2>&1 || true'

# cargo check for the macOS-only code paths (SMAppService login item, dock tile
# plugin, Launch Services registration). Manual until the runner's toolchain is
# confirmed with diag-mac. Never installs anything: a missing prerequisite fails
# with a message.
check-macos:
  extends: .shim_github_env
  stage: test
  tags: [Mac]
  when: manual
  needs: []
  timeout: 120m
  interruptible: true
  script:
    - export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
    - for t in cargo rustc protoc; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner; install it by hand (not done automatically)" >&2; exit 1; }; done
    - cargo check -p warp --features gui --lib --tests
    - cargo check -p warp --features tui
    - cargo check -p warp_tui

# ---------------------------------------------------------------------------
# Build jobs (manual). Start them from the pipeline page. The Mac runner is
# `ref_protected`, so the Mac job only runs for pipelines on main or a tag.
#
# These are NOT the full release pipeline: no CLI tarballs, so no digest pins are
# compiled in (remote-server install over ssh fails closed, as designed), no
# GIT_RELEASE_TAG, and nothing is published to a GitLab release. The output is a
# job artifact. Tools are installed only into the CI users' own homes
# (cargo-about / cargo-bundle via the SHA-verified script/install_cargo_binstall,
# linuxdeploy via script/linux/install_linuxdeploy), never system-wide.
# ---------------------------------------------------------------------------

# macOS arm64 DMG, ad-hoc signed (--selfsign), exactly as the GitHub release did.
build-macos-arm64:
  extends: .shim_github_env
  stage: build
  tags: [Mac]
  when: manual
  needs: []
  timeout: 3h
  variables:
    CHANNEL: oss
    # 16 GB Mac: cap parallelism so the build does not push it into
    # heavy swap (8 jobs measured: load 20, ~0.1 GB free, 3.5 GB swap).
    CARGO_BUILD_JOBS: "4"
    PHOSPHOR_DMG_SKIP_JENKINS: "1"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - for t in cargo rustc protoc hdiutil codesign lipo; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner; install it by hand (not done automatically)" >&2; exit 1; }; done
    - xcrun -sdk macosx metal --version >/dev/null || { echo "ERROR the Metal toolchain is missing (xcodebuild -downloadComponent MetalToolchain)" >&2; exit 1; }
    - ./script/install_cargo_release_deps --no-build-deps
    - ./script/install_cargo_bundle
    - ./script/macos/install_create_dmg
    - export GIT_RELEASE_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)-dev"
    - script/bundle --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --selfsign
    - |
      DMG=$(grep '^dmg_path=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      [ -f "$DMG" ] || { echo "ERROR no DMG at '$DMG'" >&2; exit 1; }
      mkdir -p dist && cp "$DMG" dist/
      (cd dist && shasum -a 256 * | tee SHA256SUMS)
    - script/ci/verify_artifacts.sh macos dist   # #1515: sums + codesign/spctl (reported; UNSIGNED)
    # Keep this build on THIS machine for app-test-macos-reuse (no download); see script/ci/cache_build.sh.
    - script/ci/cache_build.sh macos
  artifacts:
    name: phosphor-macos-arm64
    paths: [dist/]
    expire_in: 3 days
    when: on_success

# Linux x86_64 AppImage + deb on the build box. rpm and the Arch package are left
# out: rpmbuild and docker are not installed there and this job installs nothing
# system-wide.
build-linux-x86_64:
  extends: .shim_github_env
  stage: build
  tags: [little-thing]
  when: manual
  needs: []
  resource_group: little-thing-cargo
  timeout: 5h
  variables:
    CHANNEL: oss
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    CARGO_BUILD_JOBS: "8"
    APPIMAGE_EXTRACT_AND_RUN: "1"
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - rustup target list --installed | grep -qx x86_64-unknown-linux-gnu || { echo "ERROR target x86_64-unknown-linux-gnu is not installed on this runner" >&2; exit 1; }
    - for t in cargo protoc cmake pkg-config dpkg-deb fakeroot strip; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner; install it by hand (not done automatically)" >&2; exit 1; }; done
    - ./script/install_cargo_release_deps --no-build-deps
    - ./script/linux/install_linuxdeploy
    # Package scripts name the version after GIT_RELEASE_TAG, which only tag pipelines have.
    - export GIT_RELEASE_TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)-dev"
    - script/bundle --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
    - |
      PKG=$(grep '^packages_dir=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      [ -d "$PKG" ] || { echo "ERROR no packages dir at '$PKG'" >&2; exit 1; }
      # Launch what we are about to ship: proves the binary loads and reaches argument parsing.
      APPIMAGE=$(ls "$PKG"/*.AppImage 2>/dev/null | head -1)
      [ -n "$APPIMAGE" ] || { echo "ERROR no AppImage in $PKG" >&2; exit 1; }
      chmod +x "$APPIMAGE" && "$APPIMAGE" --appimage-extract-and-run --version
      # dpkg-deb names files after the internal package name ("zap"); rename to match.
      mkdir -p dist
      for f in "$PKG"/*; do
        b=$(basename "$f"); cp "$f" "dist/$(echo "$b" | sed -E 's/^zap([_-])/phosphor\1/')"
      done
      (cd dist && sha256sum * | tee SHA256SUMS)
    - script/ci/verify_artifacts.sh linux dist   # #1515: sums + .deb info/contents/dpkg -x in a scratch root
    # Keep this build on THIS machine for app-test-linux-*-reuse (no download); see script/ci/cache_build.sh.
    - script/ci/cache_build.sh linux
  artifacts:
    name: phosphor-linux-x86_64
    paths: [dist/]
    expire_in: 3 days
    when: on_success

# ---------------------------------------------------------------------------
# Windows jobs (manual). The `windows` runner is a Windows 10 x86_64 VM with the
# shell executor and Windows PowerShell 5.1. It runs as a STANDARD user (not an
# admin) inside the logged-in desktop session, so a job can open real windows.
# The toolchain is installed by hand once (script/windows/bootstrap.ps1, minus its
# gcloud tail): VS 2022 Build Tools + Windows SDK, Git, rustup, Strawberry Perl,
# protoc 25.1 (PROTOC is set for the user), CMake, jq and Inno Setup. Jobs never
# install anything: a missing prerequisite fails with a message.
#
# PowerShell does not stop on a native command's exit code, so every native call
# is followed by an explicit $LASTEXITCODE check.
#
# Git LFS: only *.pdb debug symbols and an optional model are in LFS, and the
# Linux and Mac builds already run with the pointer files; skip the smudge so a
# clone never needs LFS objects.
# ---------------------------------------------------------------------------

.windows_job:
  tags: [windows]
  needs: []
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script:
    - New-Item -ItemType Directory -Force "$env:CI_PROJECT_DIR\.ci" | Out-Null
    - foreach ($f in $env:GITHUB_OUTPUT, $env:GITHUB_PATH, $env:GITHUB_ENV) { if (-not (Test-Path $f)) { New-Item -ItemType File $f | Out-Null } }
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;C:\Program Files (x86)\Inno Setup 6;$env:PATH"

# Read-only environment report for the Windows runner. Changes nothing.
diag-windows:
  extends: .windows_job
  stage: test
  when: manual
  allow_failure: true
  timeout: 10m
  script:
    - whoami; [Environment]::OSVersion.VersionString; $env:PROCESSOR_ARCHITECTURE
    - '"cpus: " + (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors + "  ram GB: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)'
    - Get-PSDrive C | Format-Table -AutoSize | Out-String
    - 'foreach ($t in "git","cargo","rustc","rustup","perl","cmake","jq","ISCC","cargo-nextest") { "{0,-14} {1}" -f $t, ((Get-Command $t -ErrorAction SilentlyContinue).Source) }'
    - '"PROTOC=$env:PROTOC  exists=" + (Test-Path "$env:PROTOC")'
    - '& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property displayName'
    - rustup show

# Windows PowerShell 5.1 parse gate (#1507): every harness/build/CI/bundled .ps1 parsed by the VM's own 5.1 parser, plus
# after_job.ps1/restore.ps1 -Check (an after_script that does not parse fails silently). ~10 s. Manual here because the VM is
# not always up (an automatic job would leave every pipeline pending); it also runs as the FIRST before_script step of
# app-test-windows(-reuse), so no Windows app run starts on scripts 5.1 cannot parse.
guards-windows:
  extends: .windows_job
  stage: test
  when: manual
  allow_failure: true
  timeout: 10m
  script:
    - .\script\ci\parse_ps1.ps1
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }

# cargo check for the Windows-only code paths, with the same bin, features and
# profile the installer build uses (script/windows/bundle.ps1 -CHECK_ONLY).
check-windows:
  extends: .windows_job
  stage: test
  when: manual
  timeout: 3h
  interruptible: true
  script:
    - foreach ($t in "cargo","rustc","perl","cmake") { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Error "$t is missing on this runner; install it by hand (not done automatically)"; exit 1 } }
    - .\script\windows\bundle.ps1 -CHANNEL oss -CHECK_ONLY
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }

# test-windows (the warp + warp_tui lib tests, #1534) now sits with the other per-platform suites further down, and runs the same
# command as test-linux (default nextest profile, TEST_FILTER, check_test_failures): script/ci/run_suite.sh.

# Windows x86_64 installer (Inno Setup), unsigned. Like the other build jobs this is
# NOT the release pipeline: no CLI tarballs or digest pins, nothing published; the
# output is a job artifact.
build-windows-x86_64:
  extends: .windows_job
  stage: build
  when: manual
  timeout: 5h
  variables:
    CARGO_BUILD_JOBS: "8"
  script:
    - foreach ($t in "cargo","rustc","perl","cmake","ISCC") { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Error "$t is missing on this runner; install it by hand (not done automatically)"; exit 1 } }
    - if (-not (Test-Path "$env:PROTOC")) { Write-Error "PROTOC is not set to an existing protoc.exe on this runner"; exit 1 }
    - $version = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
    # cargo-about generates the bundled third-party licenses (same pin as script/install_cargo_release_deps).
    - if (-not ((Get-Command cargo-about -ErrorAction SilentlyContinue) -and ((cargo-about --version) -match "0\.8\.4"))) { cargo install cargo-about --version 0.8.4 --locked --force; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
    - .\script\windows\bundle.ps1 -CHANNEL oss -ARCH x64 -RELEASE_TAG "v$version-dev"
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - |
      $installer = (Select-String -Path $env:GITHUB_OUTPUT -Pattern '^installer_path=(.*)$' | Select-Object -Last 1).Matches[0].Groups[1].Value
      if (-not $installer -or -not (Test-Path $installer)) { Write-Error "no installer at '$installer'"; exit 1 }
      New-Item -ItemType Directory -Force dist | Out-Null
      Copy-Item $installer dist\
      Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } | Tee-Object -FilePath dist\SHA256SUMS
    - .\script\ci\verify_artifacts.ps1 -Dist dist   # #1515: sums + Authenticode (reported; UNSIGNED)
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    # Keep this build on THIS machine for app-test-windows-reuse (no download); see script/ci/cache_build.ps1.
    - .\script\ci\cache_build.ps1
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
  artifacts:
    name: phosphor-windows-x86_64
    paths: [dist/]
    expire_in: 3 days
    when: on_success

# ---------------------------------------------------------------------------
# Profiling builds (#1169, manual). The `profiling` cargo profile is release-lto
# with symbols kept; these jobs build the app binary directly (NOT through the
# bundlers, which strip) and publish it UNSTRIPPED as a 7-day artifact. They are
# for samply / Instruments / WPA / Tracy (docs/profiling.md), never a release:
# no installer, no dmg.
#
# PROFILING_FEATURES defaults to the Tracy `profiling` feature. Set it to "" in
# the pipeline variables for a plain sampling-profiler build with no extra code.
# ---------------------------------------------------------------------------

build-linux-profiling:
  extends: .shim_github_env
  stage: build
  tags: [little-thing]
  when: manual
  needs: []
  resource_group: little-thing-cargo
  timeout: 5h
  variables:
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    CARGO_BUILD_JOBS: "8"
    PROFILING_FEATURES: "profiling"
    # Keep the DWARF inside the one binary (the profile's inherited "packed" would
    # write a separate .dwp on Linux).
    CARGO_PROFILE_PROFILING_SPLIT_DEBUGINFO: "off"
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - rustup target list --installed | grep -qx x86_64-unknown-linux-gnu || { echo "ERROR target x86_64-unknown-linux-gnu is not installed on this runner" >&2; exit 1; }
    # cmake and a C++ compiler: the Tracy client (feature `profiling`) is vendored C++.
    - for t in cargo protoc cmake pkg-config c++; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner; install it by hand (not done automatically)" >&2; exit 1; }; done
    # Same as script/linux/bundle: setting RUSTFLAGS replaces the mold [target] flags
    # (mold miscompiles .rela.dyn here), so symbol-mangling-version is repeated.
    # force-frame-pointers gives OUR code frame pointers (cheap `perf --call-graph fp`),
    # but the prebuilt std/libc have none, so fp unwinding stops at the first std frame.
    # samply's DWARF unwinder handles those frames; prefer it.
    - export RUSTFLAGS="-C symbol-mangling-version=v0 -C force-frame-pointers=yes -C target-cpu=x86-64-v3"
    - export APPIMAGE_NAME="Phosphor-x86_64.AppImage"
    - FEATURES="release_bundle,gui,nld_improvements${PROFILING_FEATURES:+,$PROFILING_FEATURES}"
    - cargo build -p warp --profile profiling --bin phosphor-oss --features "$FEATURES"
    - mkdir -p dist
    # No `strip` anywhere in this job: that is the point.
    - cp target/profiling/phosphor-oss dist/phosphor-oss-profiling
    - readelf -S dist/phosphor-oss-profiling | grep -q '\.debug_line' || { echo "ERROR the profiling binary has no DWARF line tables" >&2; exit 1; }
    - readelf -S dist/phosphor-oss-profiling | grep -q '\.symtab' || { echo "ERROR the profiling binary has no symbol table (stripped?)" >&2; exit 1; }
    - (cd dist && sha256sum * | tee SHA256SUMS)
  artifacts:
    name: phosphor-linux-profiling
    paths: [dist/]
    expire_in: 7 days
    when: on_success

build-macos-profiling:
  extends: .shim_github_env
  stage: build
  tags: [Mac]
  when: manual
  needs: []
  timeout: 3h
  variables:
    CARGO_BUILD_JOBS: "4"
    PROFILING_FEATURES: "profiling"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - for t in cargo rustc protoc dsymutil; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner; install it by hand (not done automatically)" >&2; exit 1; }; done
    - xcrun -sdk macosx metal --version >/dev/null || { echo "ERROR the Metal toolchain is missing (xcodebuild -downloadComponent MetalToolchain)" >&2; exit 1; }
    # Frame pointers are already on for aarch64-apple-darwin; nothing to add.
    - FEATURES="release_bundle,gui,nld_improvements${PROFILING_FEATURES:+,$PROFILING_FEATURES}"
    # A bare binary, not an .app: samply and Instruments both attach to it, and the
    # dSYM (split-debuginfo = packed) is produced next to it.
    - cargo build -p warp --profile profiling --bin phosphor-oss --features "$FEATURES"
    - mkdir -p dist
    - cp target/profiling/phosphor-oss dist/phosphor-oss-profiling
    - if [ -d target/profiling/phosphor-oss.dSYM ]; then cp -R target/profiling/phosphor-oss.dSYM dist/phosphor-oss-profiling.dSYM; else echo "WARNING no dSYM produced" >&2; fi
    - (cd dist && shasum -a 256 phosphor-oss-profiling | tee SHA256SUMS)
  artifacts:
    name: phosphor-macos-profiling
    paths: [dist/]
    expire_in: 7 days
    when: on_success

build-windows-profiling:
  extends: .windows_job
  stage: build
  when: manual
  timeout: 5h
  variables:
    CARGO_BUILD_JOBS: "8"
    PROFILING_FEATURES: "profiling"
  script:
    - foreach ($t in "cargo","rustc","perl","cmake") { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Error "$t is missing on this runner; install it by hand (not done automatically)"; exit 1 } }
    - if (-not (Test-Path "$env:PROTOC")) { Write-Error "PROTOC is not set to an existing protoc.exe on this runner"; exit 1 }
    - $features = "release_bundle,gui,nld_improvements"
    - if ($env:PROFILING_FEATURES) { $features = "$features,$env:PROFILING_FEATURES" }
    - cargo build -p warp --profile profiling --bin phosphor-oss --features "$features"
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - New-Item -ItemType Directory -Force dist | Out-Null
    # The .pdb is what WPA / Superluminal / samply read; ship it next to the exe.
    - Copy-Item target\profiling\phosphor-oss.exe dist\phosphor-oss-profiling.exe
    - Get-ChildItem target\profiling\*.pdb | Where-Object { $_.Name -like "phosphor*oss.pdb" } | Select-Object -First 1 | Copy-Item -Destination dist\phosphor-oss-profiling.pdb
    - Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } | Tee-Object -FilePath dist\SHA256SUMS
  artifacts:
    name: phosphor-windows-profiling
    paths: [dist/]
    expire_in: 7 days
    when: on_success

# ---------------------------------------------------------------------------
# Test jobs (ported from pr-check.yml). All run on the build box and all go
# through script/agent-cargo (slot/memory governor); `resource_group` serialises
# them with every other cargo job across pipelines.
#
# Heavy suites run automatically only for release tags. Everywhere else they are manual
# (and never block the pipeline): a full nextest build is far too expensive to repeat on
# every push.
#
# They share ONE agent-cargo label (`ci-test`) and therefore one target dir, so the
# test-profile dependency graph is compiled once, not once per job. Per-job labels
# would cost tens of GB each on a box with limited disk.
# ---------------------------------------------------------------------------

.box_job:
  extends: .shim_github_env
  stage: test
  tags: [little-thing]
  needs: [guards]
  resource_group: little-thing-cargo
  interruptible: true
  variables:
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    PHOSPHOR_TARGET_ROOT: /home/gitlab-runner/.phosphor-build/targets
    PHOSPHOR_LOCK_DIR: /home/gitlab-runner/.phosphor-build/locks
    PHOSPHOR_LOG_DIR: /home/gitlab-runner/.phosphor-build/logs
    PHOSPHOR_CARGO_LABEL: ci-test
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci"
    - touch "$GITHUB_OUTPUT" "$GITHUB_PATH" "$GITHUB_ENV"
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    # Keep the persistent target dirs bounded (script/ci/prune_target.sh; docs/testing.md 2.5).
    - sh script/ci/prune_target.sh || true
    - command -v cargo-nextest >/dev/null || { echo "ERROR cargo-nextest is missing on this runner (expected in /home/winters/.cargo/bin)" >&2; exit 1; }

.heavy_rules:
  rules:
    # Automatic only for release tags. On main and build/* they are manual: a pipeline per
    # push that rebuilds the whole test graph would monopolise the build box. Flip the first
    # condition back to `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG` to gate
    # every push to main again once the suites are known-good.
    # allow_failure is explicitly false on a tag: these suites are part of the release gate (.release_quality_needs).
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# #1503, owner 2026-11-02: pushes to main do NOT run the suites automatically (mass pushes would queue a test run
# each). Tags run them; everything else is manual. The intended future gate is merge requests: when the repo moves to
# MRs, add `- if: '$CI_PIPELINE_SOURCE == "merge_request_event"'` (when: on_success, AUTO_DERIVE: "1") here, and let
# MR pipelines through `workflow:` (today it drops them) with a runner that may run unprotected refs.
.main_push_rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: manual
      allow_failure: true

# Dependency licence gate: deny.toml / about.toml were claimed to be enforced in CI
# since the fork was created and nothing ran them (see pr-check.yml history).
# `check sources` is wider than upstream ran: the fork has a personal winit fork
# upstream never had.
licenses:
  extends: .box_job
  timeout: 30m
  # Network-dependent (#1518): a transient fetch failure retries instead of failing the round. A real finding also retries (GitLab
  # cannot filter on the log) and fails again, only slower; script/ci/ci_seq.py reports a fetch outage as NETWORK-FAIL, apart from code failures.
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  script:
    - ./script/ci/cargo_deny licenses   # #1518: pinned cargo-deny, installed only when missing
    - ./script/check_license_config_sync

# RustSec gate (#1076): fails on any vulnerability, unsound or unmaintained
# advisory for a crate in the graph that deny.toml's [advisories] ignore list
# does not name with a reason. A sibling of `licenses`, not a step in it: the
# advisory DB changes underneath us without a commit, and a new advisory must
# not read as a licence failure (or hide one). Fetches the advisory DB from
# GitHub, so it needs network on the runner.
advisories:
  extends: .box_job
  timeout: 30m
  # Network-dependent (#1518): a transient fetch failure retries instead of failing the round. A real finding also retries (GitLab
  # cannot filter on the log) and fails again, only slower; script/ci/ci_seq.py reports a fetch outage as NETWORK-FAIL, apart from code failures.
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  script:
    - ./script/ci/cargo_deny advisories   # #1518: pinned cargo-deny; a failed DB fetch falls back to a < 7-day-old cached DB, loudly

# warp + warp_tui lib tests, gated on CHANGE not on redness
# (script/check_test_failures + known_test_failures.txt). BOTH crates in ONE
# invocation, on purpose: a listed failure that did not run counts as "fixed" and
# fails the gate. nextest, not `cargo test`: the suite was stabilised under its
# process-per-test isolation.
test-linux:
  extends: [.box_job, .main_push_rules]
  timeout: 3h
  script:
    - |
      if [[ -n "${AUTO_DERIVE:-}" && -z "${TEST_FILTER:-}" ]]; then
        git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null || git fetch -q --depth=500 origin "$CI_COMMIT_BEFORE_SHA" || true
        eval "$(python3 script/ci/ci_seq.py --derive-env "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" linux)"
        echo "main push: RUN_SUITE=$RUN_SUITE TEST_FILTER=${TEST_FILTER:-<none: full suite>}"
        if [[ "$RUN_SUITE" == 0 ]]; then echo "skipped: nothing in test-linux's scope changed"; exit 0; fi
      fi
    # #1504: a filtered run also fails when a test(/.../) term of TEST_FILTER selected no test that ran.
    - |
      set -o pipefail
      st=0
      ./script/check_test_failures -p warp -p warp_tui --lib --features warp/gui ${TEST_FILTER:+-E "$TEST_FILTER"} 2>&1 | tee nextest-linux.log | python3 script/ci/filter_test_log.py || st=$?
      if [[ -n "${TEST_FILTER:-}" ]]; then python3 script/ci/check_filter_terms.py "$TEST_FILTER" nextest-linux.log || st=$(( st ? st : 1 )); fi
      exit $st
  # The job log is capped at 4 MB and a failing UI test's INFO/WARN spam used to push its panic text out of it
  # (round 8, paced agent fuzz): the job log shows the filtered output, the full one is this artifact.
  artifacts:
    name: nextest-linux
    when: always
    expire_in: 7 days
    paths:
      - nextest-linux.log

# warpui_core with --features tui. The flag is NOT optional: elements/tui/ is
# cfg(feature = "tui"), so without it those ~259 tests do not exist, and the run
# reports a green that says nothing about them.
test-warpui-core:
  extends: [.box_job, .main_push_rules]
  timeout: 90m
  script:
    - |
      if [[ -n "${AUTO_DERIVE:-}" ]]; then
        git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null || git fetch -q --depth=500 origin "$CI_COMMIT_BEFORE_SHA" || true
        eval "$(python3 script/ci/ci_seq.py --derive-env "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" core)"
        if [[ "$RUN_SUITE" == 0 ]]; then echo "skipped: warpui_core did not change"; exit 0; fi
      fi
    - ./script/check_test_failures -p warpui_core --features tui ${TEST_FILTER:+-E "$TEST_FILTER"}

# insta snapshots: run every package that has `insta` snapshot tests with INSTA_UPDATE=always so
# new/changed snapshots are WRITTEN (never fails on a snapshot diff), and upload them. A human
# reviews the uploaded .snap files and commits them; the normal test jobs then compare against
# them. Manual, never part of a tier (docs/testing.md 2.7 / 2.10).
insta-snapshots:
  extends: [.box_job]
  when: manual
  allow_failure: true
  timeout: 90m
  variables:
    INSTA_UPDATE: "always"
    INSTA_FORCE_PASS: "1"
  script:
    - ./script/agent-cargo ci-test test -p markdown_parser -p warp_editor -p warpui_core --tests
    - ./script/agent-cargo ci-test test -p warp --features gui --lib -- snapshot
  artifacts:
    name: insta-snapshots
    when: always
    expire_in: 7 days
    paths:
      - "**/snapshots/*.snap"
      - "**/snapshots/*.snap.new"

# The rest of the workspace: one invocation listing every package, exactly as
# script/precheck does. Do not split it: check_test_failures treats a known failure
# that did not run as "fixed", and splitting thrashes the shared target dir.
test-workspace-rest:
  extends: [.box_job, .heavy_rules]
  timeout: 3h
  script:
    - |
      set -o pipefail
      ./script/check_test_failures \
          -p sum_tree -p string-offset -p fuzzy_match -p handlebars -p syntax_tree \
          -p languages -p asset_cache -p settings_value -p jsonrpc -p simple_logger \
          -p warp_logging -p channel_versions -p command -p http_client -p warp_features \
          -p voice_input -p warp_isolation_platform -p websocket \
          -p input_classifier -p warp_search_core -p persistence -p settings \
          -p warp_managed_secrets -p markdown_parser -p warp_util -p warp_core \
          -p repo_metadata -p warp_terminal -p warp_files -p local_control -p vim \
          -p warp_completer -p warpui -p warpui_extras -p ai -p remote_server \
          -p usage_suite -p warp_editor -p warp_cli ${TEST_FILTER:+-E "$TEST_FILTER"} \
          2>&1 | tee nextest-rest.log | python3 script/ci/filter_test_log.py
  artifacts:
    name: nextest-rest
    when: always
    expire_in: 7 days
    paths:
      - nextest-rest.log

# ~300 GUI-driving scenarios (crates/integration) that need a display: xvfb-run
# supplies one, mesa-vulkan-drivers the software renderer. MANUAL (tier-driven, no schedules);
# allow_failure only keeps the hand-played pipeline green: since 2026-11-09 the candidate and
# release tier verdicts (script/ci/ci_seq.py) GATE on it, a red shard fails the tier. `--profile ci` is required (it holds the retries), and the suite is split in
# three by nextest's deterministic --partition.
integration-linux:
  extends: .box_job
  timeout: 150m
  when: manual
  allow_failure: true
  # The ssh scenarios connect to a local unprivileged sshd on 127.0.0.1 that each scenario starts
  # and stops itself (#1506, docs/testing.md 2.2). With this set a missing/broken sshd FAILS them
  # instead of skipping, so they cannot silently stop running.
  variables:
    PHOSPHOR_REQUIRE_SSH_FIXTURE: "1"
  parallel:
    matrix:
      - SHARD: ["1", "2", "3"]
  script:
    - command -v xvfb-run >/dev/null || { echo "ERROR xvfb-run is missing on this runner" >&2; exit 1; }
    - 'test -x /usr/sbin/sshd || command -v sshd >/dev/null || { echo "ERROR sshd (openssh-server) is missing on this runner: the ssh integration scenarios need it (#1506)" >&2; exit 1; }'
    - command -v ssh-keygen >/dev/null || { echo "ERROR ssh-keygen is missing on this runner" >&2; exit 1; }
    - 'echo "nproc: $(nproc)"; free -h; df -h /home'
    - xvfb-run -a -s "-screen 0 1280x1024x24" ./script/agent-cargo "$PHOSPHOR_CARGO_LABEL" nextest run -p integration --profile ci --partition "count:${SHARD}/3"

# The two scenarios gated on PowerShell (#796). They resolve the shell from the
# runner's own default, so PHOSPHOR_TEST_SHELL pins pwsh. pwsh is installed into the
# runner user's own home from the pinned tarball (script/linux/install_pwsh needs sudo
# and writes to /opt and /usr/bin, which this job must not do).
integration-linux-pwsh:
  extends: .box_job
  timeout: 60m
  when: manual
  allow_failure: true
  variables:
    PHOSPHOR_TEST_SHELL: pwsh
  script:
    - command -v xvfb-run >/dev/null || { echo "ERROR xvfb-run is missing on this runner" >&2; exit 1; }
    - |
      if ! command -v pwsh >/dev/null; then
        V=$(sed -n 's/^PWSH_VERSION="\(.*\)"/\1/p' script/linux/install_pwsh)
        [ -n "$V" ] || { echo "ERROR could not read PWSH_VERSION from script/linux/install_pwsh" >&2; exit 1; }
        mkdir -p "$HOME/.local/opt/pwsh" "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/pwsh.tar.gz" "https://github.com/PowerShell/PowerShell/releases/download/v${V}/powershell-${V}-linux-x64.tar.gz"
        tar zxf "$HOME/.local/pwsh.tar.gz" -C "$HOME/.local/opt/pwsh" && rm -f "$HOME/.local/pwsh.tar.gz"
        chmod +x "$HOME/.local/opt/pwsh/pwsh"
        ln -sf "$HOME/.local/opt/pwsh/pwsh" "$HOME/.local/bin/pwsh"
      fi
    - pwsh -Version
    - xvfb-run -a -s "-screen 0 1280x1024x24" ./script/agent-cargo "$PHOSPHOR_CARGO_LABEL" nextest run -p integration --profile ci -E 'test(test_input_reporting_powershell) or test(test_pwsh_vi_edit_mode_does_not_corrupt_commands)'

# ---------------------------------------------------------------------------
# Dev-tooling suites (docs/dev-tooling.md). All MANUAL and non-blocking: nothing here runs
# unless someone starts it from the pipeline page, and none of it gates the default pipeline.
# They use the runner user's own CARGO_HOME for any tool they fetch (cargo binstall, as the
# `licenses` job does); nothing is installed into the maintainer's home or the system.
# ---------------------------------------------------------------------------

# shuttle (random schedules) and loom (every schedule) interleaving tests of the clipboard
# primitives, the key-path cells and the input pipeline (pane queue drain vs the deferred mailbox,
# the ssh hand-over, the hand-off holds, the stamp-then-decide gen order: #1512, #1531; they live in
# `app/src/terminal/model/pipeline_model_tests.rs`, whose module name ends in `model_tests` and
# whose tests are named `model_*`, so the filter below selects them). `--cfg shuttle` / `--cfg phosphor_loom` rebuild every crate, so
# each gets its own agent-cargo target dir; RUSTFLAGS replaces .cargo/config.toml's flags, which
# only matters for linking on macOS. The `model_tests::model_` filter selects the model tests (the
# rest of the suite uses real primitives outside a model): a model test lives in a module named
# `model_tests` or `*_model_tests` and is named `model_*`. `model_tests::` alone also matched the
# ordinary `file_search_model_tests::test_*`, which crashes under loom outside a model (r18u22).
# Release-tier gate (script/ci/ci_seq.py plays it): the input-path timer guard in --strict mode, which fails on any
# PENDING-CONVERSION entry in script/input_path_timers.allow (docs/testing.md 2.3).
input-timers-strict:
  extends: .shim_github_env
  stage: test
  tags: [little-thing]
  timeout: 10m
  when: manual
  script:
    - command -v python3 >/dev/null || { echo "ERROR python3 missing" >&2; exit 1; }
    - ./script/check_input_path_timers --strict

test-shuttle-loom:
  extends: .box_job
  timeout: 150m
  when: manual
  allow_failure: true
  script:
    - 'export RUSTFLAGS="--cfg shuttle"'
    - './script/agent-cargo ci-shuttle test -p warpui_core --lib --release -- model_tests::model_'
    - './script/agent-cargo ci-shuttle test -p warp --features gui --lib --release -- model_tests::model_'
    - 'export RUSTFLAGS="--cfg phosphor_loom"'
    # Exhaustive loom on the warp model tests never finished in 150 min (r18u19); explore every
    # schedule with up to 2 forced preemptions, the bound loom's docs recommend. Raise it locally to dig.
    - 'export LOOM_MAX_PREEMPTIONS="${LOOM_MAX_PREEMPTIONS:-2}"'
    - './script/agent-cargo ci-loom test -p warpui_core --lib --release -- model_tests::model_'
    - './script/agent-cargo ci-loom test -p warp --features gui --lib --release -- model_tests::model_'

# cargo-fuzz smoke: each target for FUZZ_SECONDS (default 180, i.e. 2-5 minutes each), seeded
# from the committed corpora. RUSTC_BOOTSTRAP=1 lets the pinned stable toolchain build with the
# sanitizer flags cargo-fuzz needs, so no nightly is installed. A crash fails the job and the
# artifacts are kept.
fuzz-smoke:
  extends: .box_job
  timeout: 90m
  when: manual
  allow_failure: true
  variables:
    FUZZ_SECONDS: "180"
    RUSTC_BOOTSTRAP: "1"
  script:
    - command -v cargo-fuzz >/dev/null || ./script/install_cargo_binstall
    - command -v cargo-fuzz >/dev/null || cargo binstall --force -y cargo-fuzz
    # The fuzz crate has its own lockfile; start from the app's so versions match.
    - cp Cargo.lock fuzz/Cargo.lock
    # libFuzzer's progress lines go to fuzz/logs/<target>.log, not the trace (they overran GitLab's 4 MB trace limit and
    # cut off the r18u23 crash's panic message); the trace keeps the final stats and any crash's panic text.
    - ./script/ci/fuzz_smoke.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - fuzz/artifacts/
      - fuzz/logs/

# The scope of the `mutants` job (box, Mac and Windows): one definition so the three platforms mutate the same code.
.mutants_scope:
  variables:
    MUTANTS_PACKAGE: "warp"
    MUTANTS_FILES: "app/src/terminal/pane_key.rs app/src/terminal/model/key_facts.rs app/src/terminal/input_queue/gates.rs app/src/terminal/input_queue/table.rs app/src/terminal/input_queue/facts.rs app/src/terminal/input_queue/mod.rs app/src/terminal/input_queue/pane.rs app/src/terminal/input_queue/shadow.rs app/src/terminal/view/dest_table.rs"
    MUTANTS_TEST_FILTER: "test(/terminal::(pane_key|model::key_facts|input_queue)::/) | test(/terminal::view::tests::.*(table_mode|shadow_mode|legacy_mode|route_facts|shadow_reports)/)"
    MUTANTS_SHARD: ""

# cargo-mutants, SCOPED (release tier). Default scope = the pure, self-contained input-path logic:
# app/src/terminal/{pane_key.rs, model/key_facts.rs, view/dest_table.rs, input_queue/{gates,table,facts,mod,pane,shadow}.rs}
# (the #1424 destination table and its plumbing; ~4,000 lines, so several hundred mutants: UNMEASURED, shard it with
# MUTANTS_SHARD=k/n; the legacy input_queue/destination.rs is NOT in scope, it is the 134-line function being replaced) with the test run restricted to their modules via
# MUTANTS_TEST_FILTER, so each mutant costs one incremental `warp` rebuild plus a few seconds of tests
# (estimate 3-5 min each; UNMEASURED - the first run records it, and the scope is now too wide for one 5 h job). Widen by setting
# MUTANTS_FILES / MUTANTS_TEST_FILTER as play-time variables, or split a wide run with
# MUTANTS_SHARD=k/n; see docs/testing.md "Test tiers". Misses are reported, not failed on;
# `mutants.out/` is kept as the artifact.
mutants:
  extends: [.box_job, .mutants_scope]
  timeout: 5h
  when: manual
  allow_failure: true
  script:
    - ./script/ci/clean_mutants_tmp.sh   # #1764: stale cargo-mutants-*.tmp from a cancelled run
    - command -v cargo-mutants >/dev/null || ./script/install_cargo_binstall
    - command -v cargo-mutants >/dev/null || cargo binstall --force -y cargo-mutants
    - |
      FILE_ARGS=""
      for f in $MUTANTS_FILES; do FILE_ARGS="$FILE_ARGS --file $f"; done
      ./script/agent-cargo ci-mutants mutants -p "$MUTANTS_PACKAGE" --no-shuffle $FILE_ARGS --cargo-test-arg=-p --cargo-test-arg=warp_tui --cargo-test-arg=--lib --cargo-test-arg=--features --cargo-test-arg=warp/gui ${MUTANTS_SHARD:+--shard "$MUTANTS_SHARD"} ${MUTANTS_TEST_FILTER:+--cargo-test-arg=-E --cargo-test-arg="$MUTANTS_TEST_FILTER"} || echo "cargo-mutants exited $? (missed mutants are reported in mutants.out/)"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - mutants.out/

# The second scoped target: the warpui_core clipboard (clipboard.rs + clipboard_utils.rs), tested by warpui_core's
# own tests only, so no `warp` rebuild per mutant. Estimate 25-40
# mutants, ~1 min each (unmeasured).
mutants-warpui-core:
  extends: .box_job
  timeout: 4h   # 250 mutants x ~43 s (build + test) is ~3 h; 90m timed out in r18u23 (job_token_expired)
  when: manual
  allow_failure: true
  script:
    - ./script/ci/clean_mutants_tmp.sh   # #1764: stale cargo-mutants-*.tmp from a cancelled run
    - command -v cargo-mutants >/dev/null || ./script/install_cargo_binstall
    - command -v cargo-mutants >/dev/null || cargo binstall --force -y cargo-mutants
    - ./script/agent-cargo ci-mutants-core mutants -p warpui_core --no-shuffle --cargo-test-arg=--features --cargo-test-arg=tui --file crates/warpui_core/src/clipboard.rs --file crates/warpui_core/src/clipboard_utils.rs || echo "cargo-mutants exited $? (missed mutants are reported in mutants.out/)"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - mutants.out/

# criterion benches (the pane queue, destination table, hand-off reads, ANSI throughput). The
# HTML reports and raw estimates are stored as artifacts; compare two runs with
# `--baseline` locally. Timings on a shared build box are noisy, so the gate
# (script/bench_gate.py + script/bench_thresholds.json, #1533) uses generous per-bench max
# medians from the bench-file budgets: it catches order-of-magnitude regressions, and the
# job FAILS on one (or on a bench missing from the output). Update limits per docs/dev-tooling.md.
bench:
  extends: .box_job
  timeout: 90m
  when: manual
  script:
    - ./script/agent-cargo ci-bench bench -p warp --features dev-support --bench key_path_bench --bench ansi_bench --bench routing_bench
    - mkdir -p bench-results
    - cp -r "$PHOSPHOR_TARGET_ROOT"/ci-bench/criterion bench-results/ 2>/dev/null || { echo "no criterion output found under $PHOSPHOR_TARGET_ROOT/ci-bench" >&2; exit 1; }
    - python3 script/bench_gate.py "$PHOSPHOR_TARGET_ROOT"/ci-bench/criterion
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bench-results/

# ===========================================================================
# Every box suite on the Mac and Windows runners too (owner 2026-11-03: "the tests need to be the same on all boxes").
# The command of each suite lives in script/ci/run_suite.sh (one definition for both platforms; it mirrors the box job of the
# same name). All MANUAL and allow_failure, never automatic on a push; script/ci/ci_seq.py plays them: the three unit suites
# from the candidate tier up, the heavy ones in the release tier, after that platform's app tests (each runner is one
# machine; resource_group mac-gui / windows-gui also serialises them with the app tests). Failures are judged against
# script/known_test_failures_<platform>.txt (empty at first: the first run files the platform's real failures).
# Tools go only into the CI user's own ~/.cargo/bin when missing (cargo-binstall, cargo-nextest, cargo-mutants, cargo-fuzz).
# fuzz-smoke-windows FAILS LOUDLY by design: cargo-fuzz supports only Unix-like systems.
# ===========================================================================

.mac_suite:
  extends: .shim_github_env
  stage: test
  tags: [Mac]
  when: manual
  allow_failure: true
  needs: []
  resource_group: mac-gui
  interruptible: true
  variables:
    # 16 GB Mac: same cap as build-macos-arm64 (script/ci/run_suite.sh sets PHOSPHOR_BUILD_JOBS from it).
    CARGO_BUILD_JOBS: "4"
    PHOSPHOR_BUILD_JOBS: "4"

.windows_suite:
  extends: .windows_job
  stage: test
  when: manual
  allow_failure: true
  resource_group: windows-gui
  interruptible: true
  variables:
    CARGO_BUILD_JOBS: "8"
    PHOSPHOR_BUILD_JOBS: "8"
  before_script:
    - !reference [.windows_job, before_script]
    - foreach ($t in "cargo","rustc","perl","cmake") { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Error "$t is missing on this runner; install it by hand (not done automatically)"; exit 1 } }
    - if (-not (Test-Path "$env:PROTOC")) { Write-Error "PROTOC is not set to an existing protoc.exe on this runner"; exit 1 }
    - if (-not (Test-Path "C:\Program Files\Git\bin\bash.exe")) { Write-Error "Git for Windows bash is missing on this runner"; exit 1 }
    - $env:PHOSPHOR_PYTHON = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"



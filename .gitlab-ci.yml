# ===========================================================================
# Real-app tests (docs/testing.md section 2.8): the release-test matrix driven against the BUILT app, in both session
# modes (terminal and agent), with exact received-command checks, screenshots and logs as artifacts. Heavy and GUI
# driving, so MANUAL and non-blocking like the builds they need; script/ci/ci_seq.py plays them after each build.
# They share resource_group little-thing-gui (box) so two never fight over the compositor/GPU, and must not run while
# someone measures latency on the same machine. Nothing is installed: missing tools fail the job with the list.
# Provider-dependent agent cases skip unless the CI variable APPCI_OLLAMA_URL is set (no credentials are ever in CI).
# ===========================================================================

.appci_linux:
  stage: apptest
  tags: [little-thing]
  when: manual
  allow_failure: true
  resource_group: little-thing-gui
  # r18d8: GitLab `timeout:` is static per job. The full tier (APPCI_TIER=full: candidate/release) of app-test-linux-wayland runs both modes
  # (terminal alone ~75 min, soak 2 x ~70 min) plus the xwayland pass and was killed at 90 min; 4h fits it. The fix tier (smoke) is not
  # lengthened: it ends by itself in well under 90 min, so the larger limit only matters for a hung job.
  timeout: 6h   # r18u23: app-test-linux-wayland ran both modes plus both soaks and was killed at 4h with no artifacts uploaded (404); run.py's deadline still stops it early
  variables:
    GIT_DEPTH: "1"
  artifacts:
    name: appci-$CI_JOB_NAME
    # r18d8: always, so a job killed at the timeout or cancelled still uploads every finished row (results.json/summary.md/junit.xml are
    # rewritten after every case) and the shots/logs of finished cases
    when: always
    expire_in: 7 days
    paths:
      - appci-out/*/run/results.json
      - appci-out/*/run/summary.md
      - appci-out/*/run/junit.xml
      - appci-out/*/run_slim/shots/
      - appci-out/*/run_slim/logs/
      - appci-out/*/session.log
      - appci-out/*/results.jsonl
      - appci-out/*/run/results.jsonl
      - appci-out/*/run/soak_samples.csv
      - appci-out/reused_build.json
    reports:
      junit: appci-out/*/run/junit.xml

# APPCI_TIER (play-time variable from ci_seq.py): smoke = the input-path subset (appci/cases.py SMOKE, ONE list for Linux, macOS and Windows; a case a
# platform / Windows pane shell cannot run is reported as a SKIP with its reason), wayland only on Linux; full or empty = every case, as before.
# Headless sway on the box GPU (Intel UHD 630, /dev/dri/renderD128; pixman fallback), native Wayland client; then the
# same build once more under XWayland for X11 parity (reduced case set).
app-test-linux-wayland:
  extends: .appci_linux
  needs:
    - job: build-linux-x86_64
      artifacts: false
  before_script:
    - script/ci/fetch_build.sh --this-pipeline
  script:
    - rc=0
    - script/realapp/linux/wayland_session.sh --mode wayland --dist dist --out "$CI_PROJECT_DIR/appci-out/wayland" || rc=$?
    - 'if [ "${APPCI_TIER:-}" = smoke ]; then echo "APPCI_TIER=smoke: skipping the xwayland pass"; exit $rc; fi'
    - script/realapp/linux/wayland_session.sh --mode xwayland --dist dist --out "$CI_PROJECT_DIR/appci-out/xwayland" --cases fast_typing,paste_instant_enter,tab_enter,ctrl_c_d,latency_enter || { r=$?; [ $r -gt $rc ] && rc=$r; }
    - exit $rc
  after_script:
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/wayland" "$CI_PROJECT_DIR/appci-out/xwayland"
    - python3 script/ci/results_scrub.py --tree appci-out   # #1516: job artifacts are scrubbed too, not just the committed copy
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done   # r18u8: full shots hit 413 Payload Too Large

# Private Xvfb (software GL), xdotool: the original X11 path.
app-test-linux-x11:
  extends: .appci_linux
  allow_failure:
    exit_codes: 77   # 77 = skipped by tier: shown as failed-but-allowed, never as a success that tested nothing
  needs:
    - job: build-linux-x86_64
      artifacts: false
  before_script:
    - script/ci/fetch_build.sh --this-pipeline
  script:
    - 'if [ "${APPCI_TIER:-}" = smoke ]; then echo "APPCI_TIER=smoke: the x11 pass is not part of the fix tier; SKIPPED BY TIER, nothing was tested"; exit 77; fi'
    - script/realapp/linux/wayland_session.sh --mode x11 --dist dist --out "$CI_PROJECT_DIR/appci-out/x11"
  after_script:
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/x11"
    - python3 script/ci/results_scrub.py --tree appci-out   # #1516: job artifacts are scrubbed too, not just the committed copy
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done   # r18u8: full shots hit 413 Payload Too Large

# Mac runner. Needs a GUI (Aqua) session for gitrunner plus Accessibility + Screen Recording for the job's process
# chain; the script probes that first and fails with exit 3 and the list of grants for the owner.
app-test-macos:
  stage: apptest
  tags: [Mac]
  when: manual
  allow_failure: true
  resource_group: mac-gui
  timeout: 4h   # r18e0: the full tier (both modes, soak) was killed at 90m with ~47 cases unrun; run.py also stops itself early (appci/deadline.py, CI_JOB_TIMEOUT)
  needs:
    - job: build-macos-arm64
      artifacts: false
  before_script:
    - script/ci/fetch_build.sh --this-pipeline
  script:
    - script/realapp/mac/ci/app_test.sh dist "$CI_PROJECT_DIR/appci-out/macos"
  after_script:
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/macos"
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; python3 script/ci/results_scrub.py --tree appci-out   # #1516
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; python3 script/ci/slim_appci_run.py appci-out/macos/run   # r18u8: 413 Payload Too Large
  artifacts:
    name: appci-macos
    when: always
    expire_in: 7 days
    paths:
      - appci-out/macos/run/results.json
      - appci-out/macos/run/summary.md
      - appci-out/macos/run/junit.xml
      - appci-out/macos/run_slim/shots/
      - appci-out/macos/run_slim/logs/
      - appci-out/macos/NEEDS_OWNER.txt
      - appci-out/reused_build.json
    reports:
      junit: appci-out/macos/run/junit.xml

# Windows VM: the runner is on the console desktop, so the script drives the app directly (SendInput via the Python harness + screenshots),
# side-by-side install, backup/restore of app data, uninstall key, PATH, shortcuts and phosphor:// handler (md5-verified).
app-test-windows:
  extends: .windows_job
  stage: apptest
  when: manual
  allow_failure: true
  resource_group: windows-gui
  timeout: 8h   # r18u19: 4h ran out with 152 Windows agent-mode cases unrun (the Windows pass covers PowerShell + Git Bash in both modes); r18e0: the full tier (both modes, soak) was killed at 90m with ~47 cases unrun; run.py also stops itself early (appci/deadline.py, CI_JOB_TIMEOUT)
  needs:
    - job: build-windows-x86_64
      artifacts: false
  before_script:
    - !reference [.windows_job, before_script]
    - .\script\ci\parse_ps1.ps1   # #1507: 5.1 parse gate first
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - .\script\ci\fetch_build.ps1 -ThisPipeline
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
  script:
    - .\script\realapp\windows\ci\app_test.ps1 -Dist dist -Out appci-out\windows
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
  after_script:
    - .\script\realapp\windows\ci\after_job.ps1 -Out appci-out\windows
    - '$py = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"; if (Test-Path $py) { & $py script\ci\results_scrub.py --tree appci-out } else { Write-Host "results_scrub: VM python missing; artifacts NOT scrubbed" }'   # #1516
    - '$py = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"; if (Test-Path $py) { & $py script\ci\slim_appci_run.py appci-out\windows\run } else { Write-Host "slim: VM python missing; artifacts NOT slimmed" }'   # r18u8: 413 Payload Too Large
  artifacts:
    name: appci-windows
    when: always
    expire_in: 7 days
    paths:
      - appci-out/windows/run/results.json
      - appci-out/windows/run/summary.md
      - appci-out/windows/run/junit.xml
      - appci-out/windows/run_slim/shots/
      - appci-out/windows/run_slim/logs/
      - appci-out/windows/run/inject.log
      - appci-out/windows/install.log
      - appci-out/reused_build.json
    reports:
      junit: appci-out/windows/run/junit.xml

# ---------------------------------------------------------------------------
# Fake ssh lab (docs/testing.md 2.15, Wave 0.5b). A podman container on the box that is a fake REMOTE (two sshds, a user per shell, scenario users, a tc/netem
# fault shaper, an HTTP control port). EVERYTHING here is manual: the image is built by `sshlab-image` (play it after a change under script/realapp/sshlab/**),
# the cases run in their own jobs, never in the ordinary app-test jobs. The Mac and Windows runners reach PERSISTENT lab containers on the box (one per
# platform, fixed ports, `labctl.py serve`, a systemd --user service installed by sshlab-image) over HTTP with the protected+masked project variables
# SSHLAB_BOX and SSHLAB_TOKEN (never in the repo, never echoed). APPCI_LAB_MATRIX (quick | full | spec) is a play-time variable.
# ---------------------------------------------------------------------------
sshlab-image:
  tags: [little-thing]
  stage: apptest
  needs: []
  resource_group: little-thing-sshlab
  timeout: 1h
  variables:
    GIT_DEPTH: "1"
  rules:
    - when: manual          # manual only: a `changes` rule runs on every new branch, where there is nothing to compare with
      allow_failure: true
  script:
    # build refuses a versions.env that still has PLACEHOLDER pins; selftest asserts zero lab containers are left afterwards
    - python3 script/realapp/sshlab/labctl.py build
    - python3 script/realapp/sshlab/labctl.py selftest
    - mkdir -p "$HOME/.phosphor-sshlab"
    - install -m 755 script/realapp/sshlab/labctl.py "$HOME/.phosphor-sshlab/labctl.py"
    # the fixed-port slots (docs/testing.md 2.15): refresh the user service, then reconcile once so the slots run the image just built. The token file
    # ~/.phosphor-sshlab/token (mode 600) is machine-local and is only checked for existence here, never read into the log.
    - mkdir -p "$HOME/.config/systemd/user"
    - install -m 644 script/realapp/sshlab/sshlab-serve.service "$HOME/.config/systemd/user/sshlab-serve.service"
    - test -f "$HOME/.phosphor-sshlab/token" || { echo "no ~/.phosphor-sshlab/token on this machine (see script/realapp/sshlab/README.md); the slots are not started"; exit 1; }
    - python3 "$HOME/.phosphor-sshlab/labctl.py" serve --once
    - systemctl --user daemon-reload && systemctl --user enable --now sshlab-serve && systemctl --user restart sshlab-serve
  after_script:
    - python3 script/realapp/sshlab/labctl.py gc || true

# The lab's `phosphor-remote` helper (owner decision 2026-11-10; docs/design/r12-policy.md 3, docs/testing.md 2.15 "The lab helper"). A static musl build of
# the helper, built ONCE per set of helper inputs and kept in the runner user's machine-local cache ($HOME/.cache/phosphor-ci/helper/<key>/, next to
# cache_build.sh's builds); NOT built in the dev build jobs. MANUAL: play it once on a ref; it is a no-op (seconds) when this checkout's key is already
# cached, so playing it again costs nothing. The lab's helper arms read the cache (script/ci/lab_helper.py path; APPCI_LAB_HELPER_BIN still overrides) and
# are UNVERIFIABLE with the reason while it is empty. The key covers the tag (v<app version>-dev, what the dev builds name the helper after), the helper's own
# crates (crates/remote_server, crates/command, lib/notify; proven complete with cargo tree before each build), Cargo.toml, Cargo.lock, rust-toolchain.toml
# and .cargo/config.toml, so a commit that touches none of them reuses the entry. This job installs nothing: the musl
# rust target, zig and cargo-zigbuild must already be there (what cli-linux leaves in the runner user's home), else it fails naming the one missing.
# helper-artifacts/ is also uploaded (30 days) so the same file can be carried to a Mac or Windows runner by hand.
lab-helper:
  tags: [little-thing]
  stage: apptest
  needs: []
  when: manual
  allow_failure: true
  resource_group: little-thing-cargo
  timeout: 2h
  variables:
    GIT_DEPTH: "1"
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    CARGO_BUILD_JOBS: "8"
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - python3 script/ci/lab_helper.py --self-test
    - python3 script/ci/lab_helper.py build
  artifacts:
    name: lab-helper
    paths: [helper-artifacts/]
    expire_in: 30 days

app-test-lab-linux:
  extends: .appci_linux
  needs:
    - job: build-linux-x86_64
      artifacts: false
  variables:
    GIT_DEPTH: "1"
    APPCI_LAB: local
    APPCI_CASES: "lab_*"
    # CI's dev build is a bundled build with no pinned helper digest (see "Build jobs" above): it refuses every helper upload by design, so the upload /
    # upgrade / never arms are UNVERIFIABLE here, with that reason, instead of a certain failure (or a vacuous pass for `never`). The pre-installed
    # `helper` arms do run. Remove this line when the dev build pins the lab helper's digest (docs/design/r12-policy.md 3, open decision).
    APPCI_APP_PINNED_DIGESTS: "0"
  before_script:
    - script/ci/fetch_build.sh --this-pipeline
    # say in the job log which helper the helper arms will use (cases_lab.resolve_helper_bin reads the same cache); a miss is not an error here
    - python3 script/ci/lab_helper.py path || echo "lab helper not cached - the helper arms will be UNVERIFIABLE (play lab-helper)"
  script:
    - script/realapp/linux/wayland_session.sh --mode wayland --dist dist --out "$CI_PROJECT_DIR/appci-out/wayland"
  after_script:
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/wayland"
    - python3 script/ci/results_scrub.py --tree appci-out
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done

# SSHLAB_BOX and SSHLAB_TOKEN are protected project variables: GitLab injects them into jobs on protected refs (main, build/*, v*) automatically, so they are
# NOT re-mapped here (re-mapping would put the token into the job's variable list/expansion). lab.py reads them from the environment through ci_env.get,
# prints only whether they are set, and a job on an unprotected ref SKIPs the lab cases with that reason. No `set -x` anywhere near them.
app-test-lab-macos:
  extends: app-test-macos
  resource_group: mac-gui
  variables:
    APPCI_LAB: fixed
    APPCI_LAB_SLOT: mac
    APPCI_CASES: "lab_*"

app-test-lab-windows:
  extends: app-test-windows
  resource_group: windows-gui
  variables:
    APPCI_LAB: fixed
    APPCI_LAB_SLOT: windows
    APPCI_CASES: "lab_*"

# Real-use replay (Wave 1.5 #3, docs/testing.md "Real-use replay"): a seeded "day of use" in one long case per session mode, against the fake ssh lab at
# 150 ms and the scripted fake model. MANUAL ONLY and never part of a ci_seq.py tier (no schedule, owner): play it by hand, or from the nightly routine the
# owner starts. Length: APPCI_REPLAY_MINUTES (default 15; the nightly plays it with 60). Skips with its reason when the lab or the fake model is unavailable.
app-test-replay-linux:
  extends: app-test-lab-linux
  variables:
    APPCI_CASES: "lab_replay*"
    APPCI_FAKE_MODEL: "1"
    APPCI_LAB_MATRIX: "quick"
    APPCI_REPLAY_MINUTES: "15"

# ---------------------------------------------------------------------------
# Reuse variants (app-test-*-reuse): test an EARLIER pipeline's build of an app-identical commit instead of rebuilding
# (script/ci/ci_seq.py decides; fix tier only). They have NO `needs` on the build job: `needs:pipeline:job` takes a
# pipeline id fixed when the pipeline is created, not at play time, so the artifact is fetched in the job through the
# jobs API with CI_JOB_TOKEN (script/ci/fetch_build.{sh,ps1}). Required play-time variable APPCI_BUILD_JOB_ID; the job
# fails loudly without it or when the fetch fails (expired artifacts, 403), and records the tested build in results.json.
# ---------------------------------------------------------------------------
# Re-upload an app-test run that already finished but whose artifacts were rejected (r18u8: 413 Payload
# Too Large). GIT_STRATEGY none: no fetch, no clean, so the previous job's appci-out is still there.
# Manual, play it on the SAME runner right after the failed upload, before any other job checks out.
.collect_run:
  stage: apptest
  needs: []   # independent of the pipeline's builds: it only uploads what is already on disk
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  timeout: 30m
collect-macos-run:
  extends: .collect_run
  tags: [Mac]
  resource_group: mac-gui
  script:
    # The checkout is the PREVIOUS job's commit, which may predate the script: fetch it for this commit (public repo).
    - curl -fsSL "https://gitlab.com/winters-phosphor/phosphor/-/raw/$CI_COMMIT_SHA/script/ci/slim_appci_run.py" -o slim_appci_run.py
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; ls -d appci-out/macos/run && python3 slim_appci_run.py appci-out/macos/run
  artifacts:
    name: appci-macos-collected
    when: always
    expire_in: 7 days
    paths:
      - appci-out/macos/run_slim/
collect-windows-run:
  extends: [.windows_job, .collect_run]
  resource_group: windows-gui
  script:
    - 'Invoke-WebRequest -UseBasicParsing -Uri "https://gitlab.com/winters-phosphor/phosphor/-/raw/$env:CI_COMMIT_SHA/script/ci/slim_appci_run.py" -OutFile slim_appci_run.py'
    - '$py = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"; & $py slim_appci_run.py appci-out\windows\run'
  artifacts:
    name: appci-windows-collected
    when: always
    expire_in: 7 days
    paths:
      - appci-out/windows/run_slim/

app-test-linux-wayland-reuse:
  extends: app-test-linux-wayland
  needs: []
  before_script:
    - script/ci/fetch_build.sh
  after_script:
    - python3 script/ci/record_reuse.py
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/wayland" "$CI_PROJECT_DIR/appci-out/xwayland"
    - python3 script/ci/results_scrub.py --tree appci-out   # #1516: job artifacts are scrubbed too, not just the committed copy
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done   # r18u8: full shots hit 413 Payload Too Large

app-test-linux-x11-reuse:
  extends: app-test-linux-x11
  needs: []
  before_script:
    - script/ci/fetch_build.sh
  after_script:
    - python3 script/ci/record_reuse.py
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/x11"
    - python3 script/ci/results_scrub.py --tree appci-out   # #1516: job artifacts are scrubbed too, not just the committed copy
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done   # r18u8: full shots hit 413 Payload Too Large

# the fix tier's PROVING lab cases on a reused Linux build (script/ci/ci_seq.py LAB_FIX_JOB; owner rule 2026-11-09)
app-test-lab-linux-reuse:
  extends: app-test-lab-linux
  needs: []
  before_script:
    - script/ci/fetch_build.sh
  after_script:
    - python3 script/ci/record_reuse.py
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/wayland"
    - python3 script/ci/results_scrub.py --tree appci-out
    - for d in appci-out/*/run; do [ -d "$d" ] && python3 script/ci/slim_appci_run.py "$d"; done

app-test-macos-reuse:
  extends: app-test-macos
  needs: []
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - script/ci/fetch_build.sh
  after_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; python3 script/ci/record_reuse.py
    - script/realapp/teardown.sh "$CI_PROJECT_DIR/appci-out/macos"
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; python3 script/ci/results_scrub.py --tree appci-out   # #1516
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; python3 script/ci/slim_appci_run.py appci-out/macos/run   # r18u8: 413 Payload Too Large

app-test-windows-reuse:
  extends: app-test-windows
  needs: []
  before_script:
    - !reference [.windows_job, before_script]
    - .\script\ci\parse_ps1.ps1   # #1507: 5.1 parse gate first
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - .\script\ci\fetch_build.ps1
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
  after_script:
    - .\script\ci\fetch_build.ps1 -Record
    - .\script\realapp\windows\ci\after_job.ps1 -Out appci-out\windows
    - '$py = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"; if (Test-Path $py) { & $py script\ci\results_scrub.py --tree appci-out } else { Write-Host "results_scrub: VM python missing; artifacts NOT scrubbed" }'   # #1516
    - '$py = Join-Path $env:LOCALAPPDATA "phosphor-ci\python312\python.exe"; if (Test-Path $py) { & $py script\ci\slim_appci_run.py appci-out\windows\run } else { Write-Host "slim: VM python missing; artifacts NOT slimmed" }'   # r18u8: 413 Payload Too Large

# ===========================================================================
# Release pipeline (ported from .github/workflows/phosphor_release.yml).
#
#   release-meta -> cli-linux / cli-macos -> release-macos-arm64 /
#   release-linux-x86_64 / release-windows-x86_64 -> release-publish
#
# Runs automatically for a pushed `v*` TAG and as a manual dry run on main (version
# `dev-<pipeline iid>`; nothing is published as a GitLab release in that case). The
# tag must be PROTECTED for the Mac jobs to run: the Mac runner is ref_protected.
#
# Why the order: the client pins the SHA-256 of every published CLI tarball at
# COMPILE time (remote_server::setup::expected_sha256, via option_env!), and the
# remote-server install script verifies against it. So both CLI tarballs must exist
# before either GUI client is built, and the digests are computed from the exact bytes
# that get published, never from a rebuild (the build is not bit-reproducible).
#
# Scope today: Linux x86_64, macOS arm64 and Windows x86_64 (installer only; the remote
# server CLI is never installed ON Windows). No macOS Intel (digest left unset: an
# install onto an Intel host fails closed), no Linux aarch64 (same), and no
# rpm/Arch packages (rpmbuild and docker are not installed on the build box).
#
# Big files go to the GENERIC PACKAGE REGISTRY (script/ci/upload_package), not job
# artifacts, and the release links point there. External-URL release links would show
# GitLab's "you are being redirected" interstitial and break `curl -L` in the remote
# server install script; package-registry links redirect directly.
#
# Known gap: GitLab has no prerelease flag, so a beta release can become
# `releases/permalink/latest`, which the app falls back to when it has no version tag.
# ===========================================================================

# The jobs that define release quality (#1495). A tag pipeline publishes nothing unless EVERY one of these succeeded: release-meta
# (the root of the release DAG, so nothing is built or uploaded to the package registry before) and release-publish (the only job that
# creates the GitLab release) both `needs:` this list. They run automatically in a tag pipeline (the box jobs, .heavy_rules) and none is
# allow_failure there. The YAML anchor keeps the two lists from drifting apart.
.release_quality_needs: &release_quality_needs
  - release-gate
  - guards
  - check-linux
  - licenses
  - advisories
  - test-linux
  - test-warpui-core
  - test-workspace-rest

# Recorded release-tier evidence (#1495). The remaining release-tier suites (integration, usage, input-timers-strict, shuttle/loom, fuzz,
# the Mac and Windows unit/heavy suites) and the real-app tests need the build pipeline, the Mac / Windows machines and resource groups and are
# manual by design (driven by script/ci/ci_seq.py --tier release), so they are NOT run inside the tag pipeline. This job refuses the tag
# unless the SAME COMMIT has them all green in GitLab, the app tests with a results.json that says tier=release and this sha. The job list is
# ci_seq.py's own release tier (script/ci/check_release_gate.py). KNOWN GAP: the app tests ran on `build-*` binaries, not the `release-*`
# ones built below (those have the CLI digests compiled in). docs/testing.md "Release gate".
release-gate:
  extends: .shim_github_env
  stage: test
  tags: [little-thing]
  needs: [guards, check-linux, licenses, advisories]
  timeout: 10m
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
  script:
    - command -v python3 >/dev/null || { echo "ERROR python3 missing on this runner; the release gate cannot run" >&2; exit 1; }
    - python3 script/ci/check_release_gate.py

.release_rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

.release_box:
  extends: [.box_job, .release_rules]
  needs: [release-meta]
  variables:
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
    PHOSPHOR_TARGET_ROOT: /home/gitlab-runner/.phosphor-build/targets
    PHOSPHOR_LOCK_DIR: /home/gitlab-runner/.phosphor-build/locks
    PHOSPHOR_LOG_DIR: /home/gitlab-runner/.phosphor-build/logs
    CARGO_BUILD_JOBS: "8"
    GIT_DEPTH: "0"

release-meta:
  extends: [.shim_github_env]
  stage: cli
  tags: [little-thing]
  needs: []
  # RELEASE GATE (#1495): the root of the release DAG; in a tag pipeline nothing starts until the whole quality set is green.
  # `rules:needs` replaces the job-level `needs: []` for the tag only; the manual dry run on main keeps its old shape.
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
      needs: *release_quality_needs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  timeout: 20m
  variables:
    GIT_DEPTH: "0"
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$PATH"
    - |
      set -euo pipefail
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG="$CI_COMMIT_TAG"
        # The tag must match app/Cargo.toml's version (optionally with a -suffix), unless it
        # is a legacy dated tag (v2026....).
        CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -n1)
        [ -n "$CARGO_VERSION" ] || { echo "ERROR could not read the version from app/Cargo.toml" >&2; exit 1; }
        if [[ "$TAG" =~ ^v[0-9]{4}\. ]]; then
          echo "legacy dated tag $TAG; skipping the Cargo version check"
        elif [[ "$TAG" == "v${CARGO_VERSION}" ]] || [[ "$TAG" =~ ^v${CARGO_VERSION//./\\.}-[0-9A-Za-z.]+$ ]]; then
          echo "tag $TAG matches app/Cargo.toml version $CARGO_VERSION"
        else
          echo "ERROR tag '$TAG' does not match app/Cargo.toml version 'v${CARGO_VERSION}' (optionally with a -suffix). Bump the version or fix the tag." >&2
          exit 1
        fi
        PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD^ 2>/dev/null || echo "")
      else
        TAG="v0.$(date -u +%Y.%m.%d.%H%M)"
        PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD 2>/dev/null || echo "")
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then VERSION="$TAG"; else VERSION="dev-${CI_PIPELINE_IID}"; fi
      if [[ "$TAG" =~ [Bb][Ee][Tt][Aa] ]]; then CHANNEL=beta; else CHANNEL=oss; fi
      # Channel settings (release name, body text, prerelease flag) live in release_configurations.json.
      CFG=$(jq -c --arg c "$CHANNEL" '.channels[] | select(.channel == $c)' .gitlab/release_configurations.json)
      [ -n "$CFG" ] || { echo "ERROR no channel '$CHANNEL' in release_configurations.json" >&2; exit 1; }
      BASE_NAME=$(jq -r .release_base_name <<<"$CFG")
      BODY_TEXT=$(jq -r .release_body_text <<<"$CFG")
      IS_PRERELEASE=$(jq -r .is_prerelease <<<"$CFG")
      # Release notes via git-cliff and the repo's cliff.toml.
      ./script/install_cargo_binstall
      command -v git-cliff >/dev/null || cargo binstall --no-confirm git-cliff
      CLIFF_ARGS=(--config cliff.toml --strip header --tag "$TAG")
      [ -n "$PREV" ] && CLIFF_ARGS+=("${PREV}..HEAD")
      git-cliff "${CLIFF_ARGS[@]}" > release-notes.md
      {
        echo "$BODY_TEXT"; echo
        if [ -n "$PREV" ]; then echo "## Changes since \`$PREV\`"; else echo "## Initial release changes"; fi
        echo; cat release-notes.md
      } > release-body.md
      # GitLab limits a release description; keep well under it.
      if [ "$(wc -c < release-body.md)" -gt 120000 ]; then
        head -c 120000 release-body.md | head -n -1 > release-body.trimmed.md
        { echo; echo "---"; echo "_Release notes truncated._"; if [ -n "$PREV" ]; then echo "[Full changelog: \`$PREV...$TAG\`](${CI_PROJECT_URL}/-/compare/${PREV}...${TAG})"; fi; } >> release-body.trimmed.md
        mv release-body.trimmed.md release-body.md
      fi
      {
        echo "RELEASE_TAG=$TAG"
        echo "RELEASE_VERSION=$VERSION"
        echo "CHANNEL=$CHANNEL"
        echo "IS_PRERELEASE=$IS_PRERELEASE"
        echo "RELEASE_NAME=$BASE_NAME $TAG"
      } > meta.env
      cat meta.env
  artifacts:
    reports:
      dotenv: meta.env
    paths: [release-body.md]
    expire_in: 7 days

# #1157 part 2: size and request latency of the ssh remote-server binary, release-cli (opt-level "s", musl malloc) against release-remote (opt-level 3,
# mimalloc), measured by script/ci/remote_server_bench.py. MANUAL only (two LTO builds), on the build box; it installs nothing (zig, cargo-zigbuild and the musl
# target are what the cli-linux job leaves in the runner's home). The numbers are the artifact `bench-out/remote-bench.json`.
bench-remote-server:
  extends: .box_job
  needs: []
  rules:
    - when: manual
      allow_failure: true
  timeout: 5h
  variables:
    CARGO_BUILD_JOBS: "8"
    REMOTE_BENCH_N: "300"
  script:
    - ./script/ci/remote_server_before_after bench-out
  artifacts:
    name: remote-server-bench
    when: always
    expire_in: 30 days
    paths:
      - bench-out/remote-bench.json
      - bench-out/before/phosphor-cli.tar.gz
      - bench-out/after/phosphor-cli.tar.gz

# CLI + remote-server + TUI tarballs for Linux x86_64: a static musl build through
# zig, so the artifact has no glibc floor and runs on any Linux x86_64 host (CentOS 7,
# Alpine, ...). zig and cargo-zigbuild install into the runner user's home only. The musl
# rust target must already exist in the shared rustup (one-time, by hand).
cli-linux:
  extends: .release_box
  stage: cli
  timeout: 4h
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - rustup target list --installed | grep -qx x86_64-unknown-linux-musl || { echo "ERROR the x86_64-unknown-linux-musl rust target is not installed; run 'rustup target add x86_64-unknown-linux-musl' once as the toolchain owner (not done automatically on the build box)" >&2; exit 1; }
    - ./script/install_cargo_release_deps --no-build-deps
    - |
      set -euo pipefail
      ZIG_VERSION="0.13.0"
      ZIG_DIR="$HOME/.local/zig-${ZIG_VERSION}"
      if [ ! -x "${ZIG_DIR}/zig" ]; then
        mkdir -p "${ZIG_DIR}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ -C "${ZIG_DIR}" --strip-components=1
      fi
      export PATH="${ZIG_DIR}:$PATH"
      command -v cargo-zigbuild >/dev/null || cargo binstall --no-confirm "cargo-zigbuild@^0.19"
      # The box has glibc dev packages (libbz2, liblzma, freetype) that the GitHub
      # runner never had; pkg-config would hand their glibc static libs to the musl
      # link (undefined __fprintf_chk). An empty search dir for the musl target makes
      # every probe miss, so the -sys crates build their bundled sources with zig.
      mkdir -p "$CI_PROJECT_DIR/.musl-pkgconfig-empty"
      export PKG_CONFIG_LIBDIR_x86_64_unknown_linux_musl="$CI_PROJECT_DIR/.musl-pkgconfig-empty" PKG_CONFIG_PATH_x86_64_unknown_linux_musl=""
      export USE_ZIGBUILD=true PKG_CONFIG_ALLOW_CROSS=1 GIT_RELEASE_TAG="$RELEASE_TAG"
      script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --packages none --target x86_64-unknown-linux-musl
      EXE=$(grep '^executable_path=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      RES=$(grep '^bundled_resources_dir=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      mkdir -p cli-artifacts out
      cp "$EXE" out/phosphor-oss
      tar czf cli-artifacts/phosphor-cli-linux-x86_64.tar.gz -C out phosphor-oss -C "$(cd "$(dirname "$RES")" && pwd)" resources
      # warp_tui reuses the toolchain and profile already warmed above.
      cargo zigbuild -p warp_tui --profile release-cli --target x86_64-unknown-linux-musl --bin zap-tui-oss
      cp target/x86_64-unknown-linux-musl/release-cli/zap-tui-oss out/phosphor-tui
      tar czf out/phosphor-tui-linux-x86_64.tar.gz -C out phosphor-tui
      ./script/ci/upload_package "$RELEASE_VERSION" cli-artifacts/phosphor-cli-linux-x86_64.tar.gz out/phosphor-tui-linux-x86_64.tar.gz
      (cd cli-artifacts && sha256sum phosphor-cli-linux-x86_64.tar.gz > manifest-cli-linux.txt)
      (cd out && sha256sum phosphor-tui-linux-x86_64.tar.gz >> ../cli-artifacts/manifest-cli-linux.txt)
  artifacts:
    paths: [cli-artifacts/, out/phosphor-tui-linux-x86_64.tar.gz]
    expire_in: 3 days

# The bundled ssh helper `phosphor-remote` (Wave H, #1804): a small warpui-free daemon the app
# uploads in-band to ssh hosts. Built here for Linux x86_64 and aarch64 as static musl binaries
# (same zig toolchain as cli-linux), gzip -9 compressed, with the SHA-256 of each DECOMPRESSED
# binary in a .sha256 file. The GUI build jobs pin those digests into the client
# (.pin_helper_digests) and script/bundle copies the .gz files into the app's
# bundled_resources/remote/. Nothing is downloaded by an installed app. WRITTEN, NOT RUN: the
# first run on the box is the first compile of the helper, so expect to fix the target
# installation and size numbers it reports.
#   * size gate: each helper must stay under 20 MB (the design target is 4-8 MB); the full app
#     binary it replaces for ssh installs was about 273 MB;
#   * dependency gate: script/check_remote_helper_deps (also run by guards-helper-deps) fails
#     if warpui or ai is in the helper's dependency tree.
build-remote-helper:
  extends: .release_box
  stage: cli
  timeout: 2h
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - |
      for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
        rustup target list --installed | grep -qx "$t" || { echo "ERROR the $t rust target is not installed; run 'rustup target add $t' once as the toolchain owner (not done automatically on the build box)" >&2; exit 1; }
      done
    - ./script/install_cargo_release_deps --no-build-deps
    - ./script/check_remote_helper_deps
    - |
      set -euo pipefail
      ZIG_VERSION="0.13.0"
      ZIG_DIR="$HOME/.local/zig-${ZIG_VERSION}"
      if [ ! -x "${ZIG_DIR}/zig" ]; then
        mkdir -p "${ZIG_DIR}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ -C "${ZIG_DIR}" --strip-components=1
      fi
      export PATH="${ZIG_DIR}:$PATH"
      command -v cargo-zigbuild >/dev/null || cargo binstall --no-confirm "cargo-zigbuild@^0.19"
      export GIT_RELEASE_TAG="$RELEASE_TAG" PHOSPHOR_REMOTE_BUILD_ID="$CI_COMMIT_SHORT_SHA"
      mkdir -p helper-artifacts
      MAX_BYTES=$((20 * 1024 * 1024))
      for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
        ARCH="${TARGET%%-*}"
        cargo zigbuild -p remote_server --profile release-remote-helper --no-default-features --features daemon --target "$TARGET" --bin phosphor-remote
        BIN="target/$TARGET/release-remote-helper/phosphor-remote"
        [ -f "$BIN" ] || { echo "ERROR no helper at $BIN (is CARGO_TARGET_DIR set?)" >&2; exit 1; }
        SIZE=$(stat -c %s "$BIN")
        echo "phosphor-remote $ARCH: $SIZE bytes"
        [ "$SIZE" -lt "$MAX_BYTES" ] || { echo "ERROR phosphor-remote $ARCH is $SIZE bytes, over the $MAX_BYTES gate" >&2; exit 1; }
        sha256sum "$BIN" | cut -d' ' -f1 > "helper-artifacts/phosphor-remote-linux-$ARCH.sha256"
        gzip -9 -c "$BIN" > "helper-artifacts/phosphor-remote-linux-$ARCH.gz"
        ls -l "helper-artifacts/phosphor-remote-linux-$ARCH.gz"
      done
  artifacts:
    paths: [helper-artifacts/]
    expire_in: 3 days

# The helper's dependency gate on its own, so a change that drags warpui or ai into it fails in
# minutes instead of after a cross build. Needs cargo (metadata only; nothing is compiled).
guards-helper-deps:
  extends: .box_job
  stage: test
  timeout: 20m
  interruptible: true
  variables:
    RUSTUP_HOME: /home/winters/.rustup
    CARGO_HOME: /home/gitlab-runner/.cargo-ci
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - ./script/check_remote_helper_deps

cli-macos:
  extends: [.shim_github_env, .release_rules]
  stage: cli
  tags: [Mac]
  needs: [release-meta]
  timeout: 4h
  variables:
    CARGO_BUILD_JOBS: "4"
    GIT_DEPTH: "0"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
    - for t in cargo rustc protoc; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner" >&2; exit 1; }; done
    - ./script/install_cargo_release_deps --no-build-deps
    - |
      set -euo pipefail
      export GIT_RELEASE_TAG="$RELEASE_TAG"
      script/bundle --channel "$CHANNEL" --arch aarch64 --artifact cli --nosign
      BIN=$(grep '^binary_path=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      RES=$(grep '^bundled_resources_dir=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      mkdir -p cli-artifacts out
      cp "$BIN" out/phosphor-oss
      tar czf cli-artifacts/phosphor-cli-macos-aarch64.tar.gz -C out phosphor-oss -C "$(cd "$(dirname "$RES")" && pwd)" resources
      cargo build -p warp_tui --profile release-cli --target aarch64-apple-darwin --bin zap-tui-oss
      cp target/aarch64-apple-darwin/release-cli/zap-tui-oss out/phosphor-tui
      tar czf out/phosphor-tui-macos-aarch64.tar.gz -C out phosphor-tui
      ./script/ci/upload_package "$RELEASE_VERSION" cli-artifacts/phosphor-cli-macos-aarch64.tar.gz out/phosphor-tui-macos-aarch64.tar.gz
      (cd cli-artifacts && shasum -a 256 phosphor-cli-macos-aarch64.tar.gz > manifest-cli-macos.txt)
      (cd out && shasum -a 256 phosphor-tui-macos-aarch64.tar.gz >> ../cli-artifacts/manifest-cli-macos.txt)
  artifacts:
    paths: [cli-artifacts/, out/phosphor-tui-macos-aarch64.tar.gz]
    expire_in: 3 days

# Digest pinning shared by the GUI jobs. Sourced, not executed: it exports the
# PHOSPHOR_REMOTE_SHA256_* variables the client bakes in with option_env! (the SHA-256 of each
# DECOMPRESSED helper, from build-remote-helper) and PHOSPHOR_REMOTE_HELPER_DIR, which
# script/prepare_bundled_resources copies into the app bundle and re-checks against those
# digests. Unset on purpose: macOS helpers (not built; macOS is optional), so a macOS ssh host
# stays on the no-helper path.
.pin_helper_digests: &pin_helper_digests |
  pin() {
    local var="$1" file="helper-artifacts/$2.sha256"
    [ -f "$file" ] || { echo "ERROR missing helper digest $file; the client would compile with no pinned digest and refuse every helper install" >&2; return 1; }
    local digest
    digest=$(tr -d '[:space:]' < "$file")
    [ "${#digest}" = 64 ] || { echo "ERROR $file does not hold a SHA-256 digest" >&2; return 1; }
    export "$var=$digest"
    echo "$var=$digest"
  }
  pin PHOSPHOR_REMOTE_SHA256_LINUX_X86_64 phosphor-remote-linux-x86_64
  pin PHOSPHOR_REMOTE_SHA256_LINUX_AARCH64 phosphor-remote-linux-aarch64
  export PHOSPHOR_REMOTE_HELPER_DIR="$CI_PROJECT_DIR/helper-artifacts"

release-macos-arm64:
  extends: [.shim_github_env, .release_rules]
  stage: build
  tags: [Mac]
  needs: [release-meta, cli-linux, cli-macos, build-remote-helper]
  timeout: 4h
  variables:
    CARGO_BUILD_JOBS: "4"
    GIT_DEPTH: "0"
    # create-dmg's Finder AppleScript fails (-10810) here (the release job is not run from an Aqua login session), so skip it;
    # app-test-macos, unlike this job, DOES need an Aqua session.
    PHOSPHOR_DMG_SKIP_JENKINS: "1"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
    - for t in cargo rustc protoc hdiutil codesign lipo; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner" >&2; exit 1; }; done
    - xcrun -sdk macosx metal --version >/dev/null || { echo "ERROR the Metal toolchain is missing (xcodebuild -downloadComponent MetalToolchain)" >&2; exit 1; }
    - ./script/install_cargo_release_deps --no-build-deps
    - ./script/install_cargo_bundle
    - *pin_helper_digests
    # --selfsign = ad-hoc signing: gives the .app a cdhash (required before notifications register)
    # with hardened runtime and Debug-Entitlements, no Apple Developer certificate needed.
    # Users still see Gatekeeper's "unidentified developer" dialog on first open.
    # #1515: Developer ID signing + notarization run ONLY when the owner has provided every variable listed in
    # docs/release-signing.md (protected CI/CD variables, so only main/build/*/v* pipelines see them). Otherwise
    # this stays the ad-hoc --selfsign build above. Nothing is echoed; no `set -x`.
    - |
      set -euo pipefail
      SIGNED=0
      if [ -n "${PHOSPHOR_APPLE_TEAM_ID:-}" ] && [ -n "${PHOSPHOR_APPLE_SIGNING_IDENTITY:-}" ] && [ -n "${PHOSPHOR_DEVELOPER_ID_CERT:-}" ] \
         && [ -n "${PHOSPHOR_DEVELOPER_ID_CERT_PASSWORD:-}" ] && [ -n "${PHOSPHOR_CODESIGN_KEYCHAIN_PASSWORD:-}" ] \
         && { [ -n "${PHOSPHOR_NOTARY_PROFILE:-}" ] || { [ -n "${PHOSPHOR_NOTARIZATION_APPLE_ID:-}" ] && [ -n "${PHOSPHOR_NOTARIZATION_PASSWORD:-}" ]; }; }; then
        echo "Developer ID credentials present: signing and notarizing."
        SIGNED=1
        GIT_RELEASE_TAG="$RELEASE_TAG" script/bundle --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --read-passwords-from-env
      else
        echo "No Developer ID credentials configured: ad-hoc signed build (see docs/release-signing.md)."
        GIT_RELEASE_TAG="$RELEASE_TAG" script/bundle --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --selfsign
      fi
      echo "$SIGNED" > .signed
    - |
      set -euo pipefail
      DMG=$(grep '^dmg_path=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      [ -f "$DMG" ] || { echo "ERROR no DMG at '$DMG'" >&2; exit 1; }
      mkdir -p dist && cp "$DMG" dist/
      (cd dist && shasum -a 256 * > ../manifest-macos.txt)
      if [ "$(cat .signed)" = 1 ]; then
        # signed + notarized: a bad signature or a missing stapled ticket must fail the release
        PHOSPHOR_REQUIRE_SIGNED=1 script/ci/verify_artifacts.sh macos dist manifest-macos.txt
        xcrun stapler validate dist/*.dmg
      else
        script/ci/verify_artifacts.sh macos dist manifest-macos.txt   # #1515: verify BEFORE publishing
      fi
      ./script/ci/upload_package "$RELEASE_VERSION" dist/*
  after_script:
    # the throwaway signing keychain (only exists when Developer ID signing ran); runs on cancel too
    - security delete-keychain phosphor-codesign-keychain >/dev/null 2>&1 || true
  artifacts:
    # dist/ is here so a dry run (which does not upload) still yields the installer, as a
    # member-only job artifact.
    paths: [manifest-macos.txt, dist/]
    expire_in: 3 days

release-linux-x86_64:
  extends: .release_box
  stage: build
  needs: [release-meta, cli-linux, cli-macos, build-remote-helper]
  timeout: 5h
  variables:
    APPIMAGE_EXTRACT_AND_RUN: "1"
  script:
    - export PATH="$CARGO_HOME/bin:/home/winters/.cargo/bin:$HOME/.local/bin:$PATH"
    - rustup target list --installed | grep -qx x86_64-unknown-linux-gnu || { echo "ERROR target x86_64-unknown-linux-gnu is not installed on this runner" >&2; exit 1; }
    - for t in cargo protoc cmake pkg-config dpkg-deb fakeroot strip; do command -v $t >/dev/null || { echo "ERROR $t is missing on this runner" >&2; exit 1; }; done
    - ./script/install_cargo_release_deps --no-build-deps
    - ./script/linux/install_linuxdeploy
    - *pin_helper_digests
    - GIT_RELEASE_TAG="$RELEASE_TAG" script/bundle --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
    - |
      set -euo pipefail
      PKG=$(grep '^packages_dir=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
      [ -d "$PKG" ] || { echo "ERROR no packages dir at '$PKG'" >&2; exit 1; }
      # Launch what is about to ship: proves it loads and reaches argument parsing (a mold
      # relocation bug once shipped binaries that aborted in ld.so before main).
      APPIMAGE=$(ls "$PKG"/*.AppImage 2>/dev/null | head -1)
      [ -n "$APPIMAGE" ] || { echo "ERROR no AppImage in $PKG" >&2; exit 1; }
      chmod +x "$APPIMAGE" && "$APPIMAGE" --appimage-extract-and-run --version
      # dpkg-deb names files after the internal package name ("zap"); rename to match.
      mkdir -p dist
      for f in "$PKG"/*; do
        b=$(basename "$f"); cp "$f" "dist/$(echo "$b" | sed -E 's/^zap([_-])/phosphor\1/')"
      done
      (cd dist && sha256sum * > ../manifest-linux.txt)
      script/ci/verify_artifacts.sh linux dist manifest-linux.txt   # #1515: verify BEFORE publishing
      ./script/ci/upload_package "$RELEASE_VERSION" dist/*
  artifacts:
    paths: [manifest-linux.txt, dist/]
    expire_in: 3 days

# Windows x86_64 installer (Inno Setup, unsigned) on the `windows` runner. Same pins as the
# other GUI builds, read from the build-remote-helper artifacts. The package-registry upload
# goes through Git for Windows' bash so it shares script/ci/upload_package (and its
# tag-only guard) with the other jobs.
release-windows-x86_64:
  extends: [.windows_job, .release_rules]
  stage: build
  needs: [release-meta, cli-linux, cli-macos, build-remote-helper]
  timeout: 5h
  variables:
    CARGO_BUILD_JOBS: "8"
    GIT_DEPTH: "0"
  script:
    - foreach ($t in "cargo","rustc","perl","cmake","ISCC") { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Error "$t is missing on this runner"; exit 1 } }
    - if (-not (Test-Path "$env:PROTOC")) { Write-Error "PROTOC is not set to an existing protoc.exe on this runner"; exit 1 }
    - |
      foreach ($pin in @(@("PHOSPHOR_REMOTE_SHA256_LINUX_X86_64", "phosphor-remote-linux-x86_64"), @("PHOSPHOR_REMOTE_SHA256_LINUX_AARCH64", "phosphor-remote-linux-aarch64"))) {
        $file = "helper-artifacts\$($pin[1]).sha256"
        if (-not (Test-Path $file)) { Write-Error "missing helper digest $file; the client would compile with no pinned digest and refuse every helper install"; exit 1 }
        $digest = (Get-Content $file -Raw).Trim().ToLower()
        if ($digest.Length -ne 64) { Write-Error "$file does not hold a SHA-256 digest"; exit 1 }
        Set-Item -Path "env:$($pin[0])" -Value $digest
        "$($pin[0])=$digest"
      }
      # NOTE: script\windows\bundle.ps1 does not copy the helper files into the installer yet, so a
      # Windows client pins the digests but has no helper to upload and stays on the no-helper path.
    # cargo-about generates the bundled third-party licenses (same pin as script/install_cargo_release_deps).
    - if (-not ((Get-Command cargo-about -ErrorAction SilentlyContinue) -and ((cargo-about --version) -match "0\.8\.4"))) { cargo install cargo-about --version 0.8.4 --locked --force; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
    # #1515: Authenticode signing runs ONLY when the owner has provided the certificate variables listed in
    # docs/release-signing.md (protected). The .pfx is written outside the checkout and removed in after_script.
    - |
      $env:PHOSPHOR_SIGNED = "0"
      if ($env:WINDOWS_CODESIGN_PFX_B64 -and $env:WINDOWS_CODESIGN_PFX_PASSWORD -and $env:WINDOWS_CODESIGN_TIMESTAMP_URL) {
        $pfx = Join-Path $env:TEMP "phosphor-codesign-$env:CI_JOB_ID.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_B64))
        # Inno Setup substitutes $f with the file to sign.
        $env:SIGN_TOOL_CMD = "signtool.exe sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /f `"$pfx`" /p `"$env:WINDOWS_CODESIGN_PFX_PASSWORD`" `$f"
        $env:PHOSPHOR_SIGNED = "1"
        Write-Host "Authenticode credentials present: signing the installer."
      } else {
        Write-Host "No Windows code-signing certificate configured: unsigned installer (see docs/release-signing.md)."
      }
      .\script\windows\bundle.ps1 -CHANNEL $env:CHANNEL -ARCH x64 -RELEASE_TAG $env:RELEASE_TAG
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - |
      $installer = (Select-String -Path $env:GITHUB_OUTPUT -Pattern '^installer_path=(.*)$' | Select-Object -Last 1).Matches[0].Groups[1].Value
      if (-not $installer -or -not (Test-Path $installer)) { Write-Error "no installer at '$installer'"; exit 1 }
      New-Item -ItemType Directory -Force dist | Out-Null
      Copy-Item $installer "dist\Phosphor-windows-x86_64-Setup.exe"
      Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } | Set-Content -Encoding ascii manifest-windows.txt
      Get-Content manifest-windows.txt
      if ($env:PHOSPHOR_SIGNED -eq "1") { $env:PHOSPHOR_REQUIRE_SIGNED = "1" }   # signed release: an invalid signature fails the job
      .\script\ci\verify_artifacts.ps1 -Dist dist -Sums manifest-windows.txt   # #1515: verify BEFORE publishing
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      & "C:\Program Files\Git\bin\bash.exe" ./script/ci/upload_package "$env:RELEASE_VERSION" dist/Phosphor-windows-x86_64-Setup.exe
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
  after_script:
    - Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:TEMP "phosphor-codesign-$env:CI_JOB_ID.pfx")
  artifacts:
    paths: [manifest-windows.txt, dist/]
    expire_in: 3 days

# Creates the GitLab release for a TAG: links to everything uploaded above, each with a
# direct_asset_path so /-/releases/<tag>/downloads/<file> works. Skipped for dry runs on
# main. Uses the job token (release creation by job token is allowed).
release-publish:
  extends: [.shim_github_env]
  stage: publish
  tags: [little-thing]
  # The build jobs AND the whole quality set (&release_quality_needs, #1495): a green build must never publish over a red suite.
  needs:
    - release-meta
    - cli-linux
    - cli-macos
    - release-macos-arm64
    - release-linux-x86_64
    - release-windows-x86_64
    - release-gate
    - guards
    - check-linux
    - licenses
    - advisories
    - test-linux
    - test-warpui-core
    - test-workspace-rest
  timeout: 20m
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - |
      set -euo pipefail
      python3 - <<'PY'
      import json, os, glob
      api = os.environ["CI_API_V4_URL"]; pid = os.environ["CI_PROJECT_ID"]
      version = os.environ["RELEASE_VERSION"]
      links = []
      digests = {}
      def link(name):
          return {
              "name": name,
              "url": f"{api}/projects/{pid}/packages/generic/phosphor/{version}/{name}",
              "direct_asset_path": f"/{name}",
              "link_type": "package",
          }
      for manifest in sorted(glob.glob("manifest-*.txt") + glob.glob("cli-artifacts/manifest-*.txt")):
          for line in open(manifest):
              parts = line.split()
              if len(parts) < 2: continue
              name = parts[-1].lstrip("*")
              digest = parts[0].lower()
              if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
                  raise SystemExit(f"ERROR {manifest}: no SHA-256 for {name}")
              if name in digests:
                  if digests[name] != digest:
                      raise SystemExit(f"ERROR {name} has two different digests in the manifests")
                  continue
              digests[name] = digest
              links.append(link(name))
      if not links:
          raise SystemExit("ERROR no release assets found in the manifests")
      # SHA256SUMS: the digest of every asset, from the manifests the build jobs wrote
      # over the exact bytes they uploaded. A GitLab release link carries no digest, so
      # this file is what the GUI updater verifies a download against (#1056,
      # app/src/autoupdate/gitlab.rs); without it the updater refuses the release.
      if "SHA256SUMS" in digests:
          raise SystemExit("ERROR a build job published an asset named SHA256SUMS")
      with open("SHA256SUMS", "w") as sums:
          for name in sorted(digests):
              sums.write(f"{digests[name]}  {name}\n")
      links.append(link("SHA256SUMS"))
      body = open("release-body.md").read()
      name = os.environ["RELEASE_NAME"]
      if os.environ.get("IS_PRERELEASE") == "true":
          name += " (pre-release)"
      payload = {"name": name, "tag_name": os.environ["RELEASE_TAG"], "description": body,
                 "assets": {"links": sorted(links, key=lambda l: l["name"])}}
      json.dump(payload, open("release.json", "w"))
      print(f"{len(links)} asset links")
      PY
    - cat SHA256SUMS
    - ./script/ci/upload_package "$RELEASE_VERSION" SHA256SUMS
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" | python3 -c "import sys,json; d=json.load(sys.stdin); print(\"created release\", d[\"tag_name\"], d[\"_links\"][\"self\"])"'

# Phosphor release pipeline — triggered by pushing a tag (v*)
#
# Differences from upstream create_release.yml:
# - Only macOS arm64 + macOS Intel + Windows x64 + Linux x86_64;
#   Web/CLI/Universal/Win-arm64 all dropped
#   (macOS builds a single-arch DMG and CLI tarball per architecture; Linux
#    produces AppImage/deb/rpm plus a best-effort Arch package; doesn't
#    publish upstream Zap repo source or signing keys)
# - Build channel is always "oss" (release_configurations.json's separate
#   "oss"/"beta" release-metadata channels only affect the GitHub Release's
#   prerelease flag / name / body, not what gets built)
# - Unsigned: doesn't pass --read-passwords-from-env (macOS) / doesn't set
#   SIGN_TOOL_CMD (Windows)
# - Doesn't upload to GCS / third-party crash platforms / Slack / changelog,
#   doesn't call channel-versions repository_dispatch
# - Reuses ./.github/actions/{prepare_environment,get_channel_config}
#
# Pipeline structure (build first, then publish, to avoid an empty Release):
#   prepare_metadata → release_{macos,windows,linux} (uploaded as workflow artifacts)
#                    → publish_release (downloads artifacts and creates the Release once all builds succeed)
# If any build job fails → publish_release is skipped via `needs` → no
# Release without installers is ever left behind.

name: Phosphor Release

# PR validation is handled by .github/workflows/pr-check.yml (Linux cargo check).
# This workflow only runs the full three-platform build on tag push / manual
# dispatch, to avoid wasting ~3h per PR run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: >-
          Release-metadata channel (see release_configurations.json). Only
          affects the GitHub Release's prerelease flag / body / name — the
          app itself always builds as the "oss" Channel regardless. Ignored
          on tag-push triggers, where this is inferred from the tag name
          instead (a tag containing "beta" uses the beta channel).
        type: choice
        options:
          - oss
          - beta
        default: oss

# Creating a release + uploading assets needs write permission. The default
# GITHUB_TOKEN is read-only on forks/restricted repos, so we explicitly
# declare contents: write to guard against 403 "Resource not accessible by
# integration".
# actions: write is used at the end of publish_release to delete this run's
# workflow artifacts (freeing Actions storage).
permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CONFIG_FILE: ".github/workflows/release_configurations.json"
  # The Phosphor fork uses the oss channel (corresponds to the inline ChannelConfig
  # in app/src/bin/oss.rs, no dependency on the private warp-channel-config
  # binary); internal channels like preview go through the
  # channel_config::load_config!() macro → build.rs calls warp-channel-config,
  # which fails → *_config.json isn't generated → include_str! fails to compile.
  CHANNEL: oss

jobs:
  prepare_metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.compute_tag.outputs.tag }}
      release_branch: ${{ steps.compute_tag.outputs.branch }}
      release_name: ${{ steps.get-config.outputs.release_base_name }} ${{ steps.compute_tag.outputs.tag }}
      is_prerelease: ${{ steps.get-config.outputs.is_prerelease }}
    steps:
      # fetch-depth: 0 lets git-cliff see the full tag/commit history;
      # under a shallow clone, `git describe` can't find the previous tag and
      # falls back to empty release notes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Release-metadata channel (release_configurations.json), decoupled from
      # the app's build CHANNEL below: on a tag push, a tag containing "beta"
      # (case-insensitive, e.g. v2026.08.01-beta.1) selects the beta channel
      # (prerelease, not marked "latest"); everything else defaults to oss.
      # workflow_dispatch runs use the release_channel input directly.
      - name: Compute release-metadata channel
        id: release_channel
        shell: bash
        run: |
          if [[ -n "${{ inputs.release_channel }}" ]]; then
            CHANNEL="${{ inputs.release_channel }}"
          elif [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" =~ [Bb][Ee][Tt][Aa] ]]; then
            CHANNEL="beta"
          else
            CHANNEL="oss"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Release-metadata channel: $CHANNEL"

      - name: Get channel configuration
        id: get-config
        uses: ./.github/actions/get_channel_config/
        with:
          config_file: ${{ env.CONFIG_FILE }}
          channel: ${{ steps.release_channel.outputs.channel }}

      - name: Compute release tag and branch
        id: compute_tag
        shell: bash
        run: |
          # tag-triggered case: GITHUB_REF=refs/tags/<tag>
          # workflow_dispatch: GITHUB_REF=refs/heads/<branch>, no tag, so we generate a temporary tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            BRANCH="$TAG"
          else
            TAG="v0.$(date +%Y.%m.%d.%H%M)"
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG / build ref: $BRANCH"

      # Find the previous release tag (matching v*), used to bound git-cliff's
      # commit range.
      # tag-triggered: HEAD == the current tag, so we need to look for the
      # nearest v* tag starting from HEAD^.
      # dispatch: HEAD isn't a tag, so we look starting from HEAD directly.
      # If none is found (first release), output an empty string and let
      # git-cliff run unbounded below.
      - name: Compute previous release tag
        id: prev_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD^ 2>/dev/null || echo "")
          else
            PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD 2>/dev/null || echo "")
          fi
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV:-<none, first release>}"

      # Use the officially recommended orhun/git-cliff-action to generate the
      # "previous tag to HEAD" changelog.
      # --strip header removes the empty header at the top of the template;
      # --tag marks the unreleased section as this release's version.
      # The range argument `<prev>..HEAD` is injected via a ternary
      # expression: bounded when prev exists, otherwise lets git-cliff emit
      # the full history (first-release scenario).
      - name: Generate release notes via git-cliff
        uses: orhun/git-cliff-action@98c93442bb05a455a77bee982867857ae748eeea # v4.5.1
        with:
          config: cliff.toml
          args: >-
            --strip header
            --tag ${{ steps.compute_tag.outputs.tag }}
            ${{ steps.prev_tag.outputs.prev != '' && format('{0}..HEAD', steps.prev_tag.outputs.prev) || '' }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      # Prepend the fixed blurb from release_configurations.json to the
      # git-cliff output to form the final release body. publish_release
      # later injects it into the GitHub Release via body_path.
      - name: Assemble final release body
        shell: bash
        env:
          RELEASE_BODY_TEXT: ${{ steps.get-config.outputs.release_body_text }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev }}
          THIS_TAG: ${{ steps.compute_tag.outputs.tag }}
          # Needed by the truncation branch's compare URL below. Set here as
          # well as on the git-cliff step; env is per-step, not per-job.
          GITHUB_REPO: ${{ github.repository }}
        run: |
          {
            echo "$RELEASE_BODY_TEXT"
            echo
            if [[ -n "$PREV_TAG" ]]; then
              echo "## Changes since \`$PREV_TAG\`"
            else
              echo "## Initial release changes"
            fi
            echo
            cat release-notes.md
          } > release-body.md

          # GitHub rejects a release body over 125000 characters with a 422
          # "body is too long", and the publish job fails AFTER every platform
          # has built -- on 2026-08-11 that was ~4 hours of macOS build time
          # thrown away by a validation error. git-cliff includes full commit
          # BODIES, so a release spanning many commits (that one spanned 162)
          # blows the limit easily.
          #
          # Truncate at a line boundary, well under the cap, and point at the
          # compare view so nothing is actually lost.
          MAX_BODY=120000
          if [[ $(wc -c < release-body.md) -gt $MAX_BODY ]]; then
            COMPARE_URL="https://github.com/${GITHUB_REPO}/compare/${PREV_TAG}...${THIS_TAG}"
            head -c "$MAX_BODY" release-body.md | head -n -1 > release-body.trimmed.md
            {
              echo
              echo "---"
              echo
              echo "_Release notes truncated: the full changelog exceeded GitHub's"
              echo "125,000-character limit for a release body._"
              echo
              if [[ -n "$PREV_TAG" ]]; then
                echo "**[Full changelog: \`$PREV_TAG...$THIS_TAG\`]($COMPARE_URL)**"
              fi
            } >> release-body.trimmed.md
            mv release-body.trimmed.md release-body.md
            echo "::notice::Release body exceeded ${MAX_BODY} chars and was truncated."
          fi

          echo "---- release-body.md ($(wc -c < release-body.md) bytes) ----"
          cat release-body.md

      - name: Upload release body artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error
          retention-days: 7

  release_macos:
    name: Build Release (macOS ${{ matrix.dmg_name_suffix }})
    runs-on: ${{ matrix.runner }}
    needs: prepare_metadata
    # macos-26 / macos-26-intel (Pro standard) have no sccache, so a full cargo
    # build + bundle + create-dmg takes a long time; the Intel build has
    # historically exceeded 180min, so we relax this to the 6h execution
    # limit for GitHub-hosted jobs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            dmg_name_suffix: arm64
            runner: macos-26 # Pro standard arm64 (M2 Pro)
          - arch: x86_64
            dmg_name_suffix: intel
            runner: macos-26-intel # Pro standard Intel
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-${{ matrix.arch }}
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure rust target is installed
        run: rustup target add ${{ matrix.arch }}-apple-darwin
        shell: bash

      - name: Check ${{ matrix.arch }} release compile
        run: |
          script/bundle --check-only --channel "$CHANNEL" --arch ${{ matrix.arch }} --dmg-name-suffix "${{ matrix.dmg_name_suffix }}" --selfsign
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      # Use --selfsign to do ad-hoc signing (falls back to `-` when there's no
      # Apple Developer cert):
      # 1. Giving the .app a cdhash is required before UNUserNotificationCenter
      #    will register Zap in System Settings → Notifications (otherwise
      #    desktop notifications silently fail, see issue #40).
      # 2. ad-hoc + Hardened Runtime + Debug-Entitlements.plist
      #    (disable-library-validation + get-task-allow) is a valid
      #    combination that can be done on a macos-26 runner without
      #    credentials.
      # 3. The whole notarize step is skipped by the CODESIGN=false branch in
      #    `script/macos/bundle`; the DMG is created directly from
      #    BUNDLE_DIR via create-dmg, without going through codesign / staple.
      # 4. Users will still hit Gatekeeper's "unidentified developer" dialog
      #    on first open (an inherent limitation of not having Developer ID
      #    notarization); the `xattr -rd com.apple.quarantine` self-service
      #    workaround from issue #51 remains valid.
      - name: Build ${{ matrix.arch }} bundle (ad-hoc signed)
        id: bundle_app
        run: |
          script/bundle --channel "$CHANNEL" --arch ${{ matrix.arch }} --dmg-name-suffix "${{ matrix.dmg_name_suffix }}" --selfsign
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-macos-${{ matrix.dmg_name_suffix }}
          path: ${{ steps.bundle_app.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build CLI
        id: bundle_cli
        run: |
          script/bundle --channel "$CHANNEL" --arch ${{ matrix.arch }} --artifact cli --nosign
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Package CLI tarball
        run: |
          cp "${{ steps.bundle_cli.outputs.binary_path }}" zap-oss
          tar czf phosphor-cli-macos-${{ matrix.arch }}.tar.gz \
            zap-oss \
            -C "$(dirname "${{ steps.bundle_cli.outputs.bundled_resources_dir }}")" resources
        shell: bash

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-cli-macos-${{ matrix.arch }}
          path: phosphor-cli-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      # warp_tui is a non-default workspace member (crates/warp_tui, binary
      # zap-tui-oss — an internal binary name, like zap-oss for the GUI;
      # renamed to phosphor-tui below since that's what users see/download)
      # with no packaged release artifact until now — build/run
      # was source-only (`cargo run -p warp_tui`). Reuses the same
      # release-cli profile + target already warmed by the CLI build above,
      # so this doesn't pay for a second full dependency compile.
      - name: Build TUI
        id: bundle_tui
        run: |
          cargo build -p warp_tui --profile release-cli --target ${{ matrix.arch }}-apple-darwin --bin zap-tui-oss
        shell: bash

      - name: Package TUI tarball
        run: |
          cp "target/${{ matrix.arch }}-apple-darwin/release-cli/zap-tui-oss" phosphor-tui
          tar czf phosphor-tui-macos-${{ matrix.arch }}.tar.gz phosphor-tui
        shell: bash

      - name: Upload TUI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-tui-macos-${{ matrix.arch }}
          path: phosphor-tui-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release_windows:
    name: Build Release (Windows x64)
    runs-on: windows-latest
    needs: prepare_metadata
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: x64
          is_self_hosted: false
          install_release_deps: true

      - name: Build binary (unsigned)
        id: build_binary
        run: script/bundle -Channel $CHANNEL -skip_build_installer --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Bundle app (unsigned installer)
        id: bundle_app
        run: script/bundle -Channel $CHANNEL -skip_build_binary --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-windows-x64
          path: ${{ steps.bundle_app.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 7

      # warp_tui is a non-default workspace member (crates/warp_tui, binary
      # zap-tui-oss — an internal binary name, like zap-oss for the GUI;
      # renamed to phosphor-tui below since that's what users see/download)
      # with no packaged release artifact until now — build/run
      # was source-only (`cargo run -p warp_tui`). No CLI build runs in this
      # job to reuse a warmed profile from, so this is a plain release build.
      # app/build.rs needs CARGO_FULL_PROFILE (a custom env var, since Cargo
      # itself doesn't expose the target-dir profile name to build scripts —
      # see rust-lang/cargo#9661) to know where to copy conpty.dll on Windows.
      # Without it, it defaults to "debug" and fails to find a target/debug
      # directory that was never created by this --release build.
      - name: Build TUI
        run: cargo build -p warp_tui --release --bin zap-tui-oss
        shell: bash
        env:
          CARGO_FULL_PROFILE: release

      - name: Package TUI zip
        run: |
          Copy-Item target/release/zap-tui-oss.exe phosphor-tui.exe
          Compress-Archive -Path phosphor-tui.exe -DestinationPath phosphor-tui-windows-x64.zip
        shell: pwsh

      - name: Upload TUI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-tui-windows-x64
          path: phosphor-tui-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release_linux:
    name: Build Release (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: prepare_metadata
    # Use 22.04 (glibc 2.35) instead of ubuntu-latest (24.04, glibc 2.39);
    # AppImage links against the host glibc, so a 22.04 build can run on more
    # older distros (Debian 11 / Ubuntu 20.04+, etc.).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      # The GitHub-hosted ubuntu runner has limited free space on /, and this
      # job produces two full targets on the same disk in sequence:
      # release-lto (GUI/AppImage/deb/rpm/arch) and release-cli (musl CLI).
      # Combined with the cargo registry / docker images / zig toolchain,
      # this fills up the disk and the musl CLI step reports "No space left
      # on device" (see run 27593938453). Remove the preinstalled toolchains
      # unrelated to this build (Android SDK / .NET / GHC / CodeQL / Swift)
      # first, freeing up ~25GB.
      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install extra dependencies for deb/rpm and build
        run: |
          sudo apt-get update
          # The `rpm` package provides /usr/bin/rpmbuild, used by the RPM packaging step below.
          sudo apt-get install -y libdbus-1-dev fakeroot rpm
        shell: bash

      - name: Ensure rust target is installed
        run: rustup target add x86_64-unknown-linux-gnu
        shell: bash

      - name: Check Linux release compile
        run: script/bundle --check-only --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Install linuxdeploy
        # script/linux/install_linuxdeploy isn't called by install_build_deps
        # and needs to be run manually; it puts the linuxdeploy AppImage in
        # ~/.local/bin and adds it to PATH.
        run: |
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build AppImage (unsigned)
        id: bundle_app
        run: script/bundle --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}
          # ubuntu-22.04 has libfuse2 by default but 24.04 doesn't; uniformly
          # enabling EXTRACT_AND_RUN keeps linuxdeploy/appimagetool from
          # depending on the FUSE kernel module, making it stable across
          # runner versions.
          APPIMAGE_EXTRACT_AND_RUN: 1

      # RPM package: reuses the already-stripped `target/release-lto/zap-oss`
      # from the release-lto step above, no `cargo build` again. `--skip-build`
      # makes `script/bundle` skip compiling and stripping, and go straight
      # to staging (`bundle_install` → copy the binary + resources) + rpmbuild.
      # Runs on the same ubuntu-22.04 runner as the deb build, sharing the
      # host-glibc-linked artifact; install with RPM 4.13+ on Fedora 26+ /
      # RHEL 8+ (the spec uses boolean dep syntax).
      # continue-on-error: even if rpmbuild fails, it shouldn't block the
      # already-successful AppImage/deb release.
      - name: Build RPM package (reuse release-lto binary)
        continue-on-error: true
        run: script/bundle --skip-build --channel "$CHANNEL" --arch x86_64 --packages rpm
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      # Arch package: reuses the already-stripped `target/release-lto/zap-oss`
      # from the release-lto step above, not rebuilding the main binary via
      # `cargo build` — `--skip-build` makes `script/bundle` skip compiling
      # and stripping, going straight to staging (`bundle_install` → copy the
      # binary + resources) + makepkg.
      #
      # Why run it in a container: `makepkg` is Arch-only, and the Ubuntu
      # runner doesn't have it.
      # The container only has Arch's own `rust` and `cargo-about` installed:
      #   - With SKIP_SETTINGS_SCHEMA=1, `cargo run --bin generate_settings_schema`
      #     is no longer run, so it doesn't matter that the container's rustc
      #     version doesn't match the project's pinned version (1.92.x).
      #   - `cargo about generate` only reads Cargo.lock metadata to generate
      #     third-party licenses; it doesn't trigger any Rust code
      #     compilation.
      # makepkg refuses to run as root (EUID==0), so we must switch to a
      # non-root user.
      # continue-on-error: if the Arch toolchain blows up, it shouldn't
      # affect the AppImage/deb release.
      - name: Build Arch package (reuse release-lto binary)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Create the builder user in the container with the host runner
          # user's uid/gid, avoiding the cost of chowning all of /work and
          # ~/.cargo (makepkg refuses root, but any uid != 0 works — the
          # specific name/uid doesn't matter).
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          # Note: don't pass GITHUB_ACTIONS=true through into the container.
          # When script/bundle sees that variable it does
          # `echo ... >> "$GITHUB_OUTPUT"`, but the container has no
          # GITHUB_OUTPUT, so the redirect goes to an empty string and
          # triggers `set -e` to exit — the Arch package simply never gets
          # built (see run 26153630745).
          # We also don't need this step's outputs — it's continue-on-error,
          # and packages_dir is provided by the earlier AppImage step's
          # bundle_app.outputs.
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cargo:/cargo-home" \
            -w /work \
            -e GIT_RELEASE_TAG="${{ needs.prepare_metadata.outputs.release_tag }}" \
            -e SKIP_SETTINGS_SCHEMA=1 \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            archlinux:latest bash -euxc '
              # Preinstall the runtime deps from PKGBUILD `depends`, to avoid
              # makepkg -s calling `sudo pacman -S` inside the container to
              # install missing packages (builder has no passwordless sudo,
              # so it exits 8 for lack of a password, and the Arch package
              # ends up missing, see run 26267606877).
              # `opengl-driver` doesn't exist in the official repos (a NixOS
              # concept / AUR virtual package), so use --assume-installed
              # separately to make the dependency check skip it.
              pacman -Sy --noconfirm --needed \
                base-devel git sudo rust cargo-about \
                curl default-cursors fontconfig libegl libx11 libxcb \
                libxcursor libxi libxkbcommon-x11 xdg-utils zlib &&
              # Create the user with the host uid/gid, so the mounted /work
              # and /cargo-home are already owned by it — no chown needed,
              # sudo -u alone gives read/write access.
              groupadd -g "$HOST_GID" builder 2>/dev/null || true
              useradd -u "$HOST_UID" -g "$HOST_GID" -m builder
              # Explicitly set HOME=/home/builder, otherwise `sudo -E` would
              # keep the outer HOME=/root, causing `git config --global` to
              # try to write /root/.gitconfig and get Permission denied.
              sudo -u builder -E env \
                HOME=/home/builder \
                CARGO_HOME=/cargo-home \
                PATH=/cargo-home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
                bash -c "
                  git config --global --add safe.directory /work
                  cd /work
                  # Dependencies are already installed via the outer pacman;
                  # tell makepkg to treat `opengl-driver` as already
                  # installed, so it doesn't try to pacman -S a package that
                  # isn't in any repo.
                  # Also pass --noconfirm: since GITHUB_ACTIONS isn't passed
                  # through into the container, the native branch in
                  # bundle_arch won't take effect.
                  MAKEPKG_EXTRA_ARGS='\''--noconfirm --assume-installed opengl-driver'\'' \
                    script/bundle --skip-build --channel oss --arch x86_64 --packages arch
                "
            '
        shell: bash

      # dpkg-deb/rpmbuild/makepkg all auto-derive their output filename from
      # the internal package name (@@PACKAGE_NAME@@ = "zap", kept for
      # install-path compatibility — see specs/phosphor-rebrand/SCOPE.md), so
      # the .deb/.rpm/.pkg.tar.zst filenames still say "zap" even though the
      # AppImage already reads "Phosphor" (from the .desktop file's Name=).
      # Rename them to match before they land on the release page.
      - name: Rename package files for the release page
        shell: bash
        run: |
          dir="${{ steps.bundle_app.outputs.packages_dir }}"
          for f in "$dir"/zap_* "$dir"/zap-*; do
            [ -e "$f" ] || continue
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/^zap([_-])/phosphor\1/')"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-linux-x86_64
          # packages_dir is target/release-lto/bundle/linux; AppImage/deb/Arch all land here
          path: ${{ steps.bundle_app.outputs.packages_dir }}
          if-no-files-found: error
          retention-days: 7

      # The release-lto artifacts (GUI/deb/rpm/arch) have already been
      # uploaded as a workflow artifact by the "Upload package artifacts"
      # step above, so they're no longer needed locally; the musl CLI build
      # below uses a separate release-cli profile, so remove release-lto to
      # free up disk space and avoid "No space left on device".
      - name: Reclaim disk before musl CLI build
        shell: bash
        run: |
          rm -rf target/release-lto
          df -h /

      # The CLI/remote-server tarball uses static musl linking, so the
      # artifact has no dependency on the host glibc and can run on any Linux
      # x86_64 host (including older-glibc distros like CentOS 7 / Amazon
      # Linux 2, and musl distros like Alpine). The GUI AppImage/deb still
      # goes through the glibc-linked build above, unaffected.
      #
      # Use `cargo zigbuild` for the musl cross-compile: zig bundles a
      # complete C/C++ musl toolchain (`zig cc` / `zig c++`), with no
      # dependency on the host's `musl-gcc` or a hand-written `musl-g++`
      # wrapper — the "host g++ + musl specs" hack historically needed for
      # *-sys deps like freetype-sys / harfbuzz-sys has therefore been
      # removed entirely.
      # The local dev auto-build path (`ssh_transport.rs`) also prefers
      # zigbuild, so both sides use a unified toolchain.
      - name: Install zig + cargo-zigbuild for static musl CLI build
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          # zig: use the official prebuilt tarball, pinned to a fixed version
          # for reproducible builds.
          # 0.13.0 is compatible with cargo-zigbuild >= 0.19.
          ZIG_VERSION="0.13.0"
          ZIG_DIR="$HOME/.local/zig-${ZIG_VERSION}"
          if [ ! -x "${ZIG_DIR}/zig" ]; then
            mkdir -p "${ZIG_DIR}"
            curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
              | tar -xJ -C "${ZIG_DIR}" --strip-components=1
          fi
          echo "${ZIG_DIR}" >> "$GITHUB_PATH"
          # cargo-zigbuild: installed via cargo install; cached after the first install and reused thereafter.
          cargo install --locked cargo-zigbuild --version ^0.19
        shell: bash

      - name: Build CLI (static musl via zigbuild)
        id: bundle_cli
        run: |
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --packages none \
            --target x86_64-unknown-linux-musl
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Makes script/linux/bundle switch `cargo build` to `cargo zigbuild`.
          USE_ZIGBUILD: "true"
          # libc (musl) is statically linked into the binary via
          # +crt-static — this is the key to freeing the artifact from the
          # host glibc floor. `libdbus-sys` is now compiled from source
          # in-tree via keyring's `vendored` feature (see Cargo.toml), no
          # longer probing the host `dbus-1` via pkg-config;
          # `PKG_CONFIG_ALLOW_CROSS=1` is kept as a fallback so that if some
          # newly introduced -sys crate still uses pkg-config, it won't get
          # stuck.
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package CLI tarball
        run: |
          cp "${{ steps.bundle_cli.outputs.executable_path }}" zap-oss
          tar czf phosphor-cli-linux-x86_64.tar.gz \
            zap-oss \
            -C "$(dirname "${{ steps.bundle_cli.outputs.bundled_resources_dir }}")" resources
        shell: bash

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-cli-linux-x86_64
          path: phosphor-cli-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

      # warp_tui is a non-default workspace member (crates/warp_tui, binary
      # zap-tui-oss — an internal binary name, like zap-oss for the GUI;
      # renamed to phosphor-tui below since that's what users see/download)
      # with no packaged release artifact until now — build/run
      # was source-only (`cargo run -p warp_tui`). Reuses the same
      # release-cli profile + musl target + zig/cargo-zigbuild toolchain
      # already warmed by the CLI build above, so this doesn't pay for a
      # second full dependency compile or a second cross-toolchain install.
      - name: Build TUI (static musl via zigbuild)
        run: |
          cargo zigbuild -p warp_tui --profile release-cli --target x86_64-unknown-linux-musl --bin zap-tui-oss
        shell: bash
        env:
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package TUI tarball
        run: |
          cp "target/x86_64-unknown-linux-musl/release-cli/zap-tui-oss" phosphor-tui
          tar czf phosphor-tui-linux-x86_64.tar.gz phosphor-tui
        shell: bash

      - name: Upload TUI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phosphor-tui-linux-x86_64
          path: phosphor-tui-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Must wait for all platforms to build successfully before publishing;
    # if any fails → this job is skipped → no empty Release is ever created.
    needs:
      - prepare_metadata
      - release_macos
      - release_windows
      - release_linux
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # The release-body artifact is meant for the GitHub Release description,
      # not something to attach to the Release's asset list. Move it out of
      # dist/ to a separate path ahead of time, so `files: dist/*` doesn't
      # upload it as an asset.
      - name: Extract release body from artifacts
        shell: bash
        run: |
          mv dist/release-body.md ./release-body.md
          echo "---- release-body.md ----"
          cat ./release-body.md

      - name: List downloaded files
        run: ls -lh dist
        shell: bash

      # A beta/prerelease build must never take over "Latest" from the most
      # recent stable release, so make_latest tracks is_prerelease inversely.
      - name: Create GitHub release with all assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: ${{ needs.prepare_metadata.outputs.release_name }}
          tag_name: ${{ needs.prepare_metadata.outputs.release_tag }}
          body_path: ./release-body.md
          draft: false
          prerelease: ${{ needs.prepare_metadata.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare_metadata.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # Delete this run's workflow artifacts right after a successful
      # publish, to free up the Actions storage quota. The installers are
      # already attached to the GitHub Release (separate storage, doesn't
      # count against Actions storage); the workflow artifact is just an
      # intermediate hand-off pipe from build jobs to the publish job, no
      # further use in keeping it around.
      # Only runs after the Release is created successfully (if: success());
      # on failure the artifact is kept for post-mortem debugging.
      - name: Delete workflow artifacts to free Actions storage
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        shell: bash

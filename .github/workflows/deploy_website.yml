name: Deploy Website

# Trigger: push to the default branch that touches website/; or manual dispatch
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy_website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only run when the deploy secrets are configured, to avoid errors on forks / unconfigured environments
    if: ${{ github.repository == 'zerx-lab/zap' }}
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (astro + pagefind)
        run: bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist to server (.incoming)
        env:
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          # DEPLOY_PATH = the site's index directory, e.g. /opt/1panel/www/sites/zap.zerx.dev/index
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Prepare the staging area and script directory in the site's parent directory (one level above index)
          PARENT="$(dirname "$DEPLOY_PATH")"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "mkdir -p '$PARENT/.incoming'"
          # Push static build output to .incoming (--delete ensures it exactly matches the local dist)
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            dist/ "$USER@$HOST:$PARENT/.incoming/"
          # Push the deploy script to the parent directory
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            deploy/deploy.sh "$USER@$HOST:$PARENT/deploy.sh"

      - name: Run remote deploy script
        env:
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Grant execute permission on the remote and run it, passing the real index directory as the argument
          # To avoid the pull/upload leaving it without execute permission, always chmod +x
          PARENT="$(dirname "$DEPLOY_PATH")"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "chmod +x '$PARENT/deploy.sh' && '$PARENT/deploy.sh' '$DEPLOY_PATH'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

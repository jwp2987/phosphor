# PR validation — Linux + Windows `cargo check` for the app (gui + tui) and the
# warp_tui crate.
#
# phosphor_release.yml intentionally only runs on tags (full 3-platform packaging, ~3h),
# and delegates PR validation to this workflow. This keeps PRs fast: a `cargo check`
# (no packaging). The Windows job compile-checks the `cfg(windows)` code paths
# (e.g. PATHEXT resolution, login-item registration) that the Linux job can't reach.
#
# `crates/warp_tui` is a non-default workspace member (kept out of `default-members`
# so the default build stays light and platform-portable), so it is checked
# explicitly here — otherwise a shared-crate change could break it unnoticed.
name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the in-flight check.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fork-boundary guards. Pure grep/git -- no build -- so this job finishes in
  # under a minute and gives fast feedback ahead of the cargo jobs.
  #
  # These exist because two classes of regression are invisible to the compiler:
  #   1. Cloud creep. The cloud *crates* were deleted, so the compiler blocks
  #      those. But app/src/server and app/src/cloud_object survive as stubs for
  #      retained call sites, and nothing stopped a port from reaching into them
  #      and re-growing the cloud surface one `use` at a time.
  #   2. Fake coverage. Some functions were gutted to no-op stubs when the cloud
  #      backend was dropped. A test ported against a stub compiles and passes
  #      while asserting nothing -- worse than a missing test, because it reads
  #      as progress and can never fail.
  guards:
    name: fork boundary guards
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The stub check compares against the pinned Warp stable release
      # (see ORACLE.md). Fetch just that one commit rather than the whole
      # upstream repo -- a full fetch of warpdotdev/warp is large and this
      # job only ever reads blobs at the pin.
      - name: Fetch the pinned oracle commit
        shell: bash
        run: |
          PIN=$(grep -oE '\*\*Commit\*\* \| `[0-9a-f]+`' ORACLE.md | grep -oE '[0-9a-f]{7,}' | head -1)
          PIN=${PIN:-02b53fcd8}
          echo "pin=$PIN"
          git fetch --depth=1 --no-tags https://github.com/warpdotdev/warp.git "$PIN" || {
            echo "::warning::could not fetch pin $PIN; stub check will skip"
          }

      - name: Cloud boundary (no new imports of dropped-cloud modules)
        shell: bash
        run: ./script/check_cloud_boundary

      - name: Stub coverage (no tests against gutted no-op stubs)
        shell: bash
        run: ./script/check_stub_coverage

  check-linux:
    name: cargo check (Linux)
    # ubuntu-22.04 (glibc 2.35) matches the release Linux job.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      - name: Ensure rust target is installed
        shell: bash
        run: rustup target add x86_64-unknown-linux-gnu

      # The GUI feature is the guardrail after any shared-crate change.
      - name: cargo check -p warp --features gui
        shell: bash
        run: cargo check -p warp --features gui --lib --tests

      # The app crate carries the TUI via its own `tui` feature.
      - name: cargo check -p warp --features tui
        shell: bash
        run: cargo check -p warp --features tui

      # The warp_tui crate is not in default-members; check it explicitly.
      - name: cargo check -p warp_tui
        shell: bash
        run: cargo check -p warp_tui

  # The suite has never run in CI. Compile checks and the boundary guards catch
  # a lot, but neither one can tell you a test went red -- which is the failure
  # this project actually cares about, and the reason "don't merge red" has so
  # far depended on a human remembering to look.
  #
  # NOT a required status check yet, deliberately. `main` currently carries 11
  # red tests (6 unintentional, from hunks two porting agents flagged as
  # uncompiled; 5 deliberate, pinning issues #251/#253). Promoting this to
  # required before those are resolved would block every open PR on a failure
  # none of them caused -- exactly the cascade that made the boundary guard
  # worthless when PR #246 was merged past it.
  #
  # Promote it in the branch-protection contexts once the suite is green.
  test-linux:
    name: cargo nextest (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      # nextest, not `cargo test`: this suite was stabilised under nextest's
      # process-per-test isolation. Several tests depend on it (the ssh-onekey
      # singleton, the secrets-regex serial group), and would fail differently
      # in a shared test process.
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Fails on CHANGE, not on redness -- see script/check_test_failures for
      # why. `main` has known reds; a job that is red on every PR forever is a
      # job everyone learns to ignore.
      #
      # BOTH crates run in ONE invocation, deliberately:
      #
      #   - `warp_tui` was not gated at all until #465. Its 620 tests ran
      #     nowhere, and two user-visible regressions sat on `main` unnoticed
      #     as a result (no agent-mode prompt gutter; no selection markers on
      #     custom answers). Anything not in CI is not actually tested.
      #   - It must be one invocation, not two steps. check_test_failures
      #     treats a listed failure that did NOT run as "fixed" and exits 1, so
      #     a second invocation covering only one crate would fail the gate on
      #     the other crate's known failures.
      #   - The feature is package-qualified (`warp/gui`) because `warp_tui`
      #     has no `gui` feature of its own; a bare `--features gui` errors out
      #     once more than one package is selected.
      - name: cargo nextest (regressions only)
        shell: bash
        run: ./script/check_test_failures -p warp -p warp_tui --lib --features warp/gui

  check-windows:
    name: cargo check (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false

      # Compile-checks the `cfg(windows)` code the Linux job can't reach
      # (PATHEXT executable resolution, login-item registration, etc.).
      - name: cargo check -p warp --features gui
        shell: bash
        run: cargo check -p warp --features gui --lib --tests

      - name: cargo check -p warp --features tui
        shell: bash
        run: cargo check -p warp --features tui

      - name: cargo check -p warp_tui
        shell: bash
        run: cargo check -p warp_tui

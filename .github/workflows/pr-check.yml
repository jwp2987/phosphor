# PR validation — Linux + Windows `cargo check` for the app (gui + tui) and the
# warp_tui crate.
#
# phosphor_release.yml intentionally only runs on tags (full 3-platform packaging, ~3h),
# and delegates PR validation to this workflow. This keeps PRs fast: a `cargo check`
# (no packaging). The Windows job compile-checks the `cfg(windows)` code paths
# (e.g. PATHEXT resolution, login-item registration) that the Linux job can't reach.
#
# `crates/warp_tui` is a non-default workspace member (kept out of `default-members`
# so the default build stays light and platform-portable), so it is checked
# explicitly here — otherwise a shared-crate change could break it unnoticed.
name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the in-flight check.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fork-boundary guards. Pure grep/git -- no build -- so this job finishes in
  # under a minute and gives fast feedback ahead of the cargo jobs.
  #
  # These exist because six classes of regression are invisible to the compiler:
  #   1. Cloud creep. The cloud *crates* were deleted, so the compiler blocks
  #      those. But app/src/server and app/src/cloud_object survive as stubs for
  #      retained call sites, and nothing stopped a port from reaching into them
  #      and re-growing the cloud surface one `use` at a time.
  #   2. Fake coverage. Some functions were gutted to no-op stubs when the cloud
  #      backend was dropped. A test ported against a stub compiles and passes
  #      while asserting nothing -- worse than a missing test, because it reads
  #      as progress and can never fail.
  #   3. Settings-registry drift. The test harness hand-maintains a second copy
  #      of production's settings registration list. A group added to
  #      production and missed in the test harness compiles fine and only
  #      panics at runtime, in whichever test is first to touch it (PR #480).
  #   4. Declined-decision collisions. DECLINED.md records divergences from the
  #      pinned oracle on purpose. Nothing stopped a later port from silently
  #      undoing one -- porting a pin test the fork already decided never to
  #      port, or reintroducing a symbol/file that was deliberately removed --
  #      compiling and passing while quietly reopening a settled question. See
  #      DECLINED.md's "Machine-checkable markers" section.
  #   5. Shell-to-Rust string drift. The packaging scripts write the per-channel
  #      `oz` / `warpctrl` command names into the bundle, and the app looks them
  #      up BY NAME at runtime. Rename either side and everything still
  #      compiles; the failure only appears on a real bundle, as "bundled
  #      wrapper not found".
  #   6. Stale sweep-ledger citations. docs/sweep-verdict-ledger.tsv records
  #      1,843 hand-adjudicated pin-test verdicts, some citing a DECLINED.md
  #      row by issue number. DECLINED.md rows get reversed (struck through,
  #      not deleted) -- a ledger row still citing a row that has since been
  #      struck is silently wrong the moment the strike lands, not just at the
  #      next re-pin. See script/check_sweep_ledger's header comment.
  #
  # This job also runs the packaging scripts' own shell tests. They are bash,
  # need no toolchain, and had no runner at all before -- an unrun test is not
  # coverage.
  guards:
    name: fork boundary guards
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The stub check compares against the pinned Warp stable release
      # (see ORACLE.md). Fetch just that one commit rather than the whole
      # upstream repo -- a full fetch of warpdotdev/warp is large and this
      # job only ever reads blobs at the pin.
      - name: Fetch the pinned oracle commit
        shell: bash
        run: |
          # GitHub only serves fetch-by-SHA for a FULL 40-character sha, so
          # prefer ORACLE.md's "Commit (full)" row. The abbreviated row is for
          # humans; fetching it always fails with "couldn't find remote ref",
          # which is how this step warned-and-skipped on every run from its
          # introduction until 2026-08-15 while the job still reported green.
          PIN=$(grep -oE '\*\*Commit \(full\)\*\* \| `[0-9a-f]{40}`' ORACLE.md | grep -oE '[0-9a-f]{40}' | head -1)
          if [[ -z "$PIN" ]]; then
            echo "::error::ORACLE.md has no 40-char '**Commit (full)**' row; cannot fetch the pin"
            exit 1
          fi
          echo "pin=$PIN"
          git fetch --depth=1 --no-tags https://github.com/warpdotdev/warp.git "$PIN"
          # Deliberately NOT tolerated. check_stub_coverage exits 0 when the pin
          # object is missing -- a convention that keeps local runs usable and
          # makes an unfetched oracle indistinguishable from "nothing to check".
          # In CI the oracle is always reachable, so a failure here is a real
          # problem and must stop the job rather than silently disarm a guard.
          git cat-file -e "${PIN}^{commit}" || {
            echo "::error::pin $PIN fetched but not present; stub coverage would silently skip"
            exit 1
          }

      - name: Cloud boundary (no new imports of dropped-cloud modules)
        shell: bash
        run: ./script/check_cloud_boundary

      - name: Stub coverage (no tests against gutted no-op stubs)
        shell: bash
        run: ./script/check_stub_coverage

      - name: Declined collisions (no silent regression against a DECLINED.md decision)
        shell: bash
        run: ./script/check_declined_collisions

      - name: Settings registry (test harness matches production registration)
        shell: bash
        run: ./script/check_settings_registry

      - name: Channel command names (packaging scripts match channel/mod.rs)
        shell: bash
        run: ./script/check_channel_command_names

      - name: Generator wrapper names (bootstrap scripts match in_band_command_executor.rs)
        shell: bash
        run: ./script/check_generator_wrapper_names

      - name: Sweep verdict ledger (well-formed, no stale DECLINED.md citation)
        shell: bash
        run: ./script/check_sweep_ledger

      # Pure bash; the wrapper's shell logic has nothing macOS-specific in it,
      # so it runs on the ubuntu runner.
      - name: warpctrl wrapper generation
        shell: bash
        run: ./script/macos/test_create_warpctrl_wrapper

      # Needs a built `zap-oss`, which this job deliberately does not produce.
      # It exits 0 with a "SKIPPED" diagnostic in that case; the step is here
      # so it runs the moment a binary IS available (locally, or if this job
      # ever gains one), rather than existing unreferenced.
      - name: warpctrl early dispatch (skips without a built binary)
        shell: bash
        run: ./script/test_warpctrl_early_dispatch

  # Dependency licence gate.
  #
  # deny.toml and about.toml have both claimed "CI enforces this via
  # script/check_license_config_sync" since the fork was created, and nothing
  # did: `grep -rn 'check_license_config_sync\|cargo deny' .github/ script/`
  # matched only those two comments. Upstream ran both checks; the fork dropped
  # the workflow that ran them and kept the comments asserting they ran.
  #
  # Separate job, not a step in `guards`: `guards` is deliberately pure
  # grep/git and finishes in under a minute, and cargo-deny needs a Rust
  # toolchain and a full dependency-graph resolve. Keeping them apart preserves
  # the fast-feedback property `guards` was built for.
  #
  # Deliberately NOT in script/precheck: precheck's whole point is that it runs
  # in seconds without cargo, and this needs cargo plus a network fetch of the
  # advisory/crates metadata.
  #
  # `check sources` is wider than upstream ran (upstream ran `check licenses`
  # only). It is included because the fork introduced a dependency source
  # upstream never had -- the personal chenx-dust/winit fork -- and nothing
  # else would notice another one appearing. See the allow-git entry in
  # deny.toml.
  licenses:
    name: dependency licences
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Only cache on main; caches from feature branches are not reusable.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37 # v1.18.1

      - name: Check licences and sources for dependencies
        shell: bash
        run: |
          cargo binstall --force -y cargo-deny
          cargo deny -L error check licenses sources

      # ubuntu-22.04 ships Python 3.10, which has no stdlib `tomllib` (3.11+).
      # check_license_config_sync parses deny.toml/about.toml with it, so without a
      # newer interpreter this gate failed on every run with a ModuleNotFoundError --
      # an environment failure sitting right after cargo-deny reported licences ok.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check deny.toml / about.toml licence-list sync
        shell: bash
        run: ./script/check_license_config_sync

  check-linux:
    name: cargo check (Linux)
    # ubuntu-22.04 (glibc 2.35) matches the release Linux job.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      - name: Ensure rust target is installed
        shell: bash
        run: rustup target add x86_64-unknown-linux-gnu

      # The GUI feature is the guardrail after any shared-crate change.
      - name: cargo check -p warp --features gui
        shell: bash
        run: cargo check -p warp --features gui --lib --tests

      # Single-package checks miss feature-unified code. `warp`'s
      # `integration_tests` feature gates `app/src/integration_testing`
      # (e.g. `llm_judge/mod.rs`), and `gui` above does not enable it -- it
      # only turns on via Cargo feature unification, when `warp` is checked
      # in the SAME invocation as a crate that depends on
      # `warp = { features = ["integration_tests"] }` (`crates/integration`).
      # A real build break lived on `main` unnoticed for exactly this reason
      # (#230): `cargo check -p warp --features gui` above stayed green while
      # `llm_judge/mod.rs` didn't compile, because nothing in this workflow
      # ever checked `warp` and `integration` together. This is the same
      # multi-package command from #230 that first caught it, and the one
      # `script/precheck` already runs locally -- keep it here too as the
      # regression test for the gap, not just for the one break.
      - name: cargo check (feature-unified, multi-package)
        shell: bash
        run: cargo check -p warp -p warp_completer -p integration -p app-installation-detection -p warp_ripgrep --features gui

      # The app crate carries the TUI via its own `tui` feature.
      - name: cargo check -p warp --features tui
        shell: bash
        run: cargo check -p warp --features tui

      # The warp_tui crate is not in default-members; check it explicitly.
      - name: cargo check -p warp_tui
        shell: bash
        run: cargo check -p warp_tui

  # The suite has never run in CI. Compile checks and the boundary guards catch
  # a lot, but neither one can tell you a test went red -- which is the failure
  # this project actually cares about, and the reason "don't merge red" has so
  # far depended on a human remembering to look.
  #
  # NOT a required status check yet, deliberately. `main` currently carries 11
  # red tests (6 unintentional, from hunks two porting agents flagged as
  # uncompiled; 5 deliberate, pinning issues #251/#253). Promoting this to
  # required before those are resolved would block every open PR on a failure
  # none of them caused -- exactly the cascade that made the boundary guard
  # worthless when PR #246 was merged past it.
  #
  # Promote it in the branch-protection contexts once the suite is green.
  test-linux:
    name: cargo nextest (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      # This is the heaviest build in the workflow -- the warp + warp_tui test
      # binaries. agent-cargo defaults to 5 parallel jobs, sized for a 24-core/45GB
      # host; a standard runner has 4 cores and ~16GB, and 5 concurrent rustc
      # processes on the `warp` crate got the runner killed mid-compile ("The runner
      # has received a shutdown signal", exit 143) after ~12 minutes, nowhere near
      # this job's timeout. Trading build time for headroom is the right way round:
      # a slower job costs minutes, a reaped runner costs the whole run.
      PHOSPHOR_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      # nextest, not `cargo test`: this suite was stabilised under nextest's
      # process-per-test isolation. Several tests depend on it (the ssh-onekey
      # singleton, the secrets-regex serial group), and would fail differently
      # in a shared test process.
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Fails on CHANGE, not on redness -- see script/check_test_failures for
      # why. `main` has known reds; a job that is red on every PR forever is a
      # job everyone learns to ignore.
      #
      # BOTH crates run in ONE invocation, deliberately:
      #
      #   - `warp_tui` was not gated at all until #465. Its 620 tests ran
      #     nowhere, and two user-visible regressions sat on `main` unnoticed
      #     as a result (no agent-mode prompt gutter; no selection markers on
      #     custom answers). Anything not in CI is not actually tested.
      #   - It must be one invocation, not two steps. check_test_failures
      #     treats a listed failure that did NOT run as "fixed" and exits 1, so
      #     a second invocation covering only one crate would fail the gate on
      #     the other crate's known failures.
      #   - The feature is package-qualified (`warp/gui`) because `warp_tui`
      #     has no `gui` feature of its own; a bare `--features gui` errors out
      #     once more than one package is selected.
      - name: cargo nextest (regressions only)
        shell: bash
        run: ./script/check_test_failures -p warp -p warp_tui --lib --features warp/gui

  # warpui_core (#573): `--features tui` is NOT optional. `tui` is off by
  # default (crates/warpui_core/Cargo.toml) and `elements/tui/` is
  # `#[cfg(feature = "tui")]`, so without the flag that whole module is not
  # compiled -- its tests do not fail, they do not EXIST. A run without the
  # flag reports ~306 passing and looks green while saying nothing about the
  # other 259. This package cannot join the `test-linux` invocation above: it
  # is not all lib tests and needs a different feature set, and
  # check_test_failures treats a listed known failure that did not run as
  # "fixed" and exits 1 -- mixing package sets across runs breaks that gate.
  #
  # This job (and the one below) is new: until 2026-08-08 this package had
  # never run in ANY gate, on any machine (script/precheck, same commit).
  # Runs as its own job, parallel with test-linux/integration-linux, rather
  # than as an extra step in test-linux, so a failure here is unambiguous
  # about which suite broke and so the job matrix runs concurrently instead
  # of adding its ~565 tests' compile+run time serially onto test-linux.
  test-warpui-core:
    name: cargo nextest -p warpui_core --features tui (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: cargo nextest -p warpui_core --features tui (regressions only)
        shell: bash
        run: ./script/check_test_failures -p warpui_core --features tui

  # The rest of the workspace (#573): 40 further packages measured on
  # 2026-08-08 -- 2,126 tests that, like warpui_core above, had never run in
  # any gate, on any machine. That first run found one real defect
  # (persistence's #[cfg(test)] fixture had stopped compiling, so its 17 tests
  # had silently not existed).
  #
  # ONE invocation listing every package, exactly as script/precheck does --
  # do not split this into per-package steps or jobs:
  #   - `cargo nextest run --workspace` fails outright on
  #     command-signatures-v2, whose build script shells out to yarn; it has
  #     0 tests, so it is excluded by name rather than fixed.
  #   - check_test_failures treats a listed known failure that did not run as
  #     "fixed" and exits 1, so splitting the package list would fail this
  #     gate on whichever half's known failures didn't run.
  #   - splitting also thrashes the shared target dir: each partial
  #     invocation resolves features separately and rebuilds shared
  #     proc-macro crates, which is slower overall than one invocation.
  #
  # NOTE (still open, see script/precheck): this runs DEFAULT features only.
  # Code behind `local_fs` (repo_metadata, persistence, ai), `plugin_host`
  # (warp_cli) and `test-util` is still not exercised here.
  test-workspace-rest:
    name: cargo nextest (rest of the workspace, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Package list copied verbatim from script/precheck's "rest of the
      # workspace (40 packages)" step -- do not retype it; a typo here
      # silently drops a package from CI the same way it would locally.
      - name: cargo nextest (40 packages, regressions only)
        shell: bash
        run: |
          ./script/check_test_failures \
              -p sum_tree -p string-offset -p fuzzy_match -p handlebars -p syntax_tree \
              -p languages -p asset_cache -p settings_value -p jsonrpc -p simple_logger \
              -p warp_logging -p channel_versions -p command -p http_client -p warp_features \
              -p managed_secrets_wasm -p voice_input -p warp_isolation_platform -p websocket \
              -p input_classifier -p warp_search_core -p persistence -p settings \
              -p warp_managed_secrets -p markdown_parser -p warp_util -p warp_core \
              -p repo_metadata -p warp_terminal -p warp_files -p local_control -p vim \
              -p warp_completer -p warpui -p warpui_extras -p ai -p remote_server \
              -p usage_suite -p warp_editor -p warp_cli

  # crates/integration (#208): ~300 GUI-driving scenarios that link, register,
  # and are enumerated by `--list`, but until this job existed were never
  # actually EXECUTED anywhere -- not in CI, not on any dev host in this fleet.
  # That is worse than having no suite: every green build read as if these
  # scenarios were covered, when not one assertion inside them had ever run.
  #
  # Why nothing ran them: the harness boots the real GUI app (`LaunchMode::Test`
  # is not headless -- see `app/src/lib.rs`), and on Linux window creation goes
  # through the real winit backend unconditionally (`crates/warpui/src/platform/
  # linux/mod.rs` is a bare re-export of the winit `App`; the mac-only "skip the
  # Metal device, keep the window off-screen" branch in `platform/mac/window.rs`
  # has no Linux equivalent). So even an invisible window needs a live X/Wayland
  # connection to open at all, and this fleet's hosts (and, historically, CI)
  # have none. `xvfb-run` supplies that connection; `mesa-vulkan-drivers`
  # (installed by `install_test_deps`) supplies the software renderer behind it.
  # The code already anticipated exactly this ("Propagate XAUTHORITY so we can
  # run headless tests using xvfb", `crates/integration/tests/common/mod.rs`) --
  # it was just never wired to anything that supplies an Xvfb.
  #
  # NOT a required status check, and deliberately NOT gated through
  # `script/check_test_failures`: unlike the `warp`/`warp_tui` suite, nobody has
  # ever run this suite to completion, so there is no known-good baseline to
  # diff against -- `known_test_failures.txt`'s own header records that the
  # `cargo nextest (Linux)` job above only got ITS baseline from a first real
  # run (2026-08-07: 4280 tests). Follow the same path here: let this job run
  # honestly for a while, then have a human triage the failures into a
  # baseline file and switch this job to `check_test_failures`, same as that
  # one. Until then a red run here is signal to read, not a blocked merge --
  # many of these scenarios exercise SSH, specific shells, or flags this runner
  # may not satisfy, and some are already `#[ignore]`d in-file for reasons
  # unrelated to display (feature-flag churn, known CI flakiness).
  integration-linux:
    name: cargo nextest -p integration (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      # install_test_deps (not the default build-only path) is what pulls in
      # the shells (bash/zsh/fish), vim, mesa-vulkan-drivers, the X11/Wayland
      # runtime libs, and xvfb that this specific suite -- and only this
      # suite, among the pr-check jobs -- actually needs.
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_test_deps: true

      # nextest, not `cargo test`: same process-per-test isolation rationale
      # as the warp/warp_tui job above, and required here for another reason
      # too -- each test opens its own GUI window, and a shared test process
      # would leak windowing state across tests that `cargo test`'s in-process
      # model cannot isolate.
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: cargo nextest -p integration (headless via Xvfb)
        shell: bash
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo nextest run -p integration --no-fail-fast

  check-windows:
    name: cargo check (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false

      # Compile-checks the `cfg(windows)` code the Linux job can't reach
      # (PATHEXT executable resolution, login-item registration, etc.).
      - name: cargo check -p warp --features gui
        shell: bash
        run: cargo check -p warp --features gui --lib --tests

      - name: cargo check -p warp --features tui
        shell: bash
        run: cargo check -p warp --features tui

      - name: cargo check -p warp_tui
        shell: bash
        run: cargo check -p warp_tui

      # RUN them, don't just compile them. Several `cfg(windows)` tests exist
      # and have never once executed, because this job only ever ran
      # `cargo check` -- which is exactly why TODO.md carried "compile-only
      # port, still not runtime-verified" for WSLENV passthrough (#117), pwsh
      # -EncodedCommand, and launch-at-login (#118/#484).
      #
      # These are real runtime checks, not compile checks:
      #   login_item::windows_tests  - writes and reads ACTUAL registry values
      #                                under a scratch key, then cleans up
      #   windows::environment_tests - WSLENV allowlist construction
      #   util::encode_pwsh_command  - the PS 7.6 quoting-crash workaround
      #
      # Filtered rather than a full suite run: the Linux job already covers
      # everything portable, and a whole Windows suite would dominate this
      # workflow's wall clock for no added signal.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9ba3ac3fd006a70c6e186a683577abc1ccf0ff3a # v2
        with:
          tool: nextest

      - name: Run Windows-specific tests (not just compile them)
        shell: bash
        run: |
          cargo nextest run -p warp --features gui --no-fail-fast \
            -E 'test(/login_item/) or test(/environment_tests/) or test(/encode_pwsh_command/) or test(/wsl_env/) or test(/pwsh/)'

  # Same rationale as check-windows above, mirrored for `cfg(target_os =
  # "macos")` code: `app/src/login_item/macos.rs` had zero `#[test]`
  # functions until this job existed, so nothing ever executed the objc2 FFI
  # calls it makes at runtime -- only whether they compiled.
  #
  # The "compile tests, then run them" two-step shape below (rather than a
  # single `cargo nextest run`) is carried over from the pinned oracle's CI
  # (`02b53fcd8:.github/workflows/ci.yml`, the `tests` job's "Compile tests"
  # / "Run unit tests" steps): a compile break then reads as a compile
  # failure, not a confusing "test failed".
  #
  # Deliberately narrower than the pin, though: the pin's macOS job runs the
  # full workspace suite (`$WORKSPACE_TEST_ARGS --workspace`) on a larger
  # self-hosted Mac runner. This job runs on generic `macos-latest` and,
  # like check-windows above, is filtered to the platform-specific tests
  # this fork actually added -- the Linux jobs already cover everything
  # portable, and this fork doesn't have the pin's runner budget for a full
  # macOS suite on every PR.
  check-macos:
    name: cargo check (macOS)
    runs-on: macos-latest
    # The pin budgets 25 minutes for a full-workspace compile+run on a
    # larger self-hosted runner (see job comment above). This job instead
    # does three separate `cargo check` invocations plus a filtered nextest
    # compile+run on generic `macos-latest`, so it keeps check-windows's
    # more generous budget rather than the pin's tighter one.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false

      # Compile-checks the `cfg(target_os = "macos")` code the Linux and
      # Windows jobs can't reach (SMAppService login-item registration, the
      # dock tile plugin, default-terminal registration via Launch
      # Services, etc.).
      - name: cargo check -p warp --features gui
        shell: bash
        run: cargo check -p warp --features gui --lib --tests

      - name: cargo check -p warp --features tui
        shell: bash
        run: cargo check -p warp --features tui

      - name: cargo check -p warp_tui
        shell: bash
        run: cargo check -p warp_tui

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9ba3ac3fd006a70c6e186a683577abc1ccf0ff3a # v2
        with:
          tool: nextest

      # `--no-run` first, matching the pin's two-step shape described above:
      # builds the test binary without running anything, so a compile break
      # shows up as THIS step failing, not as a mysteriously-empty next one.
      - name: Compile macOS-specific tests (not run them yet)
        shell: bash
        run: cargo nextest run -p warp --features gui --no-run -E 'test(/login_item/)'

      # RUN them, don't just compile them -- the same gap this fork closed
      # on the Windows side above: `login_item::macos` had 0 `#[test]`
      # functions before this, so there was nothing here for even a passing
      # `cargo check` to be silent about.
      #
      # These are real runtime checks, not compile checks:
      #   login_item::macos::tests::sm_app_service_class_is_available
      #     - a real objc2 `AnyClass::get` lookup of `SMAppService`, which
      #       requires `ServiceManagement.framework` to actually be linked
      #       into the process (see build.rs)
      #   login_item::macos::tests::bundle_presence_check_does_not_crash
      #     - a real `[NSBundle mainBundle]` msg_send call
      #
      # Both are read-only queries: this module's actual register/unregister
      # calls are NOT exercised here. Unlike the Windows registry path,
      # `SMAppService`'s identity is tied to the calling process's code
      # signature / bundle identifier, which offers no scratch address a
      # test can redirect to without either mutating real login-item state
      # or silently no-op-ing. See docs/sweep/outcome-macos-login-item.md.
      - name: Run macOS-specific tests (not just compile them)
        shell: bash
        run: cargo nextest run -p warp --features gui --no-fail-fast -E 'test(/login_item/)'

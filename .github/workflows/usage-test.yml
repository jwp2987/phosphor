# Usage / acceptance test suite — headless GUI + TUI smoke tests.
#
# Runs `./script/usage-test` (see specs/usage-test-suite/SCOPE.md): the in-process
# `warp_tui` view harness for the TUI surface, and the reliable-here GUI scenarios
# via the `integration` binary. The GUI scenarios DO create a real winit event
# loop, so they need a display and are wrapped in `xvfb-run` — matching
# pr-check.yml's `-p integration` job. (This header previously claimed a MOCK
# display needing no xvfb; that was wrong, and every nightly GUI scenario failed
# on "neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set" until
# 2026-08-11.) Real-shell command-completion scenarios (the preexec race)
# are gated behind `--include-flaky` and allowed to soft-fail until that race is
# resolved. BYOP agent-round-trip scenarios (`--include-byop`) need a real provider
# key + network and are not run in CI.
#
# Runs on Linux, macOS AND Windows (matrix, fail-fast off) as of 2026-08-11.
# Previously Linux-only, which meant the macOS and Windows code paths had no
# runtime coverage anywhere -- the gap behind TODO.md's "compile-only, not
# runtime-verified" entries. Only Linux needs the xvfb wrapper; macOS and
# Windows runners have real desktop sessions. On Windows `shell: bash`
# resolves to Git Bash, so the #!/bin/bash runner script works unmodified.
#
# Manual dispatch + nightly. PR validation stays in pr-check.yml (fast cargo check).
name: Usage Test Suite

on:
  workflow_dispatch:
    inputs:
      include_flaky:
        description: "Also run real-shell (--include-flaky) scenarios (soft-fail)"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * *" # nightly ~07:00 UTC

concurrency:
  group: usage-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  usage-test:
    name: usage-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One platform failing must not cancel the others -- the whole point of
      # running this on three OSes is to see WHICH ones break.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) matches the release Linux job + pr-check.yml.
          - os: linux
            name: Linux
            runner: ubuntu-22.04
            target_os: linux
            # Headless runner: the GUI scenarios create a real winit event
            # loop, so they need a display. See the header.
            display_wrapper: 'xvfb-run -a -s "-screen 0 1280x1024x24" '
          - os: macos
            name: macOS
            runner: macos-latest
            target_os: macos
            # macOS runners have a real WindowServer session; no wrapper.
            display_wrapper: ''
          - os: windows
            name: Windows
            runner: windows-latest
            target_os: windows
            # Windows runners have a desktop session; no wrapper. `shell: bash`
            # below resolves to Git Bash, which ships on the runner image, so
            # script/usage-test (a #!/bin/bash script) runs unmodified.
            display_wrapper: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Free up disk space
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      # install_test_deps is what pulls in xvfb (and the X11/Wayland runtime
      # libs). Without it the GUI usage scenarios die on
      # "neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set" —
      # see the xvfb-run wrapper on the suite steps below.
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.target_os }}
          is_self_hosted: false
          install_test_deps: true

      # The runner shells out to `cargo nextest` for the TUI surface; install it.
      # (The runner degrades gracefully if it's missing, but CI should exercise TUI.)
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9ba3ac3fd006a70c6e186a683577abc1ccf0ff3a # v2
        with:
          tool: nextest

      # DIAGNOSTIC (Windows only, 2026-08-12). Every GUI scenario fails there
      # at bootstrap: pwsh emits its InitShell hook and then exits cleanly with
      # code 0, and the captured stream carries PowerShell CLIXML envelopes.
      # CLIXML means pwsh believes its output is REDIRECTED rather than
      # console-attached, which would also explain an immediate REPL exit
      # (stdin at EOF). This isolates "can pwsh stay alive under -NoExit
      # -EncodedCommand on this runner at all" from "does the app's bootstrap
      # work" -- without it we would be guessing at fixes across 20-minute CI
      # cycles. Remove once the Windows GUI bootstrap is understood.
      - name: Diagnose pwsh interactivity (Windows only)
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Write-Host "Host name: $($Host.Name)"
          Write-Host "stdout redirected: $([Console]::IsOutputRedirected)"
          Write-Host "stdin  redirected: $([Console]::IsInputRedirected)"
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('Write-Host "child-alive"'))
          Write-Host "--- child with -NoExit -EncodedCommand (expect it to hang until timeout if interactive) ---"
          $p = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList @("-NoLogo","-NoProfile","-NoExit","-EncodedCommand",$enc)
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "RESULT: child EXITED early with code $($p.ExitCode) -- -NoExit did NOT keep it alive"
          } else {
            Write-Host "RESULT: child still running after 5s -- -NoExit works here"
            $p | Stop-Process -Force
          }

      - name: Usage suite — TUI + reliable-here GUI
        shell: bash
        run: ${{ matrix.display_wrapper }}./script/usage-test --surface both

      - name: Usage suite — real-shell (flaky, soft-fail)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_flaky }}
        continue-on-error: true
        shell: bash
        run: ${{ matrix.display_wrapper }}./script/usage-test --include-flaky

# cargo-about configuration for generating third-party license attribution.
#
# The accepted license list must stay in sync with deny.toml's [licenses.allow].
# CI enforces this via script/check_license_config_sync.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude private workspace crates (publish = false).
private = { ignore = true }

# Build and dev dependencies are not redistributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Built-in workarounds for crates with complicated license packaging.
workarounds = [
    "ring",
    "rustls",
]

# Warp's own crates, pulled in via git from the warpdotdev organization. They
# are not workspace members.
#
# They ARE licensed -- the previous version of this comment said they "do not
# have explicit licenses yet (they will be open-sourced soon)", which stopped
# being true. Each one's declared `license` field, read from the checkout in
# ~/.cargo/git at the pinned rev:
#
#   - command-corrections        AGPL-3.0-only   (see the discrepancy note below)
#   - warp-command-signatures    MIT             (workspace: command-signatures)
#   - warp-completion-metadata   MIT             (same workspace)
#   - warp-workflows             Apache-2.0      (workspace: workflows)
#   - warp-workflows-types       Apache-2.0      (same workspace)
#   - warp_multi_agent_api       AGPL-3.0-only   (workspace: warp-proto-apis)
#   - mermaid_to_svg             MIT
#   - dagre_rust                 Apache-2.0      (same workspace as mermaid_to_svg)
#
# DISCREPANCY, unresolved: command-corrections declares
# `license = "AGPL-3.0-only"` in its Cargo.toml, but ships a LICENSE.md whose
# text is the MIT License (Copyright (C) 2026 Denver Technologies, Inc.). The
# two disagree. Nothing here depends on resolving it -- the crate is skipped
# either way, see below -- but it should be raised upstream rather than
# silently picked one way or the other.
#
# `session-sharing-protocol` was in this list and is NOT in Cargo.lock; it is
# no longer a dependency and has been removed from the list.
#
# All of these carry `publish = false`, so `private = { ignore = true }` above
# makes cargo-about skip them during generation. That is why `--fail` is not
# passed to the generate invocation. Note that two of them are AGPL-3.0-only,
# which is NOT on the accepted list -- if `private.ignore` were ever turned
# off, generation would fail on those two, not on a missing license field.

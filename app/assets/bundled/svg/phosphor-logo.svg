<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 512 512"
   version="1.0"
   id="phosphor"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#423228"/>
      <stop offset="100%" stop-color="#1c1510"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffb437"/>
      <stop offset="100%" stop-color="#ffe6a8"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="146" y="432" width="220" height="30" rx="12" fill="url(#bezel)"/>
  <!-- neck -->
  <rect x="216" y="388" width="80" height="52" rx="10" fill="url(#bezel)"/>

  <!-- monitor chassis -->
  <rect x="70" y="56" width="372" height="336" rx="36" fill="url(#bezel)"/>

  <!-- screen -->
  <rect x="108" y="94" width="296" height="260" rx="18" fill="#0f0a02"/>

  <!-- prompt chevron -->
  <path
     d="M 154 168 L 232 224 L 154 280"
     fill="none"
     stroke="url(#glow)"
     stroke-width="28"
     stroke-linecap="round"
     stroke-linejoin="round" />
  <!-- cursor bar -->
  <rect x="258" y="252" width="96" height="28" rx="6" fill="url(#glow)"/>
</svg>

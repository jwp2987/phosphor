# Default worktree tab config
# Stored in the `default_tab_configs` directory you opened this file from — you
# can customize it! (That directory lives under Phosphor's data directory,
# which is a channel-specific dotfile directory in $HOME on macOS and the XDG
# data directory on Linux, so it is not a fixed path worth writing down here.)
# Any customizations will apply for any new worktree configs going forward that are created from the "New worktree config" flow
#
# This config is used by the "Worktree in" submenu to quickly create
# worktrees under `<data directory>/worktrees/<repo-name>/<worktree-name>` for
# your known repositories.

name = "Worktree"

[[panes]]
id = "main"
type = "{{pane_type}}"
directory = "{{repo}}"
commands = [
  "git worktree add -b {{autogenerated_branch_name}} \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"",
  "cd \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"",
]

[params.repo]
type = "repo"
description = "Repository to create worktree in"

[params.pane_type]
type = "text"
description = "Pane type (terminal or agent)"
default = "terminal"
